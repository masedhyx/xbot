 think:e=>{const u=.5-.5*Math.cos(e*1.3);return{b:[0,0],L:mx([225.2,81.8,15.4,180,146.4,16.5],[282,66,19.3,253,116,21.2],u),R:mx([316.7,135,25.6,281.6,185.4,25.6],[395,100,27,375,141,26.6],u)}},

 done:EFX[5]

function fxMix(P,f,w){
 for(const s of[3,9]){if(P[s+1]>P[s+4])for(let k=0;k<3;k++){const t=P[s+k];P[s+k]=P[s+3+k];P[s+3+k]=t}}
 const lc=(a,b)=>a+(b-a)*(f.arc?Math.min(1,w*2):w);
 for(let k=0;k<6;k++){P[3+k]=lc(P[3+k],f.L[k]);P[9+k]=lc(P[9+k],f.R[k])}
 if(f.arc&&w>.5){const t=sm((w-.5)*2),A=f.arc,ar=x=>`M${(x-A.a).toFixed(1)} ${(A.y+.5*A.R*t).toFixed(1)}Q${x} ${(A.y-1.5*A.R*t).toFixed(1)} ${(x+A.a).toFixed(1)} ${(A.y+.5*A.R*t).toFixed(1)}`;P.arc=[ar(A.x[0]),ar(A.x[1]),2*A.sr]}
 P[0]=lp(P[0],NEU[0]+f.b[0],w);P[1]=lp(P[1],NEU[1]+f.b[1],w);P[2]=lp(P[2],NEU[2],w);
 if(w>.5)P.v=3}
function fxArc(E,P){for(let k=0;k<2;k++){const s=E[k].style;if(P.arc){E[k].setAttribute('d',P.arc[k]);s.fill='none';s.stroke='#000';s.strokeWidth=P.arc[2];s.strokeLinecap='round'}else if(s.stroke){s.fill=s.stroke=s.strokeWidth=s.strokeLinecap=''}}}
function fxPose(ms,j,P){const T=ms/1000,C=Math.floor(T/FXC),e=T-C*FXC-FXD,len=FXC-FXD;if(e<0)return;
 const w=Math.min(sm(e/FXE),sm((len-e)/FXE));if(w<=0)return;
 fxMix(P,EFX[(C+j)%EFX.length](e),w)}
function mk(svg,always,ph=0,ex,st){const bd=svg.querySelector('.bd'),cc=svg.querySelector('.cc'),E=svg.querySelectorAll('.e'),t0=performance.now()-ph;let stg=null,ts=0,last=null,snap=null;
 const b={svg,always,draw(now){pose(now-t0,PS);if(ex!==undefined){PS.arc=null;fxPose(now-t0,ex,PS)}else if(stg){PS.arc=null;const e=(now-ts)/1000;if(snap)for(let k=0;k<15;k++)PS[k]=snap[k];PS.v=3;fxMix(PS,stg(e),sm(e/FXE))}const x=PS[0].toFixed(1),y=PS[1].toFixed(1),r=PS[2].toFixed(1);
  for(const el of[bd,cc]){el.setAttribute('cx',x);el.setAttribute('cy',y);el.setAttribute('r',r)}
  E[0].setAttribute('d',PS.v&2?hull(PS[3],PS[4],PS[5],PS[6],PS[7],PS[8]):'');E[1].setAttribute('d',PS.v&1?hull(PS[9],PS[10],PS[11],PS[12],PS[13],PS[14]):'');if(ex!==undefined||stg)fxArc(E,PS);if(st)last=PS.slice(0,15)}};
 BOTS.add(b);b.draw(performance.now());return{set(s){stg=SFX[s]||null;ts=performance.now();snap=last?last.slice():null}}}
const tick=n=>{for(const b of BOTS){if(!b.svg.isConnected){BOTS.delete(b);continue}if(b.always||open)b.draw(n)}requestAnimationFrame(tick)};requestAnimationFrame(tick);

/* ===== PANEL & BOT ===== */
function renderBots(){$('#bl').innerHTML=cfg.bots.map((b,i)=>HIDE.includes(i)?'':`<button class="bi${i==cur?' on':''}" data-i="${i}">${bot(COL[i])}<span>${esc(b.name)}</span></button>`).join('');
 $('#bl').querySelectorAll('svg').forEach((s,j)=>mk(s,false,j*3100,j))}
function welcome(){$('#ms').innerHTML=`<div id="wl">${bot("#fff")}<h2>Halo, EdhyX</h2><p>${esc(cfg.bots[cur].name)} siap ngobrol</p></div>`;mk($('#wl svg'),true)}
const setOpen=v=>{open=v;document.body.classList.toggle('o',v)};
$('#mb').onclick=()=>setOpen(!open);
$('#mn').addEventListener('click',e=>{if(open){e.preventDefault();e.stopPropagation();setOpen(false)}},true);

$('#nw').onclick=()=>{reset();setOpen(false)};$('#cl').onclick=()=>{reset();setOpen(false)};

/* ===== CHAT ===== */
const LBL={think:'sedang berpikir',analyze:'menganalisis',look:'melihat foto',search:'mencari di web',read:'membaca sumber',write:'sedang menulis',done:'selesai'};
const add=h=>{const w=$('#wl');if(w)w.remove();const d=document.createElement('div');d.innerHTML=h;const n=d.firstElementChild;$('#ms').appendChild(n);$('#ms').scrollTop=1e9;return n};
$('#pl').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.85);$('#pv').textContent='📎 foto terlampir'};i.src=r.result};r.readAsDataURL(f);e.target.value=''};
$('#tx').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
$('#sd').onclick=send;
async function send(){
 if(busy){ctrl.abort();return}
 const t=$('#tx').value.trim();if(!t&&!img)return;
 const im=img,gen=/^\/gambar\s/i.test(t);$('#tx').value='';$('#tx').style.height='auto';img=null;$('#pv').textContent='';
 hist.push({role:'user',content:t||'Jelaskan foto ini.'});
 add(`<div class="um">${im?`<img src="${im}">`:''}${esc(t)}</div>`);
 busy=true;$('#sd').textContent='■';ctrl=new AbortController();
 const b=cfg.bots[cur],st=add(`<div class="stt">${bot(COL[cur])}<span></span></div>`),eb=mk(st.querySelector('svg'),true,0,undefined,true);
 const stage=s=>{eb.set(s);st.querySelector('span').textContent=b.name+' '+LBL[s]+'...'};stage(im?'look':'think');
 let fin;
 try{
  const r=await fetch(cfg.url.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
   body:JSON.stringify({messages:hist.slice(-12),image:im,image_gen:gen,system:b.prompt,model:cfg.model,imgModel:cfg.img,mode:cfg.mode,keys:cfg.keys})});
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i);buf=buf.slice(i+1);if(!l)continue;const j=JSON.parse(l);if(j.s)stage(j.s);else fin=j}}
 }catch(e){fin=e.name=='AbortError'?{text:'(dihentikan)'}:{error:'Tidak bisa terhubung ke Worker: '+e.message}}
 if(fin&&!fin.error){stage('write');
  const box=add(`<div class="bm"><div class="bt"></div></div>`),bt=box.querySelector('.bt'),tx=fin.text||'',step=Math.max(2,Math.ceil(tx.length/160));
  if(fin.image)bt.innerHTML=`<img src="${fin.image}">`;
  for(let i=0;i<=tx.length&&busy;i+=step){bt.innerHTML=(fin.image?`<img src="${fin.image}">`:'')+md(tx.slice(0,i));$('#ms').scrollTop=1e9;await sleep(18)}
  bt.innerHTML=(fin.image?`<img src="${fin.image}">`:'')+md(tx);
  if(fin.sources?.length)box.insertAdjacentHTML('beforeend',`<div class="src">Sumber${fin.provider?' · '+esc(fin.provider):''}${fin.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`).join('')}</div>`);
  else if(fin.provider)box.insertAdjacentHTML('beforeend',`<div class="src">${esc(fin.provider)}</div>`);
  box.insertAdjacentHTML('beforeend',`<div class="ac"><button data-a="c">⧉</button><button data-a="s">🔊</button><button data-a="l">👍</button><button data-a="h">↗</button></div>`);
  box.dataset.t=tx;hist.push({role:'assistant',content:tx||'[gambar]'});eb.set('done');await sleep(900);
 }else if(fin?.error)add(`<div class="bt err">⚠️ ${esc(fin.error)}</div>`);
 st.remove();busy=false;$('#sd').textContent='↑';$('#ms').scrollTop=1e9}
$('#ms').onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;const t=a.closest('.bm').dataset.t;
 if(a.dataset.a=='c')navigator.clipboard?.writeText(t);if(a.dataset.a=='h')navigator.share?.({text:t}).catch(()=>{});
 if(a.dataset.a=='s'){speechSynthesis.cancel();speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(t),{lang:'id-ID'}))}
 if(a.dataset.a=='l')a.style.opacity=a.style.opacity=='1'?.85:1}

async function sha(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function settings(){
 try{MODELS=await(await fetch(cfg.url.replace(/\/$/,'')+'/models')).json()}catch{MODELS=[]}
 const K=['groq','gemini','tavily','exa','firecrawl'];
 $('#sm').hidden=false;$('#sm').innerHTML=`<button id="x" style="font-size:17px;color:#6ab0ff">← Kembali</button>
 <h3>Worker URL</h3><input id="s_url" value="${esc(cfg.url)}">
 <h3>API key (disimpan di browser ini saja; kosong = pakai secret Worker)</h3>${K.map(k=>`<input type="password" id="k_${k}" placeholder="${k}" value="${esc(cfg.keys[k]||'')}">`).join('')}
 <h3>Model AI</h3><select id="s_model">${MODELS.map(m=>`<option value="${m.id}"${m.id==cfg.model?' selected':''}>${esc(m.label)}</option>`).join('')||'<option>(Worker belum terhubung)</option>'}</select>
 <h3>Model gambar (Gemini)</h3><input id="s_img" placeholder="gemini-2.5-flash-image" value="${esc(cfg.img)}">
 <h3>Mode pencarian web</h3><select id="s_mode">${[['auto','Otomatis'],['on','Selalu'],['off','Mati']].map(m=>`<option value="${m[0]}"${m[0]==cfg.mode?' selected':''}>${m[1]}</option>`).join('')}</select>
 <h3>Nama & prompt bot</h3><button id="ub" class="bo" style="width:100%;text-align:left">🔒 Buka dengan sandi</button><div id="bp"></div>
 <button id="sv" class="bo" style="width:100%;margin-top:22px!important;text-align:center;background:#fff!important;color:#000">Simpan</button>`;
 let unlocked=false;
 $('#ub').onclick=async()=>{const p=prompt('Sandi:');if(p===null)return;if(await sha(p)!=PW_HASH)return alert('Sandi salah');unlocked=true;$('#ub').remove();
  $('#bp').innerHTML=cfg.bots.map((b,i)=>HIDE.includes(i)?'':`<div class="bo"><div style="display:flex;gap:10px;align-items:center"><div style="width:18px;flex:none">${bot(COL[i])}</div><input id="n${i}" value="${esc(b.name)}"></div><textarea id="p${i}">${esc(b.prompt)}</textarea></div>`).join('')};
 $('#x').onclick=()=>$('#sm').hidden=true;
 $('#sv').onclick=()=>{cfg.url=$('#s_url').value.trim();K.forEach(k=>cfg.keys[k]=$('#k_'+k).value.trim());cfg.model=$('#s_model').value;cfg.img=$('#s_img').value.trim();cfg.mode=$('#s_mode').value;
  if(unlocked)cfg.bots.forEach((b,i)=>{if(HIDE.includes(i))return;b.name=$('#n'+i).value||b.name;b.prompt=$('#p'+i).value});
  save();renderBots();reset();$('#sm').hidden=true;setOpen(false)}}
$('#st').onclick=settings;
renderBots();welcome();
</script></body></html>
