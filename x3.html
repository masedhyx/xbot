<script>
/* daftar model */
const DEF_MODEL='gemini:gemini-3.8-flash',DEF_IMG='gemini-3.1-flash-image';
const FALLBACK_MODELS=[{id:'gemini:gemini-3.8-flash',label:'gemini-3.8-flash'},{id:'gemini:gemini-3.6-flash',label:'gemini-3.6-flash'},{id:'gemini:gemini-3.5-flash-lite',label:'gemini-3.5-flash-lite'},{id:'gemini:gemini-3.1-flash-lite',label:'gemini-3.1-flash-lite'},{id:'gemini:gemini-2.5-flash',label:'gemini-2.5-flash'},{id:'gemini:gemini-2.5-flash-lite',label:'gemini-2.5-flash-lite'},{id:'groq:openai/gpt-oss-120b',label:'GPT-OSS 120B — paling kuat'},{id:'groq:openai/gpt-oss-20b',label:'GPT-OSS 20B — lebih ringan & cepat'},{id:'groq:qwen/qwen3.8-27b',label:'Qwen 3.8 27B — penalaran & umum'}];
const FALLBACK_IMG=[{id:'gemini-3.1-flash-image',label:'gemini-3.1-flash-image'}];
const SERVER_URL='https://xbot.edhymaster70.workers.dev';
const PW_HASH='42d5eaa7af283ddcd8f11ce357934a5ec7aa4e21f37c029a2ee047ab889d2ae9';
const COL=['#ff1a1a','#0066ff','#a6ff00','#9b30ff','#ffe000','#ff8000','#ff2d92','#cf7a30','#00e0d0','#00c853','#ffffff'];
const NM=['Merah','Biru','Hijau Stabilo','Ungu','Kuning','Orange','Pink','Coklat','Tosca','Hijau'];
const TRAIT=['ramah dan santai','tegas dan to the point','tenang dan analitis','ceria dan penuh semangat','lucu dan suka bercanda','bijak dan sabar','manis dan perhatian','santai ala anak tongkrongan','detail dan teliti','serius dan profesional'];
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const CMAP={merah:'#ff5a5a',red:'#ff5a5a',hijau:'#3ddc84',green:'#3ddc84',biru:'#4da3ff',blue:'#4da3ff',kuning:'#ffd60a',yellow:'#ffd60a',oranye:'#ff9f0a',orange:'#ff9f0a',ungu:'#bf5af2',purple:'#bf5af2',pink:'#ff6bb5',tosca:'#2ee6d6',coklat:'#d2915a',abu:'#aaa',putih:'#fff'};
const cv=n=>{n=n.toLowerCase();return CMAP[n]||(/^#[0-9a-f]{3,8}$/i.test(n)?n:null)};
const col=s=>s.replace(/\[c=(#?\w+)\]([\s\S]*?)\[\/c\]/g,(m,n,t)=>cv(n)?`<span style="color:${cv(n)}">${t}</span>`:t).replace(/\[c=(#?\w+)\]([\s\S]*)$/,(m,n,t)=>cv(n)?`<span style="color:${cv(n)}">${t}</span>`:m);
const md0=(s,p)=>col(esc(p?s.replace(/\[\/?c?=?#?\w*$/,''):s)).replace(/```(?:\w*\n)?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');

/* ===== MARKDOWN TAMBAHAN: tabel, judul, garis, diagram; sembunyikan "Sumber: [n]" ===== */
const CIT=(t,p)=>{t=t.replace(/^[ \t]*[*_]*[ \t]*Sumber[ \t]*:?[ \t]*(?:\[\d+(?:[ \t]*,[ \t]*\d+)*\][ \t,;]*)+[*_]*[ \t]*$/gmi,'').replace(/[ \t]?\[\d+(?:[ \t]*,[ \t]*\d+)*\](?!\()/g,'');
  if(p)t=t.replace(/(^|\n)[ \t]*[*_]*Sumber[ \t]*:?[ \t]*\[?[\d, \t\]\[]*[*_]*$/i,'$1').replace(/[ \t]?\[\d*(?:[ \t]*,[ \t]*\d*)*$/,'');
  return t.replace(/\n{3,}/g,'\n\n')};
const CITS=t=>t.split(/(```[\s\S]*?(?:```|$))/g).map((x,i)=>i%2?x:CIT(x)).join('');
const inl=t=>col(esc(t)).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const SO='<svg class="so" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>';
const XP='<button class="tbx" aria-label="Perbesar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>';
const blocks=(txt,T)=>{const L=txt.split('\n'),o=[];
  const isRow=l=>/^\s*\|/.test(l),cells=l=>l.trim().replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(x=>x.trim()),
  isSep=l=>/^[\s:|-]+$/.test(l)&&l.includes('-')&&l.includes('|');
  for(let i=0;i<L.length;i++){const l=L[i];
    if(isRow(l)&&i+1<L.length&&isSep(L[i+1])){
      const hd=cells(l),al=cells(L[i+1]).map(c=>/^:-*:$/.test(c)?'center':/-:$/.test(c)?'right':'left');let j=i+2;const rows=[];
      while(j<L.length&&isRow(L[j])){rows.push(cells(L[j]));j++}
      const th=hd.map((c,k)=>`<th style="text-align:${al[k]||'left'}">${inl(c)}${SO}</th>`).join(''),
      tr=rows.map(r=>'<tr>'+hd.map((_,k)=>`<td style="text-align:${al[k]||'left'}">${inl(r[k]||'')}</td>`).join('')+'</tr>').join('');
      o.push(T(`<div class="tbc"><div class="tbw"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>${XP}</div>`));i=j-1;continue}
    if(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l)){o.push(T('<hr class="mh">'));continue}
    const h=l.match(/^\s{0,3}#{1,6}\s+(.+?)\s*#*\s*$/);if(h){o.push(T('<b class="mhd">'+inl(h[1])+'</b>'));continue}
    o.push(l)}
  return o.join('\n')};
const DGR=/^```(?:diagram|mermaid|flowchart)[ \t]*\n([\s\S]*?)(\n?```)?$/i;
const md=(s,p)=>{const TB=[],T=h=>{TB.push(h);return '\u0001'+(TB.length-1)+'\u0002'};
  const PR=s.split(/(```[\s\S]*?(?:```|$))/g);s=PR.map((x,i)=>{
    if(i%2){const m=x.match(DGR);if(m)return T(m[2]?`<div class="dg" data-src="${encodeURIComponent(m[1])}"><div class="dgp">Membuat diagram…</div></div>`:'<div class="dg"><div class="dgp">Membuat diagram…</div></div>');return x}
    return blocks(CIT(x,p&&i===PR.length-1),T)}).join('');
  return md0(s,p).replace(/(?:<br>)?\u0001(\d+)\u0002(?:<br>)?/g,(m,n)=>TB[n])};
let BID=0;
const bot=c=>{const k="k"+(++BID);return `<svg viewBox="114.4 21.35 411.4 411.4"><clipPath id="${k}"><circle class="cc" cx="320.1" cy="227.05" r="205.7"/></clipPath><circle class="bd" cx="320.1" cy="227.05" r="205.7" fill="${c}"/><g clip-path="url(#${k})"><path class="e"/><path class="e"/></g></svg>`};
let cfg;try{cfg=JSON.parse(localStorage.getItem('xbot'))}catch{}
cfg=Object.assign({url:SERVER_URL,keys:{},model:DEF_MODEL,img:DEF_IMG,mode:'auto',bots:NM.map((n,i)=>({name:'Bot '+n,prompt:`Kamu asisten AI yang ${TRAIT[i]}. Jawab dalam bahasa Indonesia.`}))},cfg||{});cfg.url=SERVER_URL;
cfg.panel=Object.assign({on:true,keys:{gemini:'',groq:''},model:'',gap:'4.5-8',max:0},cfg.panel||{});cfg.panel.keys=Object.assign({gemini:'',groq:''},cfg.panel.keys);
if(!cfg.bots[10])cfg.bots[10]={name:'edhyx',prompt:'Kamu edhyx, asisten AI yang cerdas, ramah, dan santai. Jawab dalam bahasa Indonesia dengan jelas dan membantu.'};
const save=()=>{try{localStorage.setItem('xbot',JSON.stringify(cfg))}catch{}};
const HIDE=[5];/* 5 = orange, disembunyikan */
let stp=false,cur=10,open=false,hist=[],img=null,docTxt=null,att=null,busy=false,ctrl=null,MODELS=[],IMGS=[];

 return `M${P(x1,y1,r1,a)}L${P(x2,y2,r2,a)}A${f(r2)} ${f(r2)} 0 ${l2} 0 ${P(x2,y2,r2,b)}L${P(x1,y1,r1,b)}A${f(r1)} ${f(r1)} 0 ${1-l2} 0 ${P(x1,y1,r1,a)}Z`}

   const sys=base(f)+`\n\n[Debat] Topik: ${topic}\nPosisimu: ${tg==='PRO'?'MENDUKUNG':'MENENTANG'} (${tg}). Debat ronde ${rd} dari 2. ${rd==1?'Sampaikan argumen utamamu.':'Bantah argumen lawan secara langsung dan perkuat posisimu.'} Tetap dalam karakter dan kepribadianmu, konkret, boleh memakai info terbaru bila relevan. 2-4 kalimat, maks 380 karakter, tanpa markdown berat, jangan netral.`;

   if(!m)return;tr.push(`${nm(f)} (${tg}): ${m.full}`)}

 }finally{if(g===tgen)endTask()}}

 v.innerHTML=`<div class="rh"><button id="fvx">← Tutup</button><b>${esc(f.name)}</b><span>${f.text?'<button id="fvc">Salin</button> ':''}${f.data&&isMed(f.data)?'':'<button id="fvd">Unduh</button>'}</span></div><div class="fvb">${f.data?(isYT(f.data)?`<iframe src="${f.data}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:14px"></iframe>`:isVid(f.data)?`<video src="${f.data}" controls playsinline style="width:100%;border-radius:14px" onerror="mbad(this)"></video>`:isAud(f.data)?`<div class="lmn">🎵 ${esc(f.name)}</div><audio src="${f.data}" controls style="width:100%" onerror="mbad(this)"></audio>`:`<img src="${f.data}" alt="" onerror="mbad(this)">`):`<pre>${esc(f.text.slice(0,60000))}</pre>`}</div>`;
 $('#fvx').onclick=()=>{v.hidden=true};if(f.text)$('#fvc').onclick=async e=>{const a=e.target,o=a.textContent;a.textContent=await cpy(f.text)?'✓':'✗';setTimeout(()=>a.textContent=o,1200)};
 const dl=$('#fvd');if(dl)dl.onclick=async()=>{let href=f.data,tmp=null;try{if(f.data){if(/^https?:/i.test(f.data)){const r=await fetch(f.data);if(!r.ok)throw 0;tmp=URL.createObjectURL(await r.blob());href=tmp}}else{tmp=URL.createObjectURL(new Blob([f.text],{type:(EXT[extOf(f.name)]||'text/plain')+';charset=utf-8'}));href=tmp}}catch(e){window.open(f.data,'_blank');return}const a=document.createElement('a');a.href=href;a.download=f.name;document.body.appendChild(a);a.click();a.remove();if(tmp)setTimeout(()=>URL.revokeObjectURL(tmp),4000)}}
function openRS(){$('#rs').hidden=false;$('#rb').classList.remove('nw');UNB=0;badge(0);renderLog();ui()}
function mountUI(){
 const rb=document.createElement('button');rb.className='mi';rb.id='rb';rb.setAttribute('aria-label','Ruang bot');rb.innerHTML='<span style="font-size:26px;width:36px;text-align:center">💬</span>';
 const s=$('#st'),w=document.createElement('div');w.id='pt';s.parentNode.insertBefore(w,s);w.append(rb,s);
 document.body.insertAdjacentHTML('beforeend',`<div id="rs" hidden><div class="rh"><button id="rx" aria-label="Kembali">←</button><b>Ruang Bot</b><span class="rhb"><button id="rv" aria-label="Suara bot">🔇</button><button id="rf" aria-label="Berkas bersama">📎</button></span></div><div id="rl"></div><div id="rfo"><div id="rc" hidden></div><div id="rm" hidden><button data-m="debat">🎭 Debat 3 bot</button><button data-m="tim">🛠 Tim kerja</button></div><div id="rcmp"><button id="ra" aria-label="Tambah berkas">+</button><textarea id="rt" rows="1" placeholder="Ketik ke para bot…"></textarea><button id="rsd">↑</button></div></div><input type="file" id="rfi" hidden accept="image/*,video/*,audio/*,.txt,.md,.csv,.json,.js,.html,.css,.py,.xml,.log,.sql,.sh,.ts,.yaml,.yml"></div><div id="fv" hidden></div>`);
 rb.onclick=openRS;$('#rx').onclick=()=>{$('#rs').hidden=true;$('#fv').hidden=true};$('#rf').onclick=openFiles;$('#rv').onclick=()=>{VOICE.on=!VOICE.on;$('#rv').textContent=VOICE.on?'🔊':'🔇';if(!VOICE.ok)return;try{speechSynthesis.cancel();if(VOICE.on){const u=new SpeechSynthesisUtterance('Suara aktif');u.lang='id-ID';speechSynthesis.speak(u)}}catch(e){}};$('#ra').onclick=()=>$('#rfi').click();
 $('#rfi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)ingest(f,-1,1)};
 const t=$('#rt');t.oninput=()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';ui()};
 const go=()=>{if(TASK){stopTask();return}const x=t.value;if(!x.trim())return;t.value='';t.style.height='auto';$('#rc').hidden=true;userSay(x);ui()};
 $('#rsd').onclick=go;
 $('#rm').onclick=e=>{const b=e.target.closest('[data-m]');if(b)openCfg(b.dataset.m)};
 $('#rl').onclick=async e=>{const c=e.target.closest('[data-fid]');if(c)return openFile(c.dataset.fid);const k=e.target.closest('[data-cp]');if(k){const o=k.textContent;k.textContent=await cpy(plain(k.closest('.lm').dataset.t))?'✓ Tersalin':'✗';setTimeout(()=>k.textContent=o,1300)}};
 $('#rc').onclick=e=>{const c=e.target.closest('[data-fid]');if(c)openFile(c.dataset.fid)};
 /* ketuk berkas di gelembung panel */
 $('#bl').addEventListener('click',e=>{const c=e.target.closest('.fc');if(!c)return;e.stopPropagation();e.preventDefault();$('#rs').hidden=false;$('#rb').classList.remove('nw');renderLog();ui();openFile(c.dataset.fid)},true);
 /* berkas yang dilampirkan di chat utama ikut dikenal para bot */
 ['#fi','#fc'].forEach(q=>$(q).addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)ingest(f,-1,0)},true))}
mountUI();

/* ===== PENGATURAN (dipanggil dari settings()) ===== */
const sl=(id,arr,v)=>`<select id="${id}">${arr.map(a=>`<option value="${a[0]}"${String(a[0])==String(v)?' selected':''}>${a[1]}</option>`).join('')}</select>`;
const memRows=i=>memList(i).length?memList(i).map((m,j)=>`<div class="mr"><span>${esc(m.t)}</span><button data-md="${i}:${j}" aria-label="Hapus">✕</button></div>`).join(''):'<div class="mr"><span style="opacity:.6">Belum ada ingatan.</span></div>';
const PX=window.PX={
 sys:(i,main)=>roleTxt(i)+memTxt(i)+memAsk(i)+(main&&LOG.length?'\n\n[Obrolan terakhir di panel bot] '+LOG.filter(l=>l.f!==-2).slice(-3).map(l=>who(l.f)+': '+clip(l.full||'(berkas)',100)).join(' | ')+'\nKalau relevan, boleh nyambung dengan obrolan itu.':''),
 eat:(i,t)=>eat(i,t),
 panelHTML:(opt,hint)=>`<h3>Bot panel (obrolan antar-bot)</h3><p style="${hint}">Obrolan di panel samping, dan Ruang Bot lewat ikon 💬 di panel.</p>
 ${sl('p_on',[[1,'Hidup'],[0,'Mati']],P.on===false?0:1)}
 <h3>Akses API key bot</h3><p style="${hint}">Otomatis = pakai semua key di kolom bawah ini (bukan key chat utama), digilir antar bot; kalau ada gangguan, otomatis pindah ke model Gemini dan Groq lain yang bisa dipakai. Manual = key khusus bot panel dengan model pilihanmu, tanpa pindah otomatis. Isi beberapa key (pisah koma) supaya digilir.</p>
 ${sl('p_km',[['auto','Otomatis'],['manual','Manual']],P.kmode)}
 <div id="pkm"><input type="password" id="pk_gemini" placeholder="key gemini khusus bot (boleh banyak, pisah koma)" value="${esc(P.keys.gemini||'')}"><input type="password" id="pk_groq" placeholder="key groq khusus bot (boleh banyak, pisah koma)" value="${esc(P.keys.groq||'')}"></div>
 <select id="p_model"><option value="">Model: sama dengan chat utama</option>${MODELS.map(m=>opt(m,P.model)).join('')}</select>
 ${sl('p_gap',[['4.5-8','Jeda pesan: 4-8 detik (cepat, boros)'],['15-25','Jeda pesan: 15-25 detik'],['30-60','Jeda pesan: 30-60 detik (hemat)']],P.gap)}
 ${sl('p_max',[[0,'Tanpa batas pesan'],[5,'Berhenti setelah 5 pesan'],[10,'Berhenti setelah 10 pesan'],[20,'Berhenti setelah 20 pesan']],P.max)}
 ${sl('p_vibe',[['tenang','Suasana bot: tenang'],['seru','Suasana bot: seru'],['ramai','Suasana bot: ramai']],P.vibe)}
 ${sl('p_auto',[[1,'Online otomatis: 15 menit tiap jam'],[0,'Online otomatis: mati']],P.auto===false?0:1)}
 ${sl('p_ping',[['jarang','Notif dari bot: jarang'],['sedang','Notif dari bot: sedang'],['sering','Notif dari bot: sering']],P.ping||'sedang')}
 ${sl('p_know',[[1,'Bot tahu pekerjaanmu di chat utama'],[0,'Bot tidak lihat chat utama']],P.know?1:0)}
 <h3>Spesialis & ingatan per bot</h3><p style="${hint}">Tentukan bot mana berperan apa. Ingatan: bot mencatat hal penting tentangmu (disimpan di browser ini saja) dan bisa dihidupkan/dimatikan per bot.</p>
 ${ids().map(i=>`<div class="bo bx"><div style="display:flex;gap:10px;align-items:center"><div style="width:18px;flex:none">${bot(COL[i])}</div><b style="flex:1;font-weight:600">${esc(nm(i))}</b><label class="sw"><input type="checkbox" id="m${i}"${cfg.memOn[i]?' checked':''}><i></i><span>Ingatan</span></label></div>${sl('r'+i,Object.entries(ROLES).map(([k,v])=>[k,v[0]]),cfg.role[i])}<div class="mx"><span id="mc${i}">${memList(i).length} ingatan</span><span><button data-mv="${i}">Lihat</button> <button data-mc="${i}">Hapus semua</button></span></div><div id="mv${i}" hidden></div></div>`).join('')}`,
 wire:()=>{},
 read:()=>{P.kmode=$('#p_km').value;P.vibe=$('#p_vibe').value;P.auto=$('#p_auto').value=='1';P.ping=$('#p_ping').value;P.know=$('#p_know').value=='1';ids().forEach(i=>{cfg.role[i]=$('#r'+i).value;cfg.memOn[i]=$('#m'+i).checked})}};
$('#sm').addEventListener('click',e=>{const v=e.target.closest('[data-mv]'),d=e.target.closest('[data-md]'),a=e.target.closest('[data-mc]');
   const ref=i=>{$('#mc'+i).textContent=memList(i).length+' ingatan';$('#mv'+i).innerHTML=memRows(i)};
   if(v){const i=v.dataset.mv,b=$('#mv'+i);b.hidden=!b.hidden;if(!b.hidden)b.innerHTML=memRows(i)}
   if(d){const[i,j]=d.dataset.md.split(':').map(Number);memList(i).splice(j,1);save();ref(i)}
   if(a){const i=+a.dataset.mc;if(!memList(i).length||!confirm('Hapus semua ingatan '+nm(i)+'?'))return;cfg.mem[i]=[];save();ref(i)}});

/* ===== MULAI ===== */
const inject=()=>{document.querySelectorAll('#bl .bi').forEach(b=>{if(!b.querySelector('.cb'))b.insertAdjacentHTML('beforeend','<i class="cb"><em class="ct"></em></i>')});ids().forEach(show)};
const _rb=renderBots;renderBots=function(){_rb.apply(this,arguments);inject()};
{let sv={};try{sv=JSON.parse(localStorage.getItem('xbotlast')||'{}')}catch(e){}const q=TP.slice(0,10).sort(()=>Math.random()-.5);ids().forEach((i,j)=>{const z=sv[i];if(z&&z.t){st(i).t=z.t;st(i).tc=(z.tc>=0&&cfg.bots[z.tc])?z.tc:-1;return}const[k,f]=q[j%q.length];st(i).t=clip(k[0].toUpperCase()+k.slice(1)+': '+f)})}inject();
const sync=()=>{const po=document.body.classList.contains('o'),o=po||winOn();
 if(o){clearTimeout(KT);KEEP=0;AUTO=po?0:1;if(!on){on=1;if(AUTO){GR=({jarang:1,sedang:2,sering:3})[P.ping]||2;GRU=[]}feedRefresh(1);sent=0;gen++;busy=0;clearTimeout(tmr);tmr=setTimeout(turn,1000)}}
 else if(on){
  if(!AUTO){if(!KEEP){KEEP=Date.now()+KEEPMS;clearTimeout(KT);KT=setTimeout(sync,KEEPMS+300);return}
  if(Date.now()<KEEP)return}
  KEEP=0;on=0;gen++;busy=0;clearTimeout(tmr);ids().forEach(clr);try{speechSynthesis.cancel()}catch(e){}}};
new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['class']});setInterval(sync,20000);document.addEventListener('visibilitychange',sync);sync();
})();

<style>

<script>
(()=>{const v=window.visualViewport,rs=document.querySelector('#rs'),rl=document.querySelector('#rl'),rt=document.querySelector('#rt'),cmp=document.querySelector('#rcmp');
if(!v||!rs||!rt||!cmp)return;
const S=rs.style,DUR=470,LEAD=60;
const BZ=(()=>{const x1=.3234,y1=.872,x2=.3683,y2=.9696,P=(a,b,c,t)=>3*(1-t)*(1-t)*t*a+3*(1-t)*t*t*b+t*t*t*c;return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const d=P(x1,x2,1,t)-x,dv=3*(1-t)*(1-t)*x1+6*(1-t)*t*(x2-x1)+3*t*t*(1-x2);if(Math.abs(d)<1e-5||!dv)break;t-=d/dv}return P(y1,y2,1,t)}})();
const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
const land=()=>window.innerWidth>window.innerHeight,ek=()=>'xkb'+(land()?'l':'p');
const okK=k=>k>150&&k<window.innerHeight*(land()?.8:.44);
const getE=()=>{try{const e=+localStorage.getItem(ek())||0;return okK(e)?e:0}catch(e){return 0}};
const guess=()=>{const e=getE();return e>100?e:Math.round(land()?window.innerHeight*.52:Math.max(screen.width,screen.height)*.386)};
let cur=0,tgt=0,from=0,t0=0,raf=0,K=0,st=0,pt=0,ho=0,sett=0,last=0,pu=0,pr=0;
const near=()=>rl.scrollHeight-rl.scrollTop-rl.clientHeight<80;
const apply=k=>{S.setProperty('--kb',k.toFixed(1)+'px');S.setProperty('--ko',K?Math.min(1,k/K).toFixed(3):'0');if(st)rl.scrollTop=1e9};
const run=ts=>{const p=Math.min(1,Math.max(0,(ts-t0)/DUR));cur=from+(tgt-from)*BZ(p);apply(cur);raf=p<1?requestAnimationFrame(run):0};
const go=k=>{if(Math.abs(k-tgt)<.5)return;if(k>0)K=k;st=near();const moving=!!raf;tgt=k;from=cur;t0=performance.now()+(moving||k<=0?0:LEAD);cancelAnimationFrame(raf);raf=requestAnimationFrame(run)};
const pin=()=>{S.setProperty('--vt',v.offsetTop.toFixed(1)+'px')};
const fit=()=>{S.setProperty('--H',window.innerHeight+'px');pin()};
const pump=ms=>{pu=performance.now()+(ms||1300);if(pr)return;const L=()=>{pin();pr=performance.now()<pu?requestAnimationFrame(L):0};pr=requestAnimationFrame(L)};
const foc=()=>{const a=document.activeElement;return a===rt||a===kp};
/* koreksi ukuran keyboard setelah iOS tenang (dua bacaan sama berturut-turut) */
const settle=()=>{if(rs.hidden)return;const k=window.innerHeight-v.height;
 if(k>60){if(!okK(k)||!foc())return;if(Math.abs(k-last)>2){last=k;clearTimeout(sett);sett=setTimeout(settle,160);return}
  try{if(Math.abs(k-getE())>2)localStorage.setItem(ek(),String(Math.round(k)))}catch(e){}
  if(Math.abs(k-tgt)>3)go(k)}
 else if(!foc()&&!ho)go(0)};
v.addEventListener('resize',()=>{pump();fit();last=0;clearTimeout(sett);sett=setTimeout(settle,160)});
v.addEventListener('scroll',()=>{pin();pump(600)});
window.addEventListener('orientationchange',()=>setTimeout(fit,300));fit();
/* kolom bayangan di atas layar: iOS membuka keyboard tanpa menggeser halaman, lalu fokus dipindah ke kolom asli */
const kp=document.createElement('input');kp.type='text';kp.setAttribute('aria-hidden','true');kp.tabIndex=-1;kp.autocapitalize='sentences';
kp.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;font-size:16px;pointer-events:none;caret-color:transparent;background:none;color:transparent';
document.body.appendChild(kp);
const rawFocus=HTMLElement.prototype.focus;
const handoff=()=>{clearTimeout(ho);ho=0;if(document.activeElement!==kp)return;const typed=kp.value;kp.value='';rawFocus.call(rt,{preventScroll:true});if(typed){rt.value+=typed;rt.dispatchEvent(new Event('input',{bubbles:true}))}try{rt.setSelectionRange(rt.value.length,rt.value.length)}catch(e){}window.scrollTo(0,0);pump()};
const open=()=>{if(document.activeElement===rt||document.activeElement===kp)return;
 if(!ios){rawFocus.call(rt);return}
 pump();clearTimeout(pt);go(guess());rawFocus.call(kp,{preventScroll:true});clearTimeout(ho);ho=setTimeout(handoff,560);pt=setTimeout(settle,900)};
rt.addEventListener('focus',()=>{pump();if(tgt<1)go(guess());clearTimeout(pt);pt=setTimeout(settle,900)});
const closed=()=>setTimeout(()=>{if(foc()||ho)return;go(0)},60);
rt.addEventListener('blur',()=>{pump();closed()});kp.addEventListener('blur',closed);
cmp.addEventListener('touchstart',e=>{if(e.target.closest('button')||document.activeElement===rt)return;e.preventDefault();open()},{passive:false});
cmp.addEventListener('click',e=>{if(e.target.closest('button'))return;open()});
/* tombol kirim tidak boleh mencuri fokus: keyboard tetap terbuka selama ngobrol */
/* setelah kirim: keyboard turun otomatis (seperti Grok / chat utama) */
const sd=document.querySelector('#rsd');if(sd)sd.addEventListener('click',()=>{clearTimeout(ho);ho=0;clearTimeout(pt);try{kp.blur()}catch(e){}try{rt.blur()}catch(e){}go(0)});
/* keluar dari Ruang Bot: reset tanpa animasi */
const reset=()=>{clearTimeout(ho);ho=0;cancelAnimationFrame(raf);raf=0;cur=tgt=from=0;try{kp.blur();rt.blur()}catch(e){}apply(0)};
const rx=document.querySelector('#rx');if(rx)rx.addEventListener('click',reset);
new MutationObserver(()=>{if(rs.hidden)reset();else fit()}).observe(rs,{attributes:true,attributeFilter:['hidden']});
})();

<script>
(()=>{
const XT={};
const jf=(u,o)=>fetch(u,o).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
const jina=u=>fetch('https://r.jina.ai/'+u,{headers:{'X-Return-Format':'markdown'}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});

XT.weather=async({kota='Jakarta'})=>{
  const g=await jf(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(kota)}&count=1&language=id&format=json`);
  if(!g.results?.length) throw new Error(`Kota "${kota}" tidak ditemukan`);
  const c=g.results[0];
  const w=await jf(`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3`);
  const codes={0:'Cerah',1:'Cerah sebagian',2:'Berawan',3:'Mendung',45:'Berkabut',51:'Gerimis',61:'Hujan ringan',63:'Hujan sedang',65:'Hujan lebat',80:'Hujan lokal',95:'Badai petir'};
  return {kota:`${c.name}, ${c.admin1||c.country||''}`.trim(),

    ramalan:w.daily.time.map((t,i)=>({tanggal:t,kondisi:codes[w.daily.weather_code[i]]||'-',min:w.daily.temperature_2m_min[i],max:w.daily.temperature_2m_max[i],hujan:w.daily.precipitation_probability_max[i]}))};

XT.rate=async({dari='USD',ke='IDR',jumlah=1})=>{

  if(!r.rates?.[ke]) throw new Error(`Kurs ${dari}→${ke} tidak tersedia`);
  return {dari,ke,jumlah,hasil:r.rates[ke],tanggal:r.date,kurs1:`1 ${dari} = ${(r.rates[ke]/jumlah).toFixed(4)} ${ke}`};
};
XT.wiki=async({q,lang='id'})=>{
  if(!q) throw new Error('Kata kunci kosong');
  const base=lang==='en'?'en.wikipedia.org':'id.wikipedia.org';
  const s=await jf(`https://${base}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*&srlimit=1`);
  if(!s.query?.search?.length) throw new Error(`Tidak ada artikel untuk "${q}"`);

  const pg=Object.values(p.query.pages)[0];
  return {judul:t,ringkas:(pg.extract||'').slice(0,600),url:`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(t.replace(/ /g,'_'))}`};

XT.calc=async({expr})=>{
  const clean=String(expr||'').replace(/[^0-9+\-*/().^ ]/g,'').replace(/\^/g,'**');
  if(!clean) throw new Error('Ekspresi kosong');
  const v=new Function(`'use strict';return (${clean})`)();
  if(typeof v!=='number'||!isFinite(v)) throw new Error('Hasil bukan angka');
  return {ekspresi:expr,hasil:v,dibulatkan:Math.round(v*1e6)/1e6};
};

  const key=String(zona||'jakarta').toLowerCase().trim();
  const tz=zones[key]||(key.includes('/')?zona:null);
  if(!tz) throw new Error(`Zona "${zona}" tidak dikenal`);
  return {zona,waktu:new Intl.DateTimeFormat('id-ID',{timeZone:tz,dateStyle:'full',timeStyle:'long'}).format(new Date())};

};
XT.search=async({q})=>{
  if(!q) throw new Error('Query kosong');
  const r=await origFetch(SERVER_URL.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},

      system:'Cari informasi terbaru di web untuk pertanyaan ini lalu jawab ringkas dalam bahasa Indonesia.',
      now:new Date().toISOString(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,

  if(!fin||fin.error||!fin.text) throw new Error(fin?.error||'Tidak ada hasil');

/* Cadangan pencarian web: Parallel (key di Pengaturan). Dipakai hanya jika pencarian utama gagal/kosong. */

<script>
/* ===== v32: PEMBACA DOKUMEN (PDF, Word, Excel, PowerPoint, ZIP) + ALAT BARU (code, file, remind) =====
   Ditambahkan di akhir file. Pustaka (pdf.js, JSZip, SheetJS) dimuat dari CDN HANYA saat dibutuhkan,
   jadi buka aplikasi dan semua fitur lama tidak terpengaruh. */
(()=>{
'use strict';
const MAXF=25*1024*1024,MAXT=30000;
const LIBS={
 pdf:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'],
 zip:['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'],
 xls:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']
};
const LP={},LU={};
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=()=>ok();s.onerror=()=>{s.remove();no(new Error('gagal memuat'))};document.head.appendChild(s)});
const lib=(k,chk)=>{if(chk())return Promise.resolve();return LP[k]||(LP[k]=(async()=>{for(const u of LIBS[k]){try{await loadScript(u);if(chk()){LU[k]=u;return}}catch(e){}}throw new Error('pustaka pembaca ('+k+') tidak bisa dimuat, cek koneksi internet')})().catch(e=>{delete LP[k];throw e}))};
const needZip=()=>lib('zip',()=>window.JSZip),needXls=()=>lib('xls',()=>window.XLSX),needPdf=()=>lib('pdf',()=>window.pdfjsLib);

const dec=s=>s.replace(/&(#x?[0-9a-f]+|amp|lt|gt|quot|apos);/gi,(m,e)=>{e=e.toLowerCase();if(e==='amp')return'&';if(e==='lt')return'<';if(e==='gt')return'>';if(e==='quot')return'"';if(e==='apos')return"'";const c=e[1]==='x'?parseInt(e.slice(2),16):parseInt(e.slice(1),10);try{return String.fromCodePoint(c)}catch(x){return''}});
const tidy=s=>s.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
const kb=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(n<10240?1:0)+' KB':(n/1048576).toFixed(1)+' MB';
const attr=(s,n)=>{const m=new RegExp('\\b'+n+'="([^"]*)"').exec(s);return m?m[1]:''};
const NSC='(?:[^>\\/]|\\/(?!>))*';/* isi tag pembuka yang BUKAN self-closing */

/* ---------- Word (.docx) ---------- */
/* hanya teks di dalam <w:t> yang diambil; tag lain hanya dipakai untuk jeda baris, tab, dan sel tabel
   (\u0001 = akhir sel, \u0002 = jeda paragraf di dalam sel) */
const wTok=/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<\/w:p>|<w:tab\/>|<w:(?:br|cr)\b[^>]*\/>|<\/w:tr>|<[^>]+>|[^<]+/g;
const cells=(x,p,tc)=>x.replace(new RegExp('<'+p+':'+tc+'\\b'+NSC+'>([\\s\\S]*?)<\\/'+p+':'+tc+'>','g'),(m,i)=>i.replace(new RegExp('<\\/'+p+':p>','g'),'\u0002')+'\u0001');
const grid=t=>t.replace(/\u0002+/g,' ').replace(/[ \t]*\u0001[ \t]*\n/g,'\n').replace(/[ \t]*\u0001[ \t]*/g,' | ');
const docxText=async z=>{
 const f=z.file('word/document.xml');if(!f)throw new Error('bukan file .docx yang valid');
 const x=cells(await f.async('string'),'w','tc').replace(wTok,(m,t)=>{
  if(t!==undefined)return t;
  if(m==='</w:p>'||m==='</w:tr>'||/^<w:(?:br|cr)\b/.test(m))return'\n';
  if(m==='<w:tab/>')return'\t';
  return m[0]==='<'?'':m.replace(/[^\u0001\u0002]/g,'');
 });
 return tidy(grid(dec(x)));
};

/* ---------- PowerPoint (.pptx) ---------- */
const aTok=/<a:t(?:\s[^>]*)?>([\s\S]*?)<\/a:t>|<\/a:p>|<a:br\b[^>]*\/>|<\/a:tr>|<[^>]+>|[^<]+/g;
const aText=x=>{
 x=cells(x.replace(new RegExp('<a:fld\\b'+NSC+'>[\\s\\S]*?<\\/a:fld>','g'),''),'a','tc').replace(aTok,(m,t)=>{
  if(t!==undefined)return t;
  if(m==='</a:p>'||m==='</a:tr>'||/^<a:br\b/.test(m))return'\n';
  return m[0]==='<'?'':m.replace(/[^\u0001\u0002]/g,'');
 });
 return tidy(grid(dec(x)));
};
const pptxText=async z=>{
 const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));
 if(!names.length)throw new Error('bukan file .pptx yang valid');
 let order=null;
 try{
  const pres=await z.file('ppt/presentation.xml').async('string'),rels=await z.file('ppt/_rels/presentation.xml.rels').async('string'),map={};
  for(const m of rels.match(/<Relationship\b[^>]*>/g)||[])map[attr(m,'Id')]=attr(m,'Target');
  order=[...pres.matchAll(/<p:sldId\b[^>]*>/g)].map(m=>'ppt/'+(map[attr(m[0],'r:id')]||'').replace(/^\/?(ppt\/)?/,'')).filter(n=>z.file(n));
  if(order.length!==names.length)order=null;
 }catch(e){order=null}
 if(!order)order=names.sort((a,b)=>(+a.match(/(\d+)\.xml$/)[1])-(+b.match(/(\d+)\.xml$/)[1]));
 const out=[];let i=0;
 for(const n of order){
  i++;const s=aText(await z.file(n).async('string'));let nt='';
  try{const rf=z.file(n.replace('slides/','slides/_rels/')+'.rels');if(rf){const m=/Target="[^"]*notesSlides\/(notesSlide\d+\.xml)"/.exec(await rf.async('string'));if(m){const nf=z.file('ppt/notesSlides/'+m[1]);if(nf)nt=aText(await nf.async('string'))}}}catch(e){}
  out.push('--- Slide '+i+' ---\n'+(s||'(tanpa teks)')+(nt?'\n[Catatan pembicara] '+nt:''));
 }

};

/* ---------- Excel (.xlsx .xlsm .xls .ods) ---------- */
const xlsText=async(buf,limit)=>{
 await needXls();
 const wb=XLSX.read(buf,{type:'array'});let out='';
 for(const sn of wb.SheetNames){
  const ws=wb.Sheets[sn];if(!ws)continue;
  const csv=XLSX.utils.sheet_to_csv(ws,{blankrows:false}).trim(),n=csv?csv.split('\n').length:0;
  out+=(out?'\n\n':'')+'## Sheet: '+sn+' ('+n+' baris)\n'+(csv||'(kosong)');
  if(out.length>limit)break;

};

/* ---------- PDF ---------- */
const pdfRead=async(buf,limit,wantImg)=>{
 await needPdf();
 pdfjsLib.GlobalWorkerOptions.workerSrc=(LU.pdf||LIBS.pdf[0]).replace('pdf.min.js','pdf.worker.min.js');
 const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise,N=doc.numPages;
 let out='',got=0;
 try{
  for(let p=1;p<=N&&out.length<limit;p++){
   const pg=await doc.getPage(p),tc=await pg.getTextContent();let s='',y=null;
   for(const it of tc.items){
    if(typeof it.str!=='string')continue;
    const yy=it.transform?it.transform[5]:null;
    if(y!==null&&yy!==null&&Math.abs(yy-y)>(Math.abs(it.transform[3])||8)*.6&&!s.endsWith('\n'))s+='\n';
    else if(s&&!/\s$/.test(s)&&it.str&&!/^\s/.test(it.str))s+=' ';
    s+=it.str;if(it.hasEOL&&!s.endsWith('\n'))s+='\n';
    if(yy!==null)y=yy;
   }
   s=tidy(s.replace(/[ \t]{2,}/g,' '));got=p;
   if(s)out+=(out?'\n\n':'')+'--- Halaman '+p+' ---\n'+s;
  }
  if(!out.trim()&&wantImg){
   const pg=await doc.getPage(1),v0=pg.getViewport({scale:1}),k=Math.min(3,1280/Math.max(v0.width,v0.height)),vp=pg.getViewport({scale:k}),c=document.createElement('canvas');
   c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
   const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
   await pg.render({canvasContext:cx,viewport:vp}).promise;
   return{scan:true,pages:N,img:c.toDataURL('image/jpeg',.85)};
  }
 }finally{try{doc.destroy()}catch(e){}}
 return{text:out,pages:N,read:got};
};

/* ---------- ZIP ---------- */
const TXT=/\.(txt|md|markdown|csv|tsv|json|jsonl|js|mjs|cjs|ts|tsx|jsx|html?|css|scss|py|xml|svg|log|sql|sh|bat|ya?ml|ini|toml|cfg|conf|env|java|kt|c|h|cpp|hpp|cs|go|rs|php|rb|swift|r|lua|vue)$/i;
const JUNK=/(^|\/)(__MACOSX|node_modules|\.git|\.idea|\.vscode)(\/|$)|(^|\/)(\.DS_Store|Thumbs\.db|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$|\.min\.(js|css)$/i;
const zipText=async(z,limit,depth)=>{
 const all=Object.values(z.files).filter(f=>!f.dir),ents=all.filter(f=>!JUNK.test(f.name)).sort((a,b)=>a.name<b.name?-1:a.name>b.name?1:0);
 const usz=f=>(f._data&&f._data.uncompressedSize)||0;
 let head='Daftar berkas ('+ents.length+(all.length>ents.length?'; '+(all.length-ents.length)+' berkas sistem/dependensi dilewati':'')+'):\n'+ents.slice(0,120).map(f=>'- '+f.name+' ('+kb(usz(f))+')').join('\n')+(ents.length>120?'\n… dan '+(ents.length-120)+' berkas lain':'');
 let body='',nested=0;
 for(const f of ents){
  if(head.length+body.length>=limit)break;
  const m=f.name.match(/\.(\w+)$/),ext=m?m[1].toLowerCase():'',sz=usz(f);
  try{
   let t=null;
   if(TXT.test(f.name)||/(^|\/)(readme|license|makefile|dockerfile)$/i.test(f.name)){if(sz>400000)continue;t=await f.async('string')}
   else if(depth<1&&nested<4&&/^(docx|pptx|xlsx|xlsm|pdf)$/.test(ext)&&sz<8e6){nested++;t=(await extract(ext,await f.async('arraybuffer'),5000,depth+1,false)).text}
   if(t&&t.trim())body+='\n\n### '+f.name+'\n'+(t.length>6000?t.slice(0,6000)+'\n…(dipotong)':t);
  }catch(e){}
 }
 return head+(body?'\n\n=== Isi berkas ===':'')+body;
};

async function extract(ext,buf,limit,depth,top){
 if(ext==='pdf'){const r=await pdfRead(buf,limit,top);return r}
 if(ext==='docx'){await needZip();return{text:await docxText(await JSZip.loadAsync(buf))}}
 if(ext==='pptx'){await needZip();return{text:await pptxText(await JSZip.loadAsync(buf))}}
 if(ext==='zip'){await needZip();return{text:await zipText(await JSZip.loadAsync(buf),limit,depth)}}
 return{text:await xlsText(buf,limit)};
}

/* ---------- Penyambung ke lampiran (#fi) ---------- */
const DOCRE=/\.(pdf|docx|pptx|xlsx|xlsm|xls|ods|zip)$/i,OLDRE=/\.(doc|ppt)$/i,LABEL={pdf:'PDF',docx:'Word',pptx:'PowerPoint',xlsx:'Excel',xlsm:'Excel',xls:'Excel',ods:'Spreadsheet',zip:'ZIP'};
const warn=m=>{note('⚠️ '+m);setTimeout(()=>{if($('#pv').textContent.startsWith('⚠️'))note('')},4500)};
const nice=e=>{const s=String((e&&e.name)||'')+' '+String((e&&e.message)||e);
 if(/pustaka pembaca/.test(s))return(e&&e.message)||s;
 if(/password/i.test(s))return'file ini diproteksi password';
 if(/end of central directory|zip|corrupt|invalid pdf|InvalidPDF|bad xref/i.test(s))return'file rusak atau bukan format yang benar';

async function readDoc(f){
 const m=f.name.match(/\.(\w+)$/),ext=m?m[1].toLowerCase():'';
 try{
  if(f.size>MAXF)throw new Error('file terlalu besar (maksimal 25 MB)');
  note('⏳ membaca '+f.name+'...');
  const buf=await(f.arrayBuffer?f.arrayBuffer():new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('gagal membaca file'));r.readAsArrayBuffer(f)}));
  const r=await extract(ext,buf,MAXT,0,true);
  att=null;
  if(r.img){img=r.img;docTxt=null;note('📎 '+f.name+' (PDF hasil scan: halaman 1 dikirim sebagai gambar)');return}
  let t=(r.text||'').trim();
  if(!t)throw new Error('tidak ada teks yang bisa dibaca di file ini');
  const head='['+LABEL[ext]+': '+f.name+(r.pages?' — '+r.pages+' halaman'+(r.read&&r.read<r.pages?', dibaca halaman 1–'+r.read:''):'')+']\n';
  let cut=false;if(t.length>MAXT){t=t.slice(0,MAXT);cut=true}
  docTxt={name:f.name,text:head+t+(cut?'\n\n[…dipotong: hanya bagian awal yang terbaca]':'')};img=null;
  note('📎 file terlampir: '+f.name+(cut?' (sebagian awal)':''));
 }catch(e){warn('gagal membaca '+f.name+': '+nice(e))}
}
document.addEventListener('change',e=>{
 const t=e.target;if(!t||t.id!=='fi')return;

 /* ---------- code: JavaScript di Web Worker (tanpa DOM, tanpa penyimpanan, jaringan dimatikan, bisa dihentikan) ---------- */
 const workerMain=function(){
  'use strict';
  const L=[];let cnt=0,len=0;
  const fmt=v=>{try{if(typeof v==='string')return v;if(v===undefined)return'undefined';if(typeof v==='function')return String(v).slice(0,200);if(typeof v==='bigint')return v+'n';if(v instanceof Error)return v.name+': '+v.message;return JSON.stringify(v,(k,x)=>typeof x==='bigint'?x+'n':x instanceof Map?Object.fromEntries(x):x instanceof Set?[...x]:x,1)}catch(e){return String(v)}};
  const put=(p,a)=>{if(cnt++<300){const s=p+a.map(fmt).join(' ');len+=s.length;if(len<20000)L.push(s)}};
  for(const k of['log','info','debug','table','dir'])console[k]=(...a)=>put('',a);
  console.warn=(...a)=>put('[warn] ',a);console.error=(...a)=>put('[error] ',a);
  for(const k of['fetch','XMLHttpRequest','WebSocket','EventSource','importScripts','Worker','SharedWorker','indexedDB','caches','BroadcastChannel']){try{Object.defineProperty(self,k,{value:undefined,configurable:true,writable:true})}catch(e){}}
  const AF=Object.getPrototypeOf(async function(){}).constructor;
  self.onmessage=async e=>{
   const code=String((e.data&&e.data.code)||''),t0=Date.now();let val,err=null;
   try{let fn=null;try{fn=new Function('return ('+code+'\n)')}catch(_){}val=fn?await fn():await new AF(code)()}catch(x){err=x}
   let out=L.join('\n');if(out.length>4000)out=out.slice(0,4000)+'\n…(output dipotong)';
   const r={ms:Date.now()-t0};if(out)r.output=out;
   if(err)r.error=(err&&err.name?err.name+': ':'')+(err&&err.message?err.message:String(err));
   else if(val!==undefined){let s=fmt(val);if(s.length>2000)s=s.slice(0,2000)+'…';r.hasil=s}
   postMessage(r);
  };
 };
 const WSRC='('+workerMain.toString()+')()';
 const runJS=(code,ms)=>new Promise(res=>{
  let w,url,done=false,t;
  const fin=r=>{if(done)return;done=true;clearTimeout(t);try{w.terminate()}catch(e){}try{URL.revokeObjectURL(url)}catch(e){}res(r)};
  try{url=URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'}));w=new Worker(url)}catch(e){return res({error:'Worker tidak tersedia di browser ini: '+(e.message||e)})}
  w.onmessage=e=>fin(e.data);
  w.onerror=e=>fin({error:'Kesalahan saat menjalankan kode: '+(e.message||'tidak diketahui')});
  t=setTimeout(()=>fin({error:'Waktu habis ('+ms/1000+' detik), kode dihentikan (mungkin loop tak berujung)'}),ms);
  w.postMessage({code});
 });

  const lang=String((a&&a.lang)||'js').toLowerCase(),code=String((a&&a.code)||'');
  if(!/^(js|javascript|node|ecmascript)$/.test(lang))throw new Error('Saat ini hanya JavaScript yang didukung (lang:"js")');
  if(!code.trim())throw new Error('Kode kosong');

 };

 /* ---------- file: buat berkas, tampil sebagai tombol Unduh / Bagikan di bawah jawaban ---------- */
 const MIME={txt:'text/plain',md:'text/markdown',csv:'text/csv',tsv:'text/tab-separated-values',json:'application/json',html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',py:'text/x-python',xml:'application/xml',svg:'image/svg+xml',log:'text/plain',sql:'text/plain',sh:'text/plain',yaml:'text/yaml',yml:'text/yaml',ts:'text/plain',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};

 document.head.appendChild(css);

 const shr=async f=>{try{const file=new File([f.blob],f.name,{type:f.blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return}}catch(e){if(e&&e.name==='AbortError')return}dl(f)};
 const mkBtn=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;return b};

 setInterval(rtick,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)rtick()});setTimeout(rtick,2500);

  let at;

  else if(a.waktu){const d=new Date(String(a.waktu).trim().replace(/^(\d{4}-\d{2}-\d{2}) /,'$1T'));if(isNaN(d))throw new Error('Format "waktu" tidak dikenali; pakai "YYYY-MM-DDTHH:MM" (waktu lokal pengguna)');at=d.getTime()}

 };

/* =====================================================================

const origFetch=window.fetch;

  if(!url.includes('/chat')||!init||!init.body||String(init.body).includes('image_gen":true')) return origFetch.apply(this,arguments);

          const rx=/\[simpan_memori:\s*([^\]\n]+)\]/gi;
          let m;
          while((m=rx.exec(buf))){
            const fact=m[1].trim();
            if(fact&&!MEM.includes(fact)){
              MEM.push(fact);saveMem();
              console.log('Memori baru disimpan:',fact);
            }
          }
          // Hapus tag dari output stream (hanya di teks final)
          processed=processed.replace(rx,'');
          controller.enqueue(new TextEncoder().encode(processed));
          pump();
        }).catch(e=>controller.error(e));
      }
      pump();
    }
  });
  return new Response(stream,{headers:res.headers,status:res.status,statusText:res.statusText});
};

/* =====================================================================
   5. INPUT SUARA PENUH (MODE BICARA DUA ARAH)
   ===================================================================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const ib=$('#ib');
if(SR&&ib){
  // Tambahkan tombol "Mode Bicara" di header
  const h=$('header');
  if(h&&!document.getElementById('xvb')){
    h.insertAdjacentHTML('beforeend',`<div id="xh-actions"><button id="xvb" aria-label="Mode Bicara">🎙️</button></div>`);
  }
  
  const vbox=document.createElement('div');vbox.id='xvoice';
  vbox.innerHTML=`<button id="xv-close">✕</button><div id="xv-orb">🎙️</div><div id="xv-tx">Ketuk orb untuk mulai bicara...</div><div id="xv-status"></div>`;
  document.body.appendChild(vbox);
  
  let rec=null,isListening=false,vspeaking=false;
  
  const startVoice=()=>{
    vbox.classList.add('on');
    document.getElementById('xv-tx').textContent='Mendengarkan...';
    if(rec)rec.abort();
    rec=new SR();rec.lang='id-ID';rec.interimResults=true;rec.continuous=false;
    
    rec.onresult=e=>{
      let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;
      document.getElementById('xv-tx').textContent=t;
    };
    rec.onend=()=>{
      isListening=false;
      if(vspeaking)return;
      const t=document.getElementById('xv-tx').textContent;
      if(t&&t!=='Mendengarkan...'&&t!=='Ketuk orb untuk mulai bicara...'){
        document.getElementById('xv-status').textContent='Memproses jawaban...';
        const txEl=$('#tx');
        if(txEl){
          txEl.value=t;
          txEl.dispatchEvent(new Event('input',{bubbles:true}));
          if(window.send){
            window.send();
            listenBotResponse();
            return;
          }
        }
      }
      document.getElementById('xv-status').textContent='';
    };
    rec.onerror=e=>{
      if(e.error==='no-speech'){document.getElementById('xv-status').textContent='Tidak ada suara, coba lagi.'}
      else{document.getElementById('xv-status').textContent='Error: '+e.error}
      isListening=false;
    };
    
    try{rec.start();isListening=true;document.getElementById('xv-status').textContent='Mendengarkan (ketuk orb lagi untuk selesai)...'}
    catch(e){document.getElementById('xv-status').textContent='Gagal memulai mikrofon.'}
  };
  
  const listenBotResponse=()=>{
    // Tunggu sebentar sampai bot mulai menjawab (cek DOM)
    let checks=0;
    const iv=setInterval(()=>{
      checks++;
      const last=document.querySelector('#ms .bm:last-child .bt');
      if(last&&last.textContent.trim().length>5){
        clearInterval(iv);
        vspeaking=true;
        const txt=last.textContent.replace(/[*_`#]/g,'').trim().slice(0,300);
        if(window.speechSynthesis){
          try{speechSynthesis.cancel()}catch(e){}
          const u=new SpeechSynthesisUtterance(txt);
          u.lang='id-ID';u.rate=1.1;
          u.onend=()=>{
            vspeaking=false;
            document.getElementById('xv-status').textContent='Selesai. Ketuk orb untuk bicara lagi.';
            if(vbox.classList.contains('on')) setTimeout(startVoice,800);
          };
          u.onerror=()=>{vspeaking=false;document.getElementById('xv-status').textContent='Gagal membacakan jawaban.'};
          speechSynthesis.speak(u);
        }
      }
      if(checks>100){clearInterval(iv);vspeaking=false;document.getElementById('xv-status').textContent='Waktu habis menunggu balasan.';}
    },200);
  };
  
  document.getElementById('xvb').onclick=()=>{
    vbox.classList.add('on');
    startVoice();
  };
  document.getElementById('xv-close').onclick=()=>{
    vbox.classList.remove('on');
    if(rec)rec.abort();
    try{speechSynthesis.cancel()}catch(e){}
  };
  document.getElementById('xv-orb').onclick=()=>{
    if(isListening){rec.stop()}
    else if(!vspeaking){document.getElementById('xv-status').textContent='Mendengarkan...';startVoice()}
  };
}

/* =====================================================================
   6. ANALISIS FILE & DATA LANJUTAN
   ===================================================================== */
// 6a. Cek CSV saat file dilampirkan -> tampilkan grafik
const fi=$('#fi');
if(fi){
  fi.addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];
    if(f&&f.name.toLowerCase().endsWith('.csv')){
      const r=new FileReader();
      r.onload=()=>{
        try{
          const lines=String(r.result).split('\n').map(l=>l.trim()).filter(Boolean);
          if(lines.length<3)return;
          const headers=lines[0].split(',').map(h=>h.trim().replace(/["']/g,''));
          const rows=lines.slice(1,10).map(l=>l.split(',').map(c=>c.trim().replace(/["']/g,'')));
          // Asumsi kolom pertama = label, kolom kedua = angka
          const data=rows.map(r=>[r[0],parseFloat(r[1])||0]).filter(x=>!isNaN(x[1]));
          if(data.length<2)return;
          const max=Math.max(...data.map(d=>d[1]));
          
          const chart=document.createElement('div');chart.className='xchart';
          chart.innerHTML=`<h5>📊 ${esc(f.name)} (Preview)</h5>`+data.map(d=>`
            <div class="xbar-row">
              <div class="xbar-label" title="${esc(d[0])}">${esc(d[0])}</div>
              <div class="xbar-track"><div class="xbar-fill" style="width:${(d[1]/max)*100}%"></div></div>
              <div class="xbar-val">${d[1]}</div>
            </div>`).join('');
          
          const ms=$('#ms');
          const div=document.createElement('div');
          div.className='bm';
          const inner=document.createElement('div');
          inner.className='bt';
          inner.appendChild(chart);
          div.appendChild(inner);
          ms.appendChild(div);
          ms.scrollTop=ms.scrollHeight;
          toast('📊 Grafik otomatis dibuat dari CSV');
        }catch(e){}
      };
      r.readAsText(f);
    }
  },true);
}

// 6b. Ekstraksi jawaban AI ke file (Excel/Docx/CSV)
const origFetch2=window.fetch;
window.fetch=async function(input,init){
  const res=await origFetch2.apply(this,arguments);
  const url=typeof input==='string'?input:(input&&input.url)||'';
  if(!url.includes('/chat')||!res.body) return res;
  
  // Clone response untuk discan tanpa mengganggu stream asli
  const clone=res.clone();
  clone.text().then(text=>{
    // Cek apakah AI memberi instruksi ekspor (misal user: "ekspor ke excel")
    // Kita lihat di pesan user terakhir
    const lastUser=(window.hist||[]).filter(m=>m.role==='user').pop();
    if(!lastUser)return;
    const prompt=lastUser.content.toLowerCase();
    
    if(/ekspor|simpan|download|buat file/.test(prompt)){
      let fin=null;
      text.split('\n').forEach(l=>{if(!l.trim())return;try{const j=JSON.parse(l);if(!j.s&&j.text)fin=j}catch(e){}});
      if(!fin||!fin.text)return;
      
      // Bersihkan teks dari markdown berlebih untuk file
      const clean=fin.text.replace(/[*_`#]/g,'').trim();
      
      if(/excel|xlsx|csv/.test(prompt)){
        // Buat CSV (karena bikin XLSX di client butuh library besar, CSV lebih aman & cepat)
        const blob=new Blob(['\ufeff'+clean],{type:'text/csv;charset=utf-8'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Data_AI.csv';a.click();
        setTimeout(()=>toast('✓ File CSV diunduh'),500);
      }
      else if(/word|docx|doc/.test(prompt)){
        const html=`<html><head><meta charset="utf-8"></head><body><pre style="font-family:sans-serif;white-space:pre-wrap">${esc(clean)}</pre></body></html>`;
        const blob=new Blob([html],{type:'application/msword'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Dokumen_AI.doc';a.click();
        setTimeout(()=>toast('✓ File Word (.doc) diunduh'),500);
      }
    }
  }).catch(()=>{});
  
  return res;
};

})();
