<script>
/* ===== v32: PEMBACA DOKUMEN (PDF, Word, Excel, PowerPoint, ZIP) + ALAT BARU (code, file, remind) =====
   Ditambahkan di akhir file. Pustaka (pdf.js, JSZip, SheetJS) dimuat dari CDN HANYA saat dibutuhkan,
   jadi buka aplikasi dan semua fitur lama tidak terpengaruh. */
(()=>{
'use strict';
const MAXF=25*1024*1024,MAXT=30000;
const LIBS={
 pdf:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'],
 zip:['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'],
 xls:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']
};
const LP={},LU={};
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=()=>ok();s.onerror=()=>{s.remove();no(new Error('gagal memuat'))};document.head.appendChild(s)});
const lib=(k,chk)=>{if(chk())return Promise.resolve();return LP[k]||(LP[k]=(async()=>{for(const u of LIBS[k]){try{await loadScript(u);if(chk()){LU[k]=u;return}}catch(e){}}throw new Error('pustaka pembaca ('+k+') tidak bisa dimuat, cek koneksi internet')})().catch(e=>{delete LP[k];throw e}))};
const needZip=()=>lib('zip',()=>window.JSZip),needXls=()=>lib('xls',()=>window.XLSX),needPdf=()=>lib('pdf',()=>window.pdfjsLib);

const dec=s=>s.replace(/&(#x?[0-9a-f]+|amp|lt|gt|quot|apos);/gi,(m,e)=>{e=e.toLowerCase();if(e==='amp')return'&';if(e==='lt')return'<';if(e==='gt')return'>';if(e==='quot')return'"';if(e==='apos')return"'";const c=e[1]==='x'?parseInt(e.slice(2),16):parseInt(e.slice(1),10);try{return String.fromCodePoint(c)}catch(x){return''}});
const tidy=s=>s.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
const kb=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(n<10240?1:0)+' KB':(n/1048576).toFixed(1)+' MB';
const attr=(s,n)=>{const m=new RegExp('\\b'+n+'="([^"]*)"').exec(s);return m?m[1]:''};
const NSC='(?:[^>\\/]|\\/(?!>))*';/* isi tag pembuka yang BUKAN self-closing */

/* ---------- Word (.docx) ---------- */
/* hanya teks di dalam <w:t> yang diambil; tag lain hanya dipakai untuk jeda baris, tab, dan sel tabel
   (\u0001 = akhir sel, \u0002 = jeda paragraf di dalam sel) */
const wTok=/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<\/w:p>|<w:tab\/>|<w:(?:br|cr)\b[^>]*\/>|<\/w:tr>|<[^>]+>|[^<]+/g;
const cells=(x,p,tc)=>x.replace(new RegExp('<'+p+':'+tc+'\\b'+NSC+'>([\\s\\S]*?)<\\/'+p+':'+tc+'>','g'),(m,i)=>i.replace(new RegExp('<\\/'+p+':p>','g'),'\u0002')+'\u0001');
const grid=t=>t.replace(/\u0002+/g,' ').replace(/[ \t]*\u0001[ \t]*\n/g,'\n').replace(/[ \t]*\u0001[ \t]*/g,' | ');
const docxText=async z=>{
 const f=z.file('word/document.xml');if(!f)throw new Error('bukan file .docx yang valid');
 const x=cells(await f.async('string'),'w','tc').replace(wTok,(m,t)=>{
  if(t!==undefined)return t;
  if(m==='</w:p>'||m==='</w:tr>'||/^<w:(?:br|cr)\b/.test(m))return'\n';
  if(m==='<w:tab/>')return'\t';
  return m[0]==='<'?'':m.replace(/[^\u0001\u0002]/g,'');
 });
 return tidy(grid(dec(x)));
};

/* ---------- PowerPoint (.pptx) ---------- */
const aTok=/<a:t(?:\s[^>]*)?>([\s\S]*?)<\/a:t>|<\/a:p>|<a:br\b[^>]*\/>|<\/a:tr>|<[^>]+>|[^<]+/g;
const aText=x=>{
 x=cells(x.replace(new RegExp('<a:fld\\b'+NSC+'>[\\s\\S]*?<\\/a:fld>','g'),''),'a','tc').replace(aTok,(m,t)=>{
  if(t!==undefined)return t;
  if(m==='</a:p>'||m==='</a:tr>'||/^<a:br\b/.test(m))return'\n';
  return m[0]==='<'?'':m.replace(/[^\u0001\u0002]/g,'');
 });
 return tidy(grid(dec(x)));
};
const pptxText=async z=>{
 const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));
 if(!names.length)throw new Error('bukan file .pptx yang valid');
 let order=null;
 try{
  const pres=await z.file('ppt/presentation.xml').async('string'),rels=await z.file('ppt/_rels/presentation.xml.rels').async('string'),map={};
  for(const m of rels.match(/<Relationship\b[^>]*>/g)||[])map[attr(m,'Id')]=attr(m,'Target');
  order=[...pres.matchAll(/<p:sldId\b[^>]*>/g)].map(m=>'ppt/'+(map[attr(m[0],'r:id')]||'').replace(/^\/?(ppt\/)?/,'')).filter(n=>z.file(n));
  if(order.length!==names.length)order=null;
 }catch(e){order=null}
 if(!order)order=names.sort((a,b)=>(+a.match(/(\d+)\.xml$/)[1])-(+b.match(/(\d+)\.xml$/)[1]));
 const out=[];let i=0;
 for(const n of order){
  i++;const s=aText(await z.file(n).async('string'));let nt='';
  try{const rf=z.file(n.replace('slides/','slides/_rels/')+'.rels');if(rf){const m=/Target="[^"]*notesSlides\/(notesSlide\d+\.xml)"/.exec(await rf.async('string'));if(m){const nf=z.file('ppt/notesSlides/'+m[1]);if(nf)nt=aText(await nf.async('string'))}}}catch(e){}
  out.push('--- Slide '+i+' ---\n'+(s||'(tanpa teks)')+(nt?'\n[Catatan pembicara] '+nt:''));
 }
 return out.join('\n\n');
};

/* ---------- Excel (.xlsx .xlsm .xls .ods) ---------- */
const xlsText=async(buf,limit)=>{
 await needXls();
 const wb=XLSX.read(buf,{type:'array'});let out='';
 for(const sn of wb.SheetNames){
  const ws=wb.Sheets[sn];if(!ws)continue;
  const csv=XLSX.utils.sheet_to_csv(ws,{blankrows:false}).trim(),n=csv?csv.split('\n').length:0;
  out+=(out?'\n\n':'')+'## Sheet: '+sn+' ('+n+' baris)\n'+(csv||'(kosong)');
  if(out.length>limit)break;
 }
 return out;
};

/* ---------- PDF ---------- */
const pdfRead=async(buf,limit,wantImg)=>{
 await needPdf();
 pdfjsLib.GlobalWorkerOptions.workerSrc=(LU.pdf||LIBS.pdf[0]).replace('pdf.min.js','pdf.worker.min.js');
 const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise,N=doc.numPages;
 let out='',got=0;
 try{
  for(let p=1;p<=N&&out.length<limit;p++){
   const pg=await doc.getPage(p),tc=await pg.getTextContent();let s='',y=null;
   for(const it of tc.items){
    if(typeof it.str!=='string')continue;
    const yy=it.transform?it.transform[5]:null;
    if(y!==null&&yy!==null&&Math.abs(yy-y)>(Math.abs(it.transform[3])||8)*.6&&!s.endsWith('\n'))s+='\n';
    else if(s&&!/\s$/.test(s)&&it.str&&!/^\s/.test(it.str))s+=' ';
    s+=it.str;if(it.hasEOL&&!s.endsWith('\n'))s+='\n';
    if(yy!==null)y=yy;
   }
   s=tidy(s.replace(/[ \t]{2,}/g,' '));got=p;
   if(s)out+=(out?'\n\n':'')+'--- Halaman '+p+' ---\n'+s;
  }
  if(!out.trim()&&wantImg){
   const pg=await doc.getPage(1),v0=pg.getViewport({scale:1}),k=Math.min(3,1280/Math.max(v0.width,v0.height)),vp=pg.getViewport({scale:k}),c=document.createElement('canvas');
   c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
   const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
   await pg.render({canvasContext:cx,viewport:vp}).promise;
   return{scan:true,pages:N,img:c.toDataURL('image/jpeg',.85)};
  }
 }finally{try{doc.destroy()}catch(e){}}
 return{text:out,pages:N,read:got};
};

/* ---------- ZIP ---------- */
const TXT=/\.(txt|md|markdown|csv|tsv|json|jsonl|js|mjs|cjs|ts|tsx|jsx|html?|css|scss|py|xml|svg|log|sql|sh|bat|ya?ml|ini|toml|cfg|conf|env|java|kt|c|h|cpp|hpp|cs|go|rs|php|rb|swift|r|lua|vue)$/i;
const JUNK=/(^|\/)(__MACOSX|node_modules|\.git|\.idea|\.vscode)(\/|$)|(^|\/)(\.DS_Store|Thumbs\.db|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$|\.min\.(js|css)$/i;
const zipText=async(z,limit,depth)=>{
 const all=Object.values(z.files).filter(f=>!f.dir),ents=all.filter(f=>!JUNK.test(f.name)).sort((a,b)=>a.name<b.name?-1:a.name>b.name?1:0);
 const usz=f=>(f._data&&f._data.uncompressedSize)||0;
 let head='Daftar berkas ('+ents.length+(all.length>ents.length?'; '+(all.length-ents.length)+' berkas sistem/dependensi dilewati':'')+'):\n'+ents.slice(0,120).map(f=>'- '+f.name+' ('+kb(usz(f))+')').join('\n')+(ents.length>120?'\n… dan '+(ents.length-120)+' berkas lain':'');
 let body='',nested=0;
 for(const f of ents){
  if(head.length+body.length>=limit)break;
  const m=f.name.match(/\.(\w+)$/),ext=m?m[1].toLowerCase():'',sz=usz(f);
  try{
   let t=null;
   if(TXT.test(f.name)||/(^|\/)(readme|license|makefile|dockerfile)$/i.test(f.name)){if(sz>400000)continue;t=await f.async('string')}
   else if(depth<1&&nested<4&&/^(docx|pptx|xlsx|xlsm|pdf)$/.test(ext)&&sz<8e6){nested++;t=(await extract(ext,await f.async('arraybuffer'),5000,depth+1,false)).text}
   if(t&&t.trim())body+='\n\n### '+f.name+'\n'+(t.length>6000?t.slice(0,6000)+'\n…(dipotong)':t);
  }catch(e){}
 }
 return head+(body?'\n\n=== Isi berkas ===':'')+body;
};

async function extract(ext,buf,limit,depth,top){
 if(ext==='pdf'){const r=await pdfRead(buf,limit,top);return r}
 if(ext==='docx'){await needZip();return{text:await docxText(await JSZip.loadAsync(buf))}}
 if(ext==='pptx'){await needZip();return{text:await pptxText(await JSZip.loadAsync(buf))}}
 if(ext==='zip'){await needZip();return{text:await zipText(await JSZip.loadAsync(buf),limit,depth)}}
 return{text:await xlsText(buf,limit)};
}

/* ---------- Penyambung ke lampiran (#fi) ---------- */
const DOCRE=/\.(pdf|docx|pptx|xlsx|xlsm|xls|ods|zip)$/i,OLDRE=/\.(doc|ppt)$/i,LABEL={pdf:'PDF',docx:'Word',pptx:'PowerPoint',xlsx:'Excel',xlsm:'Excel',xls:'Excel',ods:'Spreadsheet',zip:'ZIP'};
const warn=m=>{note('⚠️ '+m);setTimeout(()=>{if($('#pv').textContent.startsWith('⚠️'))note('')},4500)};
const nice=e=>{const s=String((e&&e.name)||'')+' '+String((e&&e.message)||e);
 if(/pustaka pembaca/.test(s))return(e&&e.message)||s;
 if(/password/i.test(s))return'file ini diproteksi password';
 if(/end of central directory|zip|corrupt|invalid pdf|InvalidPDF|bad xref/i.test(s))return'file rusak atau bukan format yang benar';
 return(e&&e.message)||String(e)};
const DOCBUF=new Map();
async function readDoc(f){
 const m=f.name.match(/\.(\w+)$/),ext=m?m[1].toLowerCase():'';
 try{
  if(f.size>MAXF)throw new Error('file terlalu besar (maksimal 25 MB)');
  note('⏳ membaca '+f.name+'...');
  const buf=await(f.arrayBuffer?f.arrayBuffer():new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('gagal membaca file'));r.readAsArrayBuffer(f)}));
  if(ext==='docx')DOCBUF.set(f.name,buf);
  const r=await extract(ext,buf,MAXT,0,true);
  att=null;
  if(r.img){img=r.img;docTxt=null;note('📎 '+f.name+' (PDF hasil scan: halaman 1 dikirim sebagai gambar)');return}
  let t=(r.text||'').trim();
  if(!t)throw new Error('tidak ada teks yang bisa dibaca di file ini');
  const head='['+LABEL[ext]+': '+f.name+(r.pages?' — '+r.pages+' halaman'+(r.read&&r.read<r.pages?', dibaca halaman 1–'+r.read:''):'')+']\n';
  let cut=false;if(t.length>MAXT){t=t.slice(0,MAXT);cut=true}
  docTxt={name:f.name,text:head+t+(cut?'\n\n[…dipotong: hanya bagian awal yang terbaca]':'')};img=null;
  note('📎 file terlampir: '+f.name+(cut?' (sebagian awal)':''));
 }catch(e){warn('gagal membaca '+f.name+': '+nice(e))}
}
document.addEventListener('change',e=>{
 const t=e.target;if(!t||t.id!=='fi')return;
 const f=t.files&&t.files[0];if(!f)return;
 if(DOCRE.test(f.name)){e.stopPropagation();t.value='';readDoc(f)}
 else if(OLDRE.test(f.name)){e.stopPropagation();t.value='';warn('format lama (.doc/.ppt) belum didukung; simpan ulang sebagai .docx / .pptx')}
},true);
window.DOCREAD={extract,readDoc};

/* ===================== ALAT BARU UNTUK CHAT UTAMA ===================== */
const XT=window.XT;
if(XT){
 /* ---------- code: JavaScript di Web Worker (tanpa DOM, tanpa penyimpanan, jaringan dimatikan, bisa dihentikan) ---------- */
 const workerMain=function(){
  'use strict';
  const L=[];let cnt=0,len=0;
  const fmt=v=>{try{if(typeof v==='string')return v;if(v===undefined)return'undefined';if(typeof v==='function')return String(v).slice(0,200);if(typeof v==='bigint')return v+'n';if(v instanceof Error)return v.name+': '+v.message;return JSON.stringify(v,(k,x)=>typeof x==='bigint'?x+'n':x instanceof Map?Object.fromEntries(x):x instanceof Set?[...x]:x,1)}catch(e){return String(v)}};
  const put=(p,a)=>{if(cnt++<300){const s=p+a.map(fmt).join(' ');len+=s.length;if(len<20000)L.push(s)}};
  for(const k of['log','info','debug','table','dir'])console[k]=(...a)=>put('',a);
  console.warn=(...a)=>put('[warn] ',a);console.error=(...a)=>put('[error] ',a);
  for(const k of['fetch','XMLHttpRequest','WebSocket','EventSource','importScripts','Worker','SharedWorker','indexedDB','caches','BroadcastChannel']){try{Object.defineProperty(self,k,{value:undefined,configurable:true,writable:true})}catch(e){}}
  const AF=Object.getPrototypeOf(async function(){}).constructor;
  self.onmessage=async e=>{
   const code=String((e.data&&e.data.code)||''),t0=Date.now();let val,err=null;
   try{let fn=null;try{fn=new Function('return ('+code+'\n)')}catch(_){}val=fn?await fn():await new AF(code)()}catch(x){err=x}
   let out=L.join('\n');if(out.length>4000)out=out.slice(0,4000)+'\n…(output dipotong)';
   const r={ms:Date.now()-t0};if(out)r.output=out;
   if(err)r.error=(err&&err.name?err.name+': ':'')+(err&&err.message?err.message:String(err));
   else if(val!==undefined){let s=fmt(val);if(s.length>2000)s=s.slice(0,2000)+'…';r.hasil=s}
   postMessage(r);
  };
 };
 const WSRC='('+workerMain.toString()+')()';
 const runJS=(code,ms)=>new Promise(res=>{
  let w,url,done=false,t;
  const fin=r=>{if(done)return;done=true;clearTimeout(t);try{w.terminate()}catch(e){}try{URL.revokeObjectURL(url)}catch(e){}res(r)};
  try{url=URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'}));w=new Worker(url)}catch(e){return res({error:'Worker tidak tersedia di browser ini: '+(e.message||e)})}
  w.onmessage=e=>fin(e.data);
  w.onerror=e=>fin({error:'Kesalahan saat menjalankan kode: '+(e.message||'tidak diketahui')});
  t=setTimeout(()=>fin({error:'Waktu habis ('+ms/1000+' detik), kode dihentikan (mungkin loop tak berujung)'}),ms);
  w.postMessage({code});
 });
 XT.code=async a=>{
  const lang=String((a&&a.lang)||'js').toLowerCase(),code=String((a&&a.code)||'');
  if(!/^(js|javascript|node|ecmascript)$/.test(lang))throw new Error('Saat ini hanya JavaScript yang didukung (lang:"js")');
  if(!code.trim())throw new Error('Kode kosong');
  if(code.length>20000)throw new Error('Kode terlalu panjang (maks 20.000 karakter)');
  return runJS(code,6000);
 };

 /* ---------- file: buat berkas, tampil sebagai tombol Unduh / Bagikan di bawah jawaban ---------- */
 const MIME={txt:'text/plain',md:'text/markdown',csv:'text/csv',tsv:'text/tab-separated-values',json:'application/json',html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',py:'text/x-python',xml:'application/xml',svg:'image/svg+xml',log:'text/plain',sql:'text/plain',sh:'text/plain',yaml:'text/yaml',yml:'text/yaml',ts:'text/plain',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
 const XF=window.XF={q:[]};
 XT.file=async a=>{
  a=a||{};let nama=String(a.nama||a.name||'').trim(),isi=a.isi!=null?a.isi:a.content!=null?a.content:a.teks!=null?a.teks:a.text;
  if(isi==null||String(isi)==='')throw new Error('Isi berkas kosong');isi=String(isi);
  if(isi.length>300000)throw new Error('Isi terlalu besar (maksimal 300 KB)');
  nama=nama.replace(/[\\\/:*?"<>|\u0000-\u001f]+/g,'_').replace(/^\.+/,'').slice(0,80)||'berkas';
  const m=nama.match(/\.(\w{1,5})$/);let ext=m?m[1].toLowerCase():'';
  if(!ext){nama+='.txt';ext='txt'}
  else if(!MIME[ext])throw new Error('Format .'+ext+' belum bisa dibuat. Pilih: txt, md, csv, tsv, json, html, css, js, py, xml, svg, sql, sh, yaml, atau xlsx (isi berupa CSV)');
  if(XF.q.length>=5)throw new Error('Maksimal 5 berkas per jawaban');
  let blob;
  if(ext==='xlsx'){await needXls();const wb=XLSX.read(isi,{type:'string'});blob=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:MIME.xlsx})}
  else blob=new Blob([ext==='csv'||ext==='tsv'?'\ufeff'+isi:isi],{type:MIME[ext]+';charset=utf-8'});
  XF.q.push({name:nama,blob,t:Date.now()});
  return{ok:true,nama,ukuran:kb(blob.size),catatan:'Tombol Unduh/Bagikan sudah tampil di chat. Jangan menempelkan ulang seluruh isi berkas; cukup jelaskan singkat.'};
 };
 const css=document.createElement('style');
 css.textContent='.xfc{display:flex;align-items:center;gap:10px;margin:10px 0 2px;padding:10px 12px;border-radius:14px;background:#1c1c1e;font-size:14px}.xfc b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.xfc span{color:#8e8e93;font-size:12px;white-space:nowrap}.xfc button{padding:6px 12px;border-radius:10px;background:#2c2c2e;font-weight:600;font-size:13px;white-space:nowrap}';
 document.head.appendChild(css);
 const dl=f=>{const a=document.createElement('a'),u=URL.createObjectURL(f.blob);a.href=u;a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},8000)};
 const shr=async f=>{try{const file=new File([f.blob],f.name,{type:f.blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return}}catch(e){if(e&&e.name==='AbortError')return}dl(f)};
 const mkBtn=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;return b};
 const mountFiles=box=>{
  const now=Date.now(),L=XF.q.filter(f=>now-f.t<600000);XF.q=[];if(!L.length)return;
  const wrap=document.createElement('div');
  for(const f of L){const d=document.createElement('div');d.className='xfc';const b=document.createElement('b'),s=document.createElement('span');b.textContent='📄 '+f.name;s.textContent=kb(f.blob.size);d.append(b,s,mkBtn('Unduh',()=>dl(f)),mkBtn('Bagikan',()=>shr(f)));wrap.appendChild(d)}
  box.appendChild(wrap);
 };
 const msEl=document.getElementById('ms');
 if(msEl)new MutationObserver(ml=>{for(const m of ml)for(const n of m.addedNodes)if(n.nodeType===1&&n.classList.contains('bm')&&!n.classList.contains('xr')&&XF.q.length)mountFiles(n)}).observe(msEl,{childList:true});

 /* ---------- dokumen: buat Word (.docx, .doc), PDF dengan teks berwarna dan foto; edit Word (.docx) milik pengguna atau bot ---------- */
 const MIME_DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
 const DOCCOL={merah:'FF0000',biru:'0070C0',hijau:'00B050',kuning:'FFC000',ungu:'7030A0',oranye:'FF8000',pink:'FF66CC',coklat:'8B4513',abu:'808080',hitam:'000000',putih:'FFFFFF',tosca:'00B5AD'};
 const hexWarna=c=>{const k=String(c==null?'':c).trim().toLowerCase();if(DOCCOL[k])return DOCCOL[k];const h=k.replace(/^#/,'');return /^[0-9a-f]{6}$/.test(h)?h.toUpperCase():null};
 const xEsc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const loadScr=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('gagal memuat pustaka PDF'));document.head.appendChild(s)});
 const needJsPdf=async()=>{if(!window.jspdf)await loadScr('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')};
 const normBlok=isi=>{
   const a=Array.isArray(isi)?isi:String(isi==null?'':isi).split(/\n+/).filter(x=>x.trim());
   return a.map(b=>typeof b==='string'?{tipe:'paragraf',teks:b}:b);
 };
 /* ambil foto dari chat (nama gambar) atau URL https, lalu ubah ke PNG agar bisa dipakai di semua format */
 const fotoBlob=async ref=>{
   const r=String(ref==null?'':ref).trim(); if(!r) return null;
   let src;
   if(/^https:\/\//i.test(r)){ const res=await fetch(r); if(!res.ok) throw new Error('foto tidak bisa diambil (HTTP '+res.status+')'); src=await res.blob() }
   else{
     const F=(window.__FS||[]).filter(f=>f.data&&/^data:image\//.test(f.data));
     const k=r.toLowerCase();
     const f=F.find(x=>x.name.toLowerCase()===k)||F.find(x=>x.name.toLowerCase().includes(k));
     if(!f) throw new Error('foto "'+r+'" tidak ada di chat. Pakai nama gambar yang sudah ada di chat, atau URL https');
     src=await (await fetch(f.data)).blob();
   }
   const bmp=await createImageBitmap(src);
   const cv=document.createElement('canvas');cv.width=bmp.width;cv.height=bmp.height;cv.getContext('2d').drawImage(bmp,0,0);
   const png=await new Promise(ok=>cv.toBlob(ok,'image/png'));
   return {w:bmp.width,h:bmp.height,bytes:new Uint8Array(await png.arrayBuffer()),dataUrl:cv.toDataURL('image/png')};
 };
 /* siapkan semua foto dalam dokumen: ukuran, nama berkas dalam paket, dan id relasi */
 const bukaImg=async(blocks,prefix,baseId)=>{
   const map=new Map(),imgs=[];let id=baseId||1;
   for(const b of blocks){
     const ref=b.foto||(b.tipe==='foto'?b.teks:null);
     if(!ref||map.has(ref)) continue;
     const f=await fotoBlob(ref);
     const cm=Math.min(16,Math.max(2,+b.lebar||12));
     const cx=Math.round(cm*360000), cy=Math.min(7920000,Math.round(cx*f.h/f.w));
     const k=id++;
     const im={id:k,rid:'rId'+prefix+k,file:'media/'+prefix+k+'.png',cx,cy,w:f.w,h:f.h,bytes:f.bytes,dataUrl:f.dataUrl};
     imgs.push(im); map.set(ref,im);
   }
   return {imgs,map};
 };
 const runXml=(t,o)=>{
   const rp=(o.tebal?'<w:b/>':'')+(o.miring?'<w:i/>':'')+(o.warna?'<w:color w:val="'+o.warna+'"/>':'')+(o.ukuran?'<w:sz w:val="'+Math.round(o.ukuran*2)+'"/>':'');
   return '<w:r>'+(rp?'<w:rPr>'+rp+'</w:rPr>':'')+'<w:t xml:space="preserve">'+xEsc(t)+'</w:t></w:r>';
 };
 const jcDocx=r=>({tengah:'center',kanan:'right',rata:'both',kiri:'left'})[r]||null;
 const blokDocx=b=>{
   const warna=hexWarna(b.warna);
   const o={tebal:!!b.tebal||b.tipe==='judul'||b.tipe==='sub',miring:!!b.miring,warna,ukuran:b.ukuran||(b.tipe==='judul'?20:b.tipe==='sub'?15:null)};
   const jc=jcDocx(b.rata)||(b.tipe==='judul'?'center':null);
   const pp=(b.tipe==='poin'?'<w:ind w:left="720" w:hanging="360"/>':'')+(jc?'<w:jc w:val="'+jc+'"/>':'');
   const isi=b.tipe==='poin'?runXml('• ',o)+runXml(b.teks||'',o):runXml(b.teks||'',o);
   return '<w:p>'+(pp?'<w:pPr>'+pp+'</w:pPr>':'')+isi+'</w:p>';
 };
 const tabelDocx=b=>{
   const rows=(b.baris||[]).map(r=>Array.isArray(r)?r:[r]);
   const n=Math.max(1,...rows.map(r=>r.length)), cw=Math.floor(9000/n), warna=hexWarna(b.warna);
   const bd=['top','left','bottom','right','insideH','insideV'].map(s=>'<w:'+s+' w:val="single" w:sz="4" w:space="0" w:color="808080"/>').join('');
   let x='<w:tbl><w:tblPr><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders>'+bd+'</w:tblBorders></w:tblPr><w:tblGrid>'+('<w:gridCol w:w="'+cw+'"/>').repeat(n)+'</w:tblGrid>';
   rows.forEach((r,ri)=>{
     x+='<w:tr>';
     for(let c=0;c<n;c++) x+='<w:tc><w:tcPr><w:tcW w:w="'+cw+'" w:type="dxa"/></w:tcPr><w:p>'+runXml(r[c]==null?'':String(r[c]),{tebal:ri===0,warna})+'</w:p></w:tc>';
     x+='</w:tr>';
   });
   return x+'</w:tbl>';
 };
 const gambarDocx=im=>'<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="'+im.cx+'" cy="'+im.cy+'"/><wp:docPr id="'+im.id+'" name="Gambar '+im.id+'"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="'+im.id+'" name="'+im.file.replace('media/','')+'"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="'+im.rid+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+im.cx+'" cy="'+im.cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
 const NSDOC='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
 /* isi satu blok: teks, poin, tabel, atau foto (dengan keterangan opsional) */
 const blokKeDocx=(blocks,map)=>{
   let x='';
   for(const b of blocks){
     if(b.tipe==='tabel'){ x+=tabelDocx(b); continue }
     const ref=b.foto||(b.tipe==='foto'?b.teks:null);
     if(ref){ x+='<w:p><w:pPr><w:jc w:val="center"/></w:pPr>'+gambarDocx(map.get(ref))+'</w:p>'; if(b.tipe!=='foto'&&b.teks) x+=blokDocx(b); continue }
     x+=blokDocx(b);
   }
   return x;
 };
 const RELS_NS='http://schemas.openxmlformats.org/package/2006/relationships';
 async function buatDocx(blocks){
   await needZip();
   const {imgs,map}=await bukaImg(blocks,'Img',1);
   const body=blokKeDocx(blocks,map);
   const zip=new JSZip();
   zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
   zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="'+RELS_NS+'"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
   zip.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document '+NSDOC+'><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>');
   zip.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="'+RELS_NS+'">'+imgs.map(im=>'<Relationship Id="'+im.rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="'+im.file+'"/>').join('')+'</Relationships>');
   imgs.forEach(im=>zip.file('word/'+im.file,im.bytes));
   return await zip.generateAsync({type:'arraybuffer',mimeType:MIME_DOCX});
 }
 /* .doc: RTF dengan warna dan foto PNG, bisa dibuka Word */
 async function buatRtf(blocks){
   const {map}=await bukaImg(blocks,'Img',1);
   const pal=[];const ci=h=>{if(!h)return 0;let i=pal.indexOf(h);if(i<0){pal.push(h);i=pal.length-1}return i+1};
   const rt=s=>{let o='';for(const ch of String(s==null?'':s)){const c=ch.codePointAt(0);if(ch==='\\')o+='\\\\';else if(ch==='{')o+='\\{';else if(ch==='}')o+='\\}';else if(ch==='\n')o+='\\line ';else if(c>127){o+='\\u'+(c>32767?c-65536:c)+'?'}else o+=ch}return o};
   let body='';
   for(const b of blocks){
     if(b.tipe==='tabel'){
       const rows=(b.baris||[]).map(r=>Array.isArray(r)?r:[r]);
       rows.forEach((r,ri)=>{body+='\\pard\\ql'+(ri===0?'\\b ':'')+(ci(hexWarna(b.warna))?'\\cf'+ci(hexWarna(b.warna))+' ':'')+'\\fs24 '+rt(r.join('   |   '))+'\\b0\\i0\\cf0\\par\n'});
       continue;
     }
     const ref=b.foto||(b.tipe==='foto'?b.teks:null);
     if(ref){
       const im=map.get(ref);
       const hex=Array.from(im.bytes,x=>x.toString(16).padStart(2,'0')).join('');
       body+='\\pard\\qc{\\pict\\pngblip\\picwgoal'+Math.round(im.cx/635)+'\\pichgoal'+Math.round(im.cy/635)+'\n'+hex+'}\\par\n';
       if(b.tipe==='foto'||!b.teks) continue;
     }
     const c=ci(hexWarna(b.warna));
     const sz=b.ukuran?Math.round(b.ukuran*2):(b.tipe==='judul'?40:b.tipe==='sub'?30:24);
     const al=(b.tipe==='judul'||b.rata==='tengah')?'\\qc':b.rata==='kanan'?'\\qr':b.rata==='rata'?'\\qj':'\\ql';
     const ind=b.tipe==='poin'?'\\li360\\fi-360 \\u8226?\\tab ':'';
     body+='\\pard'+al+ind+((b.tipe==='judul'||b.tipe==='sub'||b.tebal)?'\\b ':'')+(b.miring?'\\i ':'')+(c?'\\cf'+c+' ':'')+'\\fs'+sz+' '+rt(b.teks||'')+'\\b0\\i0\\cf0\\par\n';
   }
   const colors=pal.map(h=>'\\red'+parseInt(h.slice(0,2),16)+'\\green'+parseInt(h.slice(2,4),16)+'\\blue'+parseInt(h.slice(4,6),16)+';').join('');
   return '{\\rtf1\\ansi\\ansicpg1252\\deff0{\\fonttbl{\\f0\\fswiss Arial;}}{\\colortbl;'+colors+'}\\f0\\fs24\n'+body+'}';
 }
 /* PDF: teks berwarna, judul, poin, tabel sederhana, dan foto */
 async function buatPdf(blocks){
   await needJsPdf();
   const {map}=await bukaImg(blocks,'Img',1);
   const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
   const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),M=56;
   let y=M;
   const cek=h=>{if(y+h>H-M){pdf.addPage();y=M}};
   const setCol=h=>{if(h)pdf.setTextColor(parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16));else pdf.setTextColor(0,0,0)};
   for(const b of blocks){
     if(b.tipe==='tabel'){
       const rows=(b.baris||[]).map(r=>Array.isArray(r)?r:[r]);
       rows.forEach((r,ri)=>{
         pdf.setFont('helvetica',ri===0?'bold':'normal');pdf.setFontSize(11);setCol(hexWarna(b.warna));
         const lines=pdf.splitTextToSize(r.map(x=>x==null?'':String(x)).join('   |   '),W-2*M);
         cek(lines.length*14+6);pdf.text(lines,M,y+11);y+=lines.length*14+6;
       });
       y+=8; continue;
     }
     const ref=b.foto||(b.tipe==='foto'?b.teks:null);
     if(ref){
       const im=map.get(ref);
       const wpt=Math.min(W-2*M,im.cx/12700), hpt=wpt*im.h/im.w;
       cek(hpt+10); pdf.addImage(im.dataUrl,'PNG',M,y,wpt,hpt); y+=hpt+10;
       if(b.tipe==='foto'||!b.teks) continue;
     }
     const size=b.ukuran||(b.tipe==='judul'?20:b.tipe==='sub'?15:11);
     const bold=b.tipe==='judul'||b.tipe==='sub'||!!b.tebal;
     pdf.setFont('helvetica',bold?'bold':(b.miring?'italic':'normal'));
     pdf.setFontSize(size);setCol(hexWarna(b.warna));
     const lines=pdf.splitTextToSize((b.tipe==='poin'?'• ':'')+(b.teks||''),W-2*M);
     const lh=size*1.35; cek(lines.length*lh+6);
     const al=(b.tipe==='judul'||b.rata==='tengah')?'center':b.rata==='kanan'?'right':'left';
     const x=al==='center'?W/2:al==='right'?W-M:M;
     pdf.text(lines,x,y+size,{align:al});
     y+=lines.length*lh+(b.tipe==='judul'?12:6);
   }
   return pdf.output('arraybuffer');
 }
 /* edit Word (.docx) yang sudah ada: warnai, tebalkan, ganti teks, tambah paragraf/tabel/foto */
 const docxBufAsli=async(nama)=>{
   const cari=String(nama||'').trim().toLowerCase(), keys=[...DOCBUF.keys()];
   const key=keys.find(k=>k.toLowerCase()===cari)||keys.find(k=>k.toLowerCase().includes(cari));
   if(!key) throw new Error('Dokumen Word "'+nama+'" tidak ditemukan. Yang tersedia: '+(keys.join(', ')||'(belum ada)'));
   return key;
 };
 XT.dokumen=async a=>{
   a=a||{};
   let nama=String(a.nama||'dokumen.docx').trim().replace(/[\\\/:*?"<>|\u0000-\u001f]+/g,'_').replace(/^\.+/,'').slice(0,80)||'dokumen.docx';
   const mm=nama.match(/\.(\w+)$/); if(!mm){nama+='.docx'}
   const ext=(mm?mm[1]:'docx').toLowerCase();
   if(!/^(docx|doc|pdf)$/.test(ext)) throw new Error('format .'+ext+' belum didukung. Pilih .docx, .doc, atau .pdf');
   const blocks=normBlok(a.isi!=null?a.isi:(a.blok!=null?a.blok:''));
   if(!blocks.length) throw new Error('isi dokumen kosong');
   if(XF.q.length>=5) throw new Error('Maksimal 5 berkas per jawaban');
   let blob;
   if(ext==='docx'){ const buf=await buatDocx(blocks); DOCBUF.set(nama,buf); blob=new Blob([buf],{type:MIME_DOCX}) }
   else if(ext==='doc'){ const rtf=await buatRtf(blocks); blob=new Blob([rtf],{type:'application/msword'}) }
   else { const buf=await buatPdf(blocks); blob=new Blob([buf],{type:'application/pdf'}) }
   XF.q.push({name:nama,blob,t:Date.now()});
   return {ok:true,nama,ukuran:kb(blob.size),catatan:'Tombol Unduh/Bagikan sudah tampil di chat. Jangan menempelkan ulang seluruh isi; cukup jelaskan singkat.'};
 };

 /* urutan elemen rPr di Word harus dijaga agar file tetap valid */
 const RPR_ORDER=['rStyle','rFonts','b','bCs','i','iCs','caps','smallCaps','strike','dstrike','outline','shadow','emboss','imprint','noProof','snapToGrid','vanish','webHidden','color','spacing','w','kern','position','sz','szCs','highlight','u','effect','bdr','shd','fitText','vertAlign','rtl','cs','em','lang','eastAsianLayout','specVanish','oMath'];
 XT.dokumen_edit=async a=>{
   a=a||{};
   const key=await docxBufAsli(a.nama);
   const ops=Array.isArray(a.operasi)?a.operasi:[];
   if(!ops.length) throw new Error('operasi kosong');
   await needZip();
   const zip=await JSZip.loadAsync(DOCBUF.get(key));
   const fDoc=zip.file('word/document.xml');
   if(!fDoc) throw new Error('bukan file .docx yang valid');
   const dom=new DOMParser().parseFromString(await fDoc.async('string'),'application/xml');
   if(dom.getElementsByTagName('parsererror').length) throw new Error('isi dokumen tidak bisa dibaca');
   const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
   const stamp='Bot'+Date.now().toString(36);
   const fRel=zip.file('word/_rels/document.xml.rels');
   let relXml=fRel?await fRel.async('string'):'<Relationships xmlns="'+RELS_NS+'"></Relationships>';
   const relAdd=[];let docPrId=9000;
   const paras=()=>Array.from(dom.getElementsByTagNameNS(W,'p'));
   const teksP=p=>Array.from(p.getElementsByTagNameNS(W,'t')).map(t=>t.textContent).join('');
   const cariP=s=>{const q=String(s==null?'':s).toLowerCase();return paras().find(p=>teksP(p).toLowerCase().includes(q))||null};
   const setRPr=(r,tag,val)=>{
     let rp=Array.from(r.childNodes).find(n=>n.localName==='rPr'&&n.namespaceURI===W);
     if(!rp){rp=dom.createElementNS(W,'w:rPr');r.insertBefore(rp,r.firstChild)}
     let el=Array.from(rp.childNodes).find(n=>n.localName===tag&&n.namespaceURI===W);
     if(!el){
       el=dom.createElementNS(W,'w:'+tag);
       const idx=RPR_ORDER.indexOf(tag);
       const after=Array.from(rp.childNodes).find(n=>n.nodeType===1&&RPR_ORDER.indexOf(n.localName)>idx);
       rp.insertBefore(el,after||null);
     }
     if(val!==undefined) el.setAttributeNS(W,'w:val',val);
   };
   const hasil=[],gagal=[];
   for(const op of ops){
     const aksi=String(op.aksi||'').toLowerCase();
     if(aksi==='warnai'||aksi==='tebal'||aksi==='miring'){
       const p=cariP(op.cari);
       if(!p){gagal.push('teks "'+op.cari+'" tidak ditemukan');continue}
       const rgb=aksi==='warnai'?hexWarna(op.warna):null;
       if(aksi==='warnai'&&!rgb){gagal.push('warna "'+op.warna+'" tidak dikenal');continue}
       const runs=Array.from(p.getElementsByTagNameNS(W,'r'));
       runs.forEach(r=>{ if(aksi==='warnai') setRPr(r,'color',rgb); else if(aksi==='tebal') setRPr(r,'b'); else setRPr(r,'i') });
       hasil.push(aksi+': '+runs.length+' potongan teks');
     }
     else if(aksi==='ganti'){
       const q=String(op.cari||''), n=Array.from(dom.getElementsByTagNameNS(W,'t')).filter(t=>t.textContent.includes(q));
       if(!q||!n.length){gagal.push('teks "'+op.cari+'" tidak ditemukan');continue}
       n.forEach(t=>{t.textContent=t.textContent.split(q).join(String(op.ganti==null?'':op.ganti))});
       hasil.push('ganti: '+n.length+' tempat');
     }
     else if(aksi==='tambah'){
       const blocks=normBlok(op.isi!=null?op.isi:'');
       if(!blocks.length){gagal.push('tambah: isi kosong');continue}
       /* penanda boleh berada di dalam tabel; sisipkan setelah blok teratas di badan dokumen */
       const topBody=p=>{let t=p;while(t.parentNode&&t.parentNode.localName!=='body')t=t.parentNode;return t};
       const anchorP=op.setelah?cariP(op.setelah):null;
       const anchor=anchorP?topBody(anchorP):null;
       if(op.setelah&&!anchor){gagal.push('penanda "'+op.setelah+'" tidak ditemukan');continue}
       const {imgs,map}=await bukaImg(blocks,stamp,docPrId);
       docPrId+=imgs.length+1;
       const frag=new DOMParser().parseFromString('<root '+NSDOC+'>'+blokKeDocx(blocks,map)+'</root>','application/xml');
       const nodes=Array.from(frag.documentElement.childNodes).filter(n=>n.nodeType===1);
       const body=dom.getElementsByTagNameNS(W,'body')[0];
       const sp=Array.from(body.childNodes).find(n=>n.nodeType===1&&n.localName==='sectPr');
       const ref=anchor?anchor.nextSibling:(sp||null);
       const parent=anchor?anchor.parentNode:body;
       nodes.forEach(n=>parent.insertBefore(dom.importNode(n,true),ref));
       imgs.forEach(im=>{relAdd.push(im);zip.file('word/'+im.file,im.bytes)});
       hasil.push('tambah: '+nodes.length+' blok');
     }
     else gagal.push('aksi "'+op.aksi+'" tidak dikenal (pakai warnai, tebal, miring, ganti, tambah)');
   }
   let out=new XMLSerializer().serializeToString(dom);
   if(!/^<\?xml/.test(out)) out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+out;
   zip.file('word/document.xml',out);
   if(relAdd.length){
     const add=relAdd.map(im=>'<Relationship Id="'+im.rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="'+im.file+'"/>').join('');
     relXml=relXml.includes('</Relationships>')?relXml.replace('</Relationships>',add+'</Relationships>'):relXml.replace(/\/>\s*$/,'>')+add+'</Relationships>';
     zip.file('word/_rels/document.xml.rels',relXml);
     const fCt=zip.file('[Content_Types].xml');
     if(fCt){ let ct=await fCt.async('string'); if(!/Extension="png"/i.test(ct)){ct=ct.replace(/<Types([^>]*)>/,'<Types$1><Default Extension="png" ContentType="image/png"/>');zip.file('[Content_Types].xml',ct)} }
   }
   const outNama=String(a.nama_baru||key.replace(/\.docx$/i,'')+'-edit.docx').replace(/[\\\/:*?"<>|\u0000-\u001f]+/g,'_').slice(0,80);
   const buf=await zip.generateAsync({type:'arraybuffer',mimeType:MIME_DOCX});
   if(XF.q.length>=5) throw new Error('Maksimal 5 berkas per jawaban');
   DOCBUF.set(outNama,buf);
   XF.q.push({name:outNama,blob:new Blob([buf],{type:MIME_DOCX}),t:Date.now()});
   return {ok:true,nama:outNama,berhasil:hasil,gagal:gagal.length?gagal:undefined,catatan:'Tombol Unduh/Bagikan sudah tampil di chat. Jelaskan singkat apa yang diubah.'};
 };
 /* ---------- remind / reminders / unremind: tersimpan di perangkat, berbunyi saat aplikasi hidup atau dibuka lagi ---------- */
 const RK='xbotrem2';let RM=[];
 try{RM=JSON.parse(localStorage.getItem(RK)||'[]');if(!Array.isArray(RM))RM=[]}catch(e){RM=[]}
 const rsave=()=>{try{localStorage.setItem(RK,JSON.stringify(RM))}catch(e){}};
 const fdate=d=>new Intl.DateTimeFormat('id-ID',{dateStyle:'full',timeStyle:'short'}).format(d);
 const fire=r=>{
  const late=Date.now()-r.at,txt=r.msg+(late>120000?' (terlambat '+Math.round(late/60000)+' menit)':'');
  try{if(typeof add==='function')add('<div class="bm xr"><div class="bt">⏰ <b>Pengingat</b><br>'+esc(txt)+'</div></div>')}catch(e){}
  try{alertMsg('⏰ Pengingat',txt)}catch(e){}
 };
 const rtick=()=>{const now=Date.now(),due=RM.filter(r=>r.at<=now);if(!due.length)return;RM=RM.filter(r=>r.at>now);rsave();due.sort((a,b)=>a.at-b.at).forEach(fire)};
 setInterval(rtick,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)rtick()});setTimeout(rtick,2500);
 XT.remind=async a=>{
  a=a||{};const msg=String(a.pesan||a.msg||a.teks||'').trim().slice(0,200);if(!msg)throw new Error('Isi pengingat kosong');
  let at;
  if(a.menit!=null&&a.menit!==''){const mn=Number(a.menit);if(!isFinite(mn)||mn<=0)throw new Error('"menit" harus angka lebih dari 0');at=Date.now()+mn*60000}
  else if(a.waktu){const d=new Date(String(a.waktu).trim().replace(/^(\d{4}-\d{2}-\d{2}) /,'$1T'));if(isNaN(d))throw new Error('Format "waktu" tidak dikenali; pakai "YYYY-MM-DDTHH:MM" (waktu lokal pengguna)');at=d.getTime()}
  else throw new Error('Isi "menit" (dari sekarang) atau "waktu" (YYYY-MM-DDTHH:MM)');
  if(at<=Date.now()+5000)throw new Error('Waktu pengingat sudah lewat atau terlalu dekat');
  if(at>Date.now()+366*864e5)throw new Error('Waktu pengingat terlalu jauh (maksimal 1 tahun)');
  if(RM.length>=30)throw new Error('Terlalu banyak pengingat aktif (maksimal 30)');
  const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),at,msg};RM.push(r);rsave();
  try{askPerm()}catch(e){}
  return{ok:true,id:r.id,pesan:msg,berbunyi_pada:fdate(new Date(at)),catatan:'Pengingat hanya berbunyi selama aplikasi terbuka atau masih hidup di latar belakang; kalau aplikasi ditutup, pengingat muncul saat aplikasi dibuka lagi. Sampaikan ini dengan jujur kepada pengguna.'};
 };
 XT.reminders=async()=>({jumlah:RM.length,daftar:RM.slice().sort((a,b)=>a.at-b.at).map(r=>({id:r.id,pesan:r.msg,pada:fdate(new Date(r.at))}))});
 XT.unremind=async a=>{
  a=a||{};const n=RM.length;
  if(a.semua)RM=[];else if(a.id)RM=RM.filter(r=>r.id!==String(a.id));else throw new Error('Isi "id" (dari reminders) atau {"semua":true}');
  rsave();return{ok:true,dihapus:n-RM.length};
 };
}
})();
</script>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{let t=document.getElementById('xtoast');if(!t)return;t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2000)};

/* =====================================================================
   4. MEMORI PRIBADI DI CHAT UTAMA

const MK='xbot_pmem';
let MEM=[];try{MEM=JSON.parse(localStorage.getItem(MK)||'[]')}catch(e){MEM=[]}
const saveMem=()=>{try{localStorage.setItem(MK,JSON.stringify(MEM.slice(-50)))}catch(e){}};
const memTxt=()=>{if(!MEM.length)return'';return`\n\n[Memori Pribadi Pengguna]\nKamu mengingat fakta-fakta ini tentang pengguna dari percakapan sebelumnya. Gunakan dengan natural jika relevan, jangan sebutkan bahwa kamu punya "sistem memori".\n- ${MEM.join('\n- ')}`};
/* Tambahkan UI di Pengaturan */
const sm=$('#sm');
if(sm)new MutationObserver(()=>{
  if(sm.hidden||sm.querySelector('#xmemui'))return;
  const d=document.createElement('div');d.id='xmemui';

  sm.appendChild(d);

    w.innerHTML=`<h4>Fakta Tersimpan</h4>`+
      (MEM.length?`<ul>${MEM.map((m,i)=>`<li>${esc(m)}<button class="del" data-i="${i}">✕</button></li>`).join('')}</ul>`:`<div style="color:#8e8e93;font-size:13px">Belum ada memori.</div>`)+
      `<div class="xm-add"><input id="xmem-in" placeholder="Tambah fakta (mis: Nama saya Budi, suka kopi)"><button id="xmem-add">+</button></div>`;
    w.querySelectorAll('.del').forEach(b=>b.onclick=()=>{MEM.splice(+b.dataset.i,1);saveMem();renderMem()});
    w.querySelector('#xmem-add').onclick=()=>{
      const v=w.querySelector('#xmem-in').value.trim();
      if(v&&!MEM.includes(v)){MEM.push(v);saveMem();renderMem()}
    };
  };
  renderMem();
}).observe(sm,{attributes:true,attributeFilter:['hidden']});

/* =====================================================================
   SADAP FETCH: Suntik Memori & Ekstraksi Fakta Otomatis
   ===================================================================== */
const origFetch=window.fetch;
window.fetch=async function(input,init){
  const url=typeof input==='string'?input:(input&&input.url)||'';
  if(!url.includes('/chat')||!init||!init.body||String(init.body).includes('image_gen":true')) return origFetch.apply(this,arguments);
  
  let body;
  try{
    body=JSON.parse(init.body);
    // 1. Suntik memori ke system prompt
    body.system=(body.system||'')+memTxt()+`\n\n[Pencatat Memori] Jika pengguna menyebut fakta pribadi baru yang penting (nama, hobi, pekerjaan, proyek, preferensi), tambahkan di baris paling akhir jawabanmu: [simpan_memori: fakta singkat]. Hanya jika benar-benar baru.`;
    init.body=JSON.stringify(body);
  }catch(e){}

  const res=await origFetch.apply(this,arguments);
  
  // 2. Intersepsi response untuk mengambil fakta memori
  if(!res.body) return res;
  const reader=res.body.getReader();
  const stream=new ReadableStream({
    start(controller){
      let buf='';
      function pump(){
        reader.read().then(({done,value})=>{
          if(done){controller.close();return}
          const chunk=new TextDecoder().decode(value);
          buf+=chunk;
          // Cari [simpan_memori: ...] dan hapus dari teks
          let processed=chunk;
          const rx=/\[simpan_memori:\s*([^\]\n]+)\]/gi;
          let m;
          while((m=rx.exec(buf))){
            const fact=m[1].trim();
            if(fact&&!MEM.includes(fact)){
              MEM.push(fact);saveMem();
              console.log('Memori baru disimpan:',fact);
            }
          }
          // Hapus tag dari output stream (hanya di teks final)
          processed=processed.replace(rx,'');
          controller.enqueue(new TextEncoder().encode(processed));
          pump();
        }).catch(e=>controller.error(e));
      }
      pump();
    }
  });
  return new Response(stream,{headers:res.headers,status:res.status,statusText:res.statusText});
};

/* =====================================================================
   5. INPUT SUARA PENUH (MODE BICARA DUA ARAH)
   ===================================================================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const ib=$('#ib');
if(SR&&ib){
  /* Tombol pembuka: disembunyikan CSS, dibuka lewat menu yang memanggil #xvb.click() */
  const h=$('header');
  if(h&&!document.getElementById('xvb')){
    h.insertAdjacentHTML('beforeend',`<div id="xh-actions"><button id="xvb" aria-label="Mode Bicara">🎙️</button></div>`);
  }
  const vbox=document.createElement('div');vbox.id='xvoice';
  vbox.innerHTML=`<button id="xv-close" aria-label="Tutup telepon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button><div id="xv-head"><div id="xv-name"></div><div id="xv-time">Memanggil...</div></div><div id="xv-orb" role="button" aria-label="Orb suara"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div><div id="xv-tx" class="dim"></div><div id="xv-status"></div><button id="xv-spk" type="button" aria-label="Speaker aktif">🔊</button>`;
  document.body.appendChild(vbox);
  const elTx=document.getElementById('xv-tx'),elSt=document.getElementById('xv-status'),elOrb=document.getElementById('xv-orb');

  /* ---- Mode telepon: dengar -> kirim ke bot -> jawaban dibacakan -> dengar lagi ---- */
  const SILENCE_MS=1500;   /* diam sekian ms setelah kata terakhir = giliran kamu selesai */
  const MAX_EMPTY=6;       /* berapa kali hening berturut-turut sebelum jeda */
  let SPK=true,state='idle',rec=null,live=false,sess=0,sil=0,empties=0,svcRetry=0,micOk=false,wl=null;
  const ICON={idle:'🎙️',listen:'🎙️',think:'💭',speak:'🔊'};
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const setState=(s,msg)=>{
    state=s;
    vbox.classList.remove('s-idle','s-listen','s-think','s-speak');
    vbox.classList.add('s-'+s);
    if(msg!==undefined)elSt.textContent=msg;
  };
  const showTx=(t,dim)=>{elTx.classList.toggle('dim',!!dim);elTx.textContent=t};
  /* Timer panggilan: mulai saat mikrofon siap (tersambung) */
  const elName=document.getElementById('xv-name'),elTime=document.getElementById('xv-time');
  let t0=0,tick=0;
  const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
  const startTimer=()=>{if(tick)return;t0=Date.now();const u=()=>{elTime.textContent='Terhubung · '+fmt(Math.floor((Date.now()-t0)/1000))};u();tick=setInterval(u,1000)};
  const stopTimer=()=>{clearInterval(tick);tick=0;elTime.textContent='Memanggil...'};

  /* Layar tetap menyala selama panggilan */
  const wake=async()=>{try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){wl=null}};
  const unwake=()=>{try{if(wl)wl.release()}catch(e){}wl=null};

  /* Minta izin mikrofon dulu, baru mulai mendengarkan (mencegah error service-not-allowed di awal) */
  const ensureMic=async()=>{
    if(micOk)return true;
    try{
      if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
        const st=await navigator.mediaDevices.getUserMedia({audio:true});
        st.getTracks().forEach(t=>t.stop());
      }

    }catch(e){

  };

  const killRec=()=>{
    clearTimeout(sil);
    const r=rec;rec=null;
    if(r){r.onresult=r.onerror=r.onend=null;try{r.abort()}catch(e){}}
  };

  /* ---- Mendengarkan ---- */
  const listen=()=>{
    if(!live)return;
    killRec();
    const my=++sess;
    let got='',fatal=false;
    const r=new SR();rec=r;
    r.lang='id-ID';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    setState('listen','');
    showTx('Silakan bicara…',true);

    r.onresult=e=>{
      if(my!==sess)return;
      let t='';
      for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
      t=t.trim();if(!t)return;
      got=t;empties=0;
      showTx(t,false);
      clearTimeout(sil);
      /* otomatis berhenti kalau kamu diam sebentar */
      sil=setTimeout(()=>{if(my===sess&&rec===r){try{r.stop()}catch(e){}}},SILENCE_MS);
    };
    r.onerror=e=>{
      if(my!==sess)return;
      const c=e.error;
      if(c==='no-speech'||c==='aborted')return; /* ditangani di onend */
      fatal=true;
      if(c==='service-not-allowed'&&!svcRetry){ /* coba ulang sekali, biasanya hanya telat izin */
        svcRetry=1;
        setTimeout(()=>{if(live&&my===sess)listen()},700);
        return;
      }
      const msg=(c==='not-allowed'||c==='service-not-allowed')?'Pengenalan suara tidak diizinkan. Cek izin mikrofon dan Dikte (Pengaturan > Umum > Papan Ketik), lalu ketuk orb.'
        :c==='audio-capture'?'Mikrofon tidak terdeteksi. Ketuk orb untuk coba lagi.'
        :c==='network'?'Pengenalan suara butuh internet. Ketuk orb untuk coba lagi.'
        :'Input suara gagal ('+c+'). Ketuk orb untuk coba lagi.';
      setState('idle',msg);
    };
    r.onend=()=>{
      if(my!==sess)return;
      clearTimeout(sil);rec=null;
      if(fatal||!live)return;
      if(got){svcRetry=0;handle(got);return}
      empties++;
      if(empties>=MAX_EMPTY){setState('idle','Tidak ada suara terdengar. Ketuk orb untuk lanjut.');return}
      setTimeout(()=>{if(live&&my===sess&&state==='listen')listen()},400);
    };
    try{r.start()}
    catch(e){rec=null;setState('idle','Tidak bisa memulai mikrofon. Ketuk orb untuk coba lagi.')}
  };

  /* ---- Teks jawaban -> teks yang enak diucapkan ---- */
  const prep=t=>{
    let s=String(t||'');
    s=s.replace(/```[\s\S]*?```/g,' Kodenya ada di chat. ');
    try{if(typeof plain==='function')s=plain(s)}catch(e){}
    s=s.replace(/\[\/?c(?:=#?\w+)?\]/g,'')
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'$1')
      .replace(/https?:\/\/\S+/g,'')
      .replace(/[*_`#>~|]+/g,' ')
      .replace(/\p{Extended_Pictographic}/gu,'')
      .replace(/\s+/g,' ').trim();
    if(s.length>1200){
      const c=s.slice(0,1200),k=Math.max(c.lastIndexOf('. '),c.lastIndexOf('? '),c.lastIndexOf('! '));
      s=k>300?c.slice(0,k+1):c;
    }
    return s;
  };
  /* Dipotong per kalimat supaya suara iOS tidak berhenti di tengah kalimat panjang */
  const chunk=t=>{
    const parts=t.match(/[^.!?…\n]+[.!?…]*\s*/g)||[t];
    const out=[];let cur='';
    for(const p of parts){
      if(cur&&(cur+p).length>170){out.push(cur.trim());cur=p}else cur+=p;
    }
    if(cur.trim())out.push(cur.trim());
    return out;
  };
  const getVoice=()=>{try{return speechSynthesis.getVoices().find(v=>/^id[-_]/i.test(v.lang))||null}catch(e){return null}};
  const speak=(text,my)=>new Promise(res=>{
    const ss=window.speechSynthesis;
    if(!ss||!text||!SPK){res();return}
    const q=chunk(text);let i=0,done=false;
    const fin=()=>{if(!done){done=true;res()}};
    const next=()=>{
      if(!live||my!==sess||!SPK){try{ss.cancel()}catch(e){}fin();return}
      if(i>=q.length){fin();return}
      const part=q[i++];
      const u=new SpeechSynthesisUtterance(part);
      u.lang='id-ID';u.rate=1.05;
      const v=getVoice();if(v)u.voice=v;
      let fired=false,wd=0;
      const go=()=>{if(fired)return;fired=true;clearTimeout(wd);next()};
      u.onend=go;u.onerror=go;
      wd=setTimeout(go,Math.max(4000,part.length*120+3000)); /* jaga-jaga kalau onend tidak terpanggil */
      try{ss.speak(u)}catch(e){go()}
    };
    try{ss.cancel()}catch(e){}
    next();
  });

  /* ---- Kirim ke bot, tunggu jawaban, bacakan, lalu dengar lagi ---- */
  const handle=async text=>{
    const my=++sess;
    setState('think','');
    showTx(text,true);
    const txEl=$('#tx'),ms=$('#ms');
    if(!txEl||typeof window.send!=='function'){setState('idle','Chat belum siap. Ketuk orb untuk coba lagi.');return}
    try{ /* kalau bot sedang sibuk, tunggu sebentar supaya pesan tidak membatalkan balasan yang berjalan */
      let n=0;
      while(typeof busy!=='undefined'&&busy&&n<50&&live&&my===sess){await wait(200);n++}
      if(typeof busy!=='undefined'&&busy){setState('idle','Bot masih sibuk. Ketuk orb untuk coba lagi.');return}
    }catch(e){}
    if(!live||my!==sess)return;

    const before=ms?ms.querySelectorAll('.bm').length:0;
    txEl.value=text;
    txEl.dispatchEvent(new Event('input',{bubbles:true}));
    try{await window.send()}catch(e){}
    if(!live||my!==sess)return;

    const all=ms?ms.querySelectorAll('.bm'):[];
    const last=all.length>before?all[all.length-1]:null;
    const reply=last?prep(last.dataset.t||last.textContent||''):'';
    if(!reply){
      showTx('Bot belum bisa menjawab. Coba tanya lagi.',true);
      setState('think','');
      await wait(1500);
      if(live&&my===sess)listen();
      return;
    }

    await wait(150); /* beri waktu bila mode balasan suara bawaan sempat mulai, lalu ambil alih */
    if(!live||my!==sess)return;
    showTx(reply,false);
    setState('speak','');
    await speak(reply,my);
    if(!live||my!==sess)return;
    await wait(350);
    if(live&&my===sess)listen();
  };

  /* ---- Buka / tutup panggilan ---- */
  const begin=async()=>{
    live=true;window.XCALL=true;empties=0;svcRetry=0;
    try{elName.textContent=(cfg.bots[cur].name)||'XBOT'}catch(e){elName.textContent='XBOT'}
    elTime.textContent='Memanggil...';
    vbox.classList.add('on');
    showTx('Menyiapkan mikrofon…',true);
    setState('think','');
    /* buka kunci suara iOS lewat ketukan pengguna */
    try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}
    wake();
    const ok=await ensureMic();
    if(!live)return;
    if(!ok){elTime.textContent='Gagal terhubung';return}
    startTimer();
    await wait(250);
    if(!live)return;
    const hr=new Date().getHours(),waktu=hr>=4&&hr<11?'pagi':hr>=11&&hr<15?'siang':hr>=15&&hr<18?'sore':'malam';
    const namaBot=(cfg.bots[cur]&&cfg.bots[cur].name)||'aku';
    const sapa=[`Halo! Selamat ${waktu}. Ada yang bisa saya bantu?`,`Halo, selamat ${waktu}! Ini ${namaBot}. Ada yang bisa saya bantu?`,`Selamat ${waktu}! Akhirnya telponnya diangkat juga. Ada yang bisa saya bantu?`][Math.floor(Math.random()*3)];
    const mySess=sess;
    showTx(sapa,false);
    setState('speak','');
    await speak(sapa,mySess);
    if(!live||mySess!==sess)return;
    await wait(350);
    if(live)listen();
  };
  const end=()=>{
    live=false;window.XCALL=false;sess++;stopTimer();
    killRec();
    try{speechSynthesis.cancel()}catch(e){}
    vbox.classList.remove('on');
    setState('idle','');
    unwake();
  };

  elOrb.onclick=()=>{
    if(state==='listen'){ /* selesai bicara sekarang */
      if(rec){try{rec.stop()}catch(e){}}
    }else if(state==='speak'){ /* menyela bot */
      sess++;
      try{speechSynthesis.cancel()}catch(e){}
      listen();
    }else if(state==='idle'&&live){ /* lanjut setelah jeda atau error */
      empties=0;svcRetry=0;
      (async()=>{if(await ensureMic()&&live){startTimer();listen()}})();
    }
  };
  document.getElementById('xvb').onclick=begin;
  document.getElementById('xv-close').onclick=end;
  const elSpk=document.getElementById('xv-spk');
  const paintSpk=()=>{elSpk.textContent=SPK?'🔊':'🔈';elSpk.setAttribute('aria-label',SPK?'Speaker aktif':'Speaker mati')};
  elSpk.onclick=()=>{SPK=!SPK;paintSpk();if(!SPK){try{speechSynthesis.cancel()}catch(e){}}};
  paintSpk();

  /* Kalau aplikasi ke latar belakang, jeda dulu */
  document.addEventListener('visibilitychange',()=>{
    if(!live)return;
    if(document.hidden){
      sess++;killRec();
      try{speechSynthesis.cancel()}catch(e){}
      setState('idle','Dijeda. Ketuk orb untuk lanjut.');
    }else wake();
  });
}

// 6a. Cek CSV saat file dilampirkan -> tampilkan grafik
const fi=$('#fi');
if(fi){
  fi.addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];
    if(f&&f.name.toLowerCase().endsWith('.csv')){
      const r=new FileReader();
      r.onload=()=>{
        try{
          const lines=String(r.result).split('\n').map(l=>l.trim()).filter(Boolean);
          if(lines.length<3)return;
          const headers=lines[0].split(',').map(h=>h.trim().replace(/["']/g,''));
          const rows=lines.slice(1,10).map(l=>l.split(',').map(c=>c.trim().replace(/["']/g,'')));
          // Asumsi kolom pertama = label, kolom kedua = angka
          const data=rows.map(r=>[r[0],parseFloat(r[1])||0]).filter(x=>!isNaN(x[1]));
          if(data.length<2)return;
          const max=Math.max(...data.map(d=>d[1]));
          
          const chart=document.createElement('div');chart.className='xchart';
          chart.innerHTML=`<h5>📊 ${esc(f.name)} (Preview)</h5>`+data.map(d=>`
            <div class="xbar-row">
              <div class="xbar-label" title="${esc(d[0])}">${esc(d[0])}</div>
              <div class="xbar-track"><div class="xbar-fill" style="width:${(d[1]/max)*100}%"></div></div>
              <div class="xbar-val">${d[1]}</div>
            </div>`).join('');
          
          const ms=$('#ms');
          const div=document.createElement('div');
          div.className='bm';
          const inner=document.createElement('div');
          inner.className='bt';
          inner.appendChild(chart);
          div.appendChild(inner);

        }catch(e){}
      };
      r.readAsText(f);
    }
  },true);
}

// 6b. Ekstraksi jawaban AI ke file (Excel/Docx/CSV)
const origFetch2=window.fetch;
window.fetch=async function(input,init){
  const res=await origFetch2.apply(this,arguments);
  const url=typeof input==='string'?input:(input&&input.url)||'';
  if(!url.includes('/chat')||!res.body) return res;
  
  // Clone response untuk discan tanpa mengganggu stream asli
  const clone=res.clone();
  clone.text().then(text=>{
    // Cek apakah AI memberi instruksi ekspor (misal user: "ekspor ke excel")
    // Kita lihat di pesan user terakhir
    const lastUser=(window.hist||[]).filter(m=>m.role==='user').pop();
    if(!lastUser)return;
    const prompt=lastUser.content.toLowerCase();
    
    if(/ekspor|simpan|download|buat file/.test(prompt)){
      let fin=null;
      text.split('\n').forEach(l=>{if(!l.trim())return;try{const j=JSON.parse(l);if(!j.s&&j.text)fin=j}catch(e){}});
      if(!fin||!fin.text)return;
      
      // Bersihkan teks dari markdown berlebih untuk file
      const clean=fin.text.replace(/[*_`#]/g,'').trim();
      
      if(/excel|xlsx|csv/.test(prompt)){
        // Buat CSV (karena bikin XLSX di client butuh library besar, CSV lebih aman & cepat)
        const blob=new Blob(['\ufeff'+clean],{type:'text/csv;charset=utf-8'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Data_AI.csv';a.click();
        setTimeout(()=>toast('✓ File CSV diunduh'),500);
      }
      else if(/word|docx|doc/.test(prompt)){
        const html=`<html><head><meta charset="utf-8"></head><body><pre style="font-family:sans-serif;white-space:pre-wrap">${esc(clean)}</pre></body></html>`;
        const blob=new Blob([html],{type:'application/msword'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Dokumen_AI.doc';a.click();
        setTimeout(()=>toast('✓ File Word (.doc) diunduh'),500);
      }
    }
  }).catch(()=>{});
  
  return res;
};

})();

/* ---------- terminal virtual: shell mini di atas berkas pribadi bot (tanpa akses ke berkas pengguna) ---------- */
function putFile(i,n,t,tambah){
  const d=drive(i); n=cname(n); if(!n) throw new Error('nama berkas kosong');
  const v=(tambah&&d[n]?d[n].t:'')+t;

  if(!d[n]&&Object.keys(d).length>=30) throw new Error('komputer penuh (maks 30 berkas)');
  d[n]={t:v,ts:Date.now()};
}
const fnm=a=>cname(String(a==null?'':a).replace(/^(\.\/|~\/|\/home\/[^/]+\/)/,''));
function shTok(line){
  const T=[]; let cur='',has=false,q=null;
  const push=()=>{ if(has){ T.push({w:cur}); cur='';has=false } };
  for(let k=0;k<line.length;k++){
    const c=line[k];
    if(q){ if(c===q) q=null; else if(c==='\\'&&q==='"'&&k+1<line.length&&/["\\$`]/.test(line[k+1])) cur+=line[++k]; else cur+=c; continue }
    if(c==='"'||c==="'"){ q=c; has=true; continue }
    if(c===' '||c==='\t'||c==='\n'){ push(); continue }
    if(c==='|'){ push(); if(line[k+1]==='|'){ k++; T.push({op:'||'}) } else T.push({op:'|'}); continue }
    if(c==='&'&&line[k+1]==='&'){ push(); k++; T.push({op:'&&'}); continue }
    if(c===';'){ push(); T.push({op:';'}); continue }
    if(c==='>'){ push(); if(line[k+1]==='>'){ k++; T.push({op:'>>'}) } else T.push({op:'>'}); continue }
    cur+=c; has=true;
  }
  if(q) throw new Error('tanda kutip tidak ditutup');
  push(); return T;
}
const numArg=(a,def)=>{ const n=parseInt(a,10); return isNaN(n)?def:n };
async function shCmd(i,argv,stdin,ctxo){
  const d=drive(i),c=argv[0],a=argv.slice(1);
  const flags=a.filter(x=>/^-[a-zA-Z]+$/.test(x)).join('').replace(/-/g,''),rest=a.filter(x=>!/^-[a-zA-Z]+$/.test(x));
  const E=(m,code=1)=>({out:'',err:m,code});

  switch(c){
    case 'help': return O('Perintah: ls [-l], cat, echo, touch, rm, cp, mv, head, tail, wc, grep [-i -n -c -v], sort [-r -n -u], uniq [-c], cut -d X -f N, date, pwd, whoami, curl URL, node berkas.js (khusus bot koding). Pipa | dan > >> && ; didukung.\n');
    case 'pwd': return O('/home/'+nm(i).replace(/\s+/g,'_').toLowerCase()+'\n');
    case 'whoami': return O(nm(i)+'\n');
    case 'date': return O(new Date().toString()+'\n');
    case 'clear': return O('');
    case 'ls': { const k=Object.keys(d).sort(); if(flags.includes('l')) return O(k.map(n=>String(d[n].t.length).padStart(7)+' '+n).join('\n')+(k.length?'\n':'')); return O(k.join('\n')+(k.length?'\n':'')) }
    case 'echo': return O(rest.join(' ')+'\n');
    case 'cat': { if(!rest.length) return O(stdin||''); let o='',er=''; for(const n of rest){ const t=readF(n); if(t==null) er+='cat: '+n+': tidak ada berkas itu\n'; else o+=t+(t.endsWith('\n')?'':'\n') } return {out:o,err:er,code:er?1:0} }
    case 'touch': for(const n of rest){ if(!d[fnm(n)]) putFile(i,n,'',false) } return O('');
    case 'rm': { let er=''; for(const n of rest){ if(d[fnm(n)]) delete d[fnm(n)]; else if(!flags.includes('f')) er+='rm: '+n+': tidak ada berkas itu\n' } return {out:'',err:er,code:er?1:0} }
    case 'cp': case 'mv': { if(rest.length!==2) return E(c+': format: '+c+' asal tujuan'); const t=readF(rest[0]); if(t==null) return E(c+': '+rest[0]+': tidak ada berkas itu'); putFile(i,rest[1],t,false); if(c==='mv'&&fnm(rest[0])!==fnm(rest[1])) delete d[fnm(rest[0])]; return O('') }
    case 'head': case 'tail': { let n=10; const ni=a.indexOf('-n'),nj=a.findIndex(x=>/^-n\d+$/.test(x)); if(ni>=0) n=numArg(a[ni+1],10); else if(nj>=0) n=numArg(a[nj].slice(2),10); else { const m=a.find(x=>/^-\d+$/.test(x)); if(m) n=-parseInt(m,10) } const f=rest.filter(x=>!(ni>=0&&x===a[ni+1])&&!/^-\d+$/.test(x)&&!/^-n\d+$/.test(x))[0]; const t=f?readF(f):stdin; if(t==null) return E(c+': '+f+': tidak ada berkas itu'); const L=t.split('\n'); if(L[L.length-1]==='') L.pop(); return O((c==='head'?L.slice(0,n):L.slice(-n)).join('\n')+(L.length?'\n':'')) }
    case 'wc': { const f=rest[0],t=f?readF(f):stdin; if(t==null) return E('wc: '+f+': tidak ada berkas itu'); const l=t?t.split('\n').length-(t.endsWith('\n')?1:0):0,w=(t.trim()?t.trim().split(/\s+/).length:0),ch=t.length; const parts=[]; if(!flags||flags.includes('l')) parts.push(l); if(!flags||flags.includes('w')) parts.push(w); if(!flags||flags.includes('c')) parts.push(ch); return O(parts.join(' ')+(f?' '+f:'')+'\n') }
    case 'grep': { const pat=rest[0]; if(pat==null) return E('grep: pola kosong'); let re; try{ re=new RegExp(pat,flags.includes('i')?'i':'') }catch(e){ re=new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),flags.includes('i')?'i':'') } const files=rest.slice(1); const src=files.length?files.map(n=>[n,readF(n)]):[[null,stdin]]; let out='',cnt=0; for(const [n,t] of src){ if(t==null) return E('grep: '+n+': tidak ada berkas itu'); t.split('\n').forEach((ln,ix)=>{ if(ix===t.split('\n').length-1&&ln==='') return; const hit=re.test(ln); if(hit!==flags.includes('v')){ cnt++; out+=(files.length>1?n+':':'')+(flags.includes('n')?(ix+1)+':':'')+ln+'\n' } }) } return O(flags.includes('c')?cnt+'\n':out) }
    case 'sort': { const f=rest[0],t=f?readF(f):stdin; if(t==null) return E('sort: '+f+': tidak ada berkas itu'); let L=t.split('\n'); if(L[L.length-1]==='') L.pop(); L.sort(flags.includes('n')?(x,y)=>parseFloat(x)-parseFloat(y)||(x<y?-1:x>y?1:0):(x,y)=>x<y?-1:x>y?1:0); if(flags.includes('r')) L.reverse(); if(flags.includes('u')) L=L.filter((x,k)=>k===0||x!==L[k-1]); return O(L.join('\n')+(L.length?'\n':'')) }
    case 'uniq': { const f=rest[0],t=f?readF(f):stdin; if(t==null) return E('uniq: '+f+': tidak ada berkas itu'); const L=t.split('\n'); if(L[L.length-1]==='') L.pop(); const R=[]; for(const x of L){ if(R.length&&R[R.length-1][0]===x) R[R.length-1][1]++; else R.push([x,1]) } return O(R.map(r=>flags.includes('c')?String(r[1]).padStart(4)+' '+r[0]:r[0]).join('\n')+(R.length?'\n':'')) }
    case 'cut': { let dl='\t',fl='1',skip=new Set(); a.forEach((x,k)=>{ if(x==='-d'){ dl=a[k+1]==null?'\t':a[k+1]; skip.add(k);skip.add(k+1) } else if(/^-d.+/.test(x)){ dl=x.slice(2); skip.add(k) } else if(x==='-f'){ fl=a[k+1]||'1'; skip.add(k);skip.add(k+1) } else if(/^-f.+/.test(x)){ fl=x.slice(2); skip.add(k) } }); const fs=String(fl).split(',').map(x=>parseInt(x,10)-1); const f=a.filter((x,k)=>!skip.has(k))[0],t=f?readF(f):stdin; if(t==null) return E('cut: '+f+': tidak ada berkas itu'); const L=t.split('\n'); if(L[L.length-1]==='') L.pop(); return O(L.map(x=>{ const p=x.split(dl); return fs.map(k=>p[k]==null?'':p[k]).join(dl) }).join('\n')+(L.length?'\n':'')) }
    case 'curl': { const u=rest.find(x=>/^https?:/i.test(x)); if(!u) return E('curl: URL https belum diberikan'); stat(i,'mengambil data dari API',FX.api); try{ const r=await XTO.http_get({url:u}); return O(r.teks+(r.dipotong?'\n…(dipotong)':'')+'\n') }catch(e){ return E('curl: '+((e&&e.message)||e),6) } }
    case 'node': { if(!isKoding(i)) return E('node: hanya untuk bot koding'); const n=rest[0]; const t=n?readF(n):null; if(t==null) return E('node: '+n+': tidak ada berkas itu'); stat(i,'menjalankan kode di komputer',FX.kode); const o={}; for(const k in d) o[k]=d[k].t; const r=await XTO.code({lang:'js',code:'const DATA='+JSON.stringify(o)+';\n'+t}); let out=(r&&r.output?r.output+'\n':'')+(r&&r.hasil!==undefined?String(typeof r.hasil==='string'?r.hasil:JSON.stringify(r.hasil))+'\n':''); if(r&&r.error) return {out,err:'node: '+r.error+'\n',code:1}; return O(out) }
    case 'python': case 'python3': case 'pip': case 'npm': case 'sudo': return E(c+': tidak tersedia di komputer ini (gunakan node untuk menjalankan kode)',127);
    default: return E(c+': perintah tidak dikenal (ketik help)',127);
  }
}
async function shRun(i,line){
  const T=shTok(String(line||'')); if(!T.length) return {keluaran:'',kode:0};
  let seq=[[]]; for(const t of T){ if(t.op===';'||t.op==='&&'||t.op==='||'){ seq.push(t.op); seq.push([]) } else seq[seq.length-1].push(t) }
  let out='',lastCode=0,n=0;
  for(let k=0;k<seq.length;k+=2){
    const op=k>0?seq[k-1]:';'; if(op==='&&'&&lastCode!==0) continue; if(op==='||'&&lastCode===0) continue;
    const pipe=[[]]; for(const t of seq[k]){ if(t.op==='|') pipe.push([]); else pipe[pipe.length-1].push(t) }
    let stdin='',res={out:'',err:'',code:0},redir=null;
    for(const seg of pipe){
      const argv=[]; let rd=null;
      for(let x=0;x<seg.length;x++){ const t=seg[x]; if(t.op==='>'||t.op==='>>'){ const nx=seg[x+1]; if(!nx||nx.op) throw new Error('nama berkas tujuan hilang setelah '+t.op); rd={m:t.op,f:nx.w}; x++ } else if(t.op) throw new Error('sintaks tidak dikenal: '+t.op); else argv.push(t.w) }
      if(!argv.length) continue;
      if(++n>10) throw new Error('maksimal 10 perintah per panggilan');
      res=await shCmd(i,argv,stdin,{}); stdin=res.out; redir=rd;
      if(res.err) out+=res.err+(res.err.endsWith('\n')?'':'\n');
    }
    if(redir){ putFile(i,redir.f,res.out,redir.m==='>>'); res.out='' }
    out+=res.out; lastCode=res.code;
  }
  out=out.length>4000?out.slice(0,4000)+'\n…(keluaran dipotong)':out;
  return {keluaran:out,kode:lastCode};
}

  XTO.kirim=async({nama})=>{
    const i=curBot(),d=drive(i),n=cname(nama);
    if(!d[n]) throw new Error('Berkas "'+nama+'" tidak ada di komputermu');
    const f=A.addFile(n,d[n].t,i);
    A.push(A.mkMsg(i,-1,'',{files:[f],k:'berkas'}));
    return {ok:true,dibagikan:f.name};
  };
  XTO.http_get=async({url})=>{
    url=String(url||'').trim();
    let u; try{ u=new URL(url) }catch(e){ throw new Error('URL tidak valid') }
    if(u.protocol!=='https:') throw new Error('Hanya https yang diizinkan');
    if(/^(localhost|127\.|10\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.|0\.|\[)/i.test(u.hostname)||!u.hostname.includes('.')) throw new Error('Alamat lokal tidak diizinkan');
    const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);
    try{
      const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status);
      const t=await r.text();
      return {url,teks:t.slice(0,4000),dipotong:t.length>4000};
    }catch(e){ throw new Error(e&&e.name==='AbortError'?'Waktu habis (8 detik)':'Gagal mengambil (mungkin diblokir CORS): '+((e&&e.message)||e)) }
    finally{ clearTimeout(to) }
  };
  XTO.terminal=async({cmd})=>{
    const i=curBot(); cmd=String(cmd||'').trim(); if(!cmd) throw new Error('Perintah kosong');
    if(cmd.length>1500) throw new Error('Perintah terlalu panjang');
    stat(i,'mengetik di terminal: '+clip(cmd,34),FX.ketik);
    try{ return await shRun(i,cmd) }catch(e){ return {keluaran:'',kode:2,error:(e&&e.message)||String(e)} }
  };
  /* batasi alat code: hanya bot koding yang boleh memakainya di panel/Ruang Bot */
  const runLama=XTO.run;
  XTO.run=function(name,args){
    if(name==='code'&&BS.on&&CTX.length&&!isKoding(CTX[CTX.length-1])) return Promise.reject(new Error('Alat code hanya untuk bot koding'));
    if(name==='code'&&BS.on&&CTX.length&&args&&/\bDATA\b/.test(String(args.code||''))){
      const d=drive(CTX[CTX.length-1]),o={}; for(const k in d) o[k]=d[k].t;
      args=Object.assign({},args,{code:'const DATA='+JSON.stringify(o)+';\n'+args.code});
    }
    if(!(BS.on&&CTX.length)) return runLama.call(this,name,args);
    const bi=CTX[CTX.length-1];
    return withStatus(bi,name,()=>runLama.call(this,name,args));
  };
}

/* ---------- 4. antrean tugas antar-bot ---------- */
const TASKQ=[]; let TID=0, CUR=null;
const aktif=()=>TASKQ.filter(t=>t.st==='pending'||t.st==='kerja');
function bersih(){
  const n=Date.now();
  for(const t of TASKQ){ if(t.st==='pending'&&n-t.ts>600000){ t.st='gagal'; t.ts=n } }
  for(let j=TASKQ.length-1;j>=0;j--){ const t=TASKQ[j]; if((t.st==='selesai'||t.st==='gagal')&&n-t.ts>180000) TASKQ.splice(j,1) }
}
function taskAdd(dari,ke,judul,detail,depth){
  bersih();
  if(depth>2||aktif().length>=3) return null;
  judul=clip(judul,100); if(!judul) return null;
  if(TASKQ.some(t=>t.ke===ke&&t.judul===judul&&(t.st==='pending'||t.st==='kerja'))) return null;
  const t={id:'t'+(++TID),dari,ke,judul,detail:clip(detail,400),depth,st:'pending',ts:Date.now()};
  TASKQ.push(t); refreshUI(); return t;
}
function ambilMinta(i,text){
  const re=/\[minta:\s*@?([^|\]\n]+?)\s*\|\s*([^|\]\n]+?)\s*(?:\|\s*([^\]\n]*))?\]/gi;
  let m,n=0;
  while((m=re.exec(text))&&n<2){
    const q=m[1].trim().toLowerCase();
    const ke=ids().find(k=>nm(k).toLowerCase()===q||nm(k).replace(/^Bot\s+/i,'').toLowerCase()===q);
    if(ke!=null&&ke!==i){ if(taskAdd(i,ke,m[2],m[3]||'',(CUR&&CUR.ke===i)?CUR.depth+1:0)) n++ }
  }
  return text.replace(/\[minta:[^\]]*\]/gi,'').replace(/\[minta:[^\]]*$/i,'').replace(/\[status:[^\]\n]*\]/gi,'').replace(/[ \t]+\n/g,'\n').trim();
}
const tugasTx=()=>`\n\n${MARK_TUGAS} @${nm(CUR.dari)} memintamu: "${CUR.judul}". Detail: ${CUR.detail||'-'}.\nInstruksi ini MENGGANTIKAN [Tugas] di atas: kerjakan permintaan itu sekarang, beri hasil nyata dan spesifik (bukan basa-basi), dan awali dengan @${nm(CUR.dari)}. Jangan membuat permintaan [minta:] lagi.`;

/* call: bersihkan tag [minta:]/[status:], tandai hasil tugas, naikkan mode tugas */
const callLama=A.get.call();
A.set.call(async function(i,o){
  let o2=o;
  const tugas=!!(BS.on&&o&&typeof o.sys==='string'&&o.sys.includes(MARK_TUGAS));
  if(tugas&&o.mode==='off') o2=Object.assign({},o,{mode:'auto',to:Math.max(o.to||0,30000)});
  const bs=!!(BS.on&&o&&typeof o.sys==='string'&&o.sys.includes(MARK));
  if(bs&&isKoding(i)) o2=Object.assign({},o2,{to:Math.max(o2.to||0,30000)});
  if(bs) CTX.push(i);
  let r; try{ r=await callLama.call(this,i,o2) } finally { if(bs){ CTX.pop(); statEnd(i) } }
  try{
    if(BS.on&&o&&typeof o.sys==='string'&&o.sys.includes(MARK)){
      if(r&&typeof r.text==='string') r.text=ambilMinta(i,r.text);
      if(tugas&&CUR&&CUR.ke===i){
        if(r&&r.text){ CUR.st='selesai'; CUR.hasil=clip(plain(r.text),200) }
        else if(CUR.st!=='selesai'){ CUR.st='gagal' }
      }
    }
  }catch(e){}
  return r;
});

/* plan: jalankan tugas antar-bot hanya bila pengguna tidak sedang menunggu jawaban */
const planLama=A.get.plan();
A.set.plan(function(){
  if(BS.on){
    try{
      const s=A.st(), n=Date.now();
      if(CUR&&(CUR.st==='gagal'||n-CUR.ts>120000)){ if(CUR.st==='kerja') CUR.st='gagal'; CUR=null }
      else if(CUR&&CUR.st==='selesai'&&n-CUR.ts>30000){ CUR=null }
      bersih();
      if(!s.UQ&&!s.FORCESUM&&s.GR<=0){
        if(CUR&&CUR.st==='kerja'&&ids().includes(CUR.ke)) return {f:CUR.ke,t:CUR.dari,intent:'kerja'};
        if(!CUR){
          const av=A.avail();
          const t=TASKQ.find(x=>x.st==='pending'&&ids().includes(x.ke)&&av.includes(x.ke)&&ids().includes(x.dari));
          if(t){ t.st='kerja'; t.ts=n; CUR=t; refreshUI(); return {f:t.ke,t:t.dari,intent:'kerja'} }
        }
      }
    }catch(e){}
  }
  return planLama.apply(this,arguments);
});

/* ---------- 6. masukan kolektif: tiap bot memberi poin, satu bot merangkum ---------- */
async function laporanKolektif(q){
  let w=0; while((A.st().busy||A.st().TASK)&&w<20000){ await wait(500); w+=500 }
  const g=A.lock();
  if(g<0){ A.sysNote('Para bot sedang sibuk. Coba kirim lagi sebentar.'); return }
  const I=A.avail().filter(i=>ids().includes(i)).slice(0,6);
  const hasil=[];
  try{
    for(const i of I){
      if(g!==A.st().gen) return;
      A.setS(i,'menganalisis');
      const r=await A.get.call()(i,{sys:A.get.sysA()(i,-1,'user')+'\n\n[Tugas Kolektif] Beri 1 poin masukan (maks 120 karakter) dan 1 solusi konkret (maks 120 karakter) untuk pertanyaan pengguna. Tulis langsung, tanpa basa-basi.',user:'Pertanyaan pengguna: '+q,mode:'off',to:20000});
      A.clr(i);
      if(r&&r.text) hasil.push({i,t:clip(plain(r.text),240)});
    }
    if(g!==A.st().gen) return;
    if(!hasil.length){ A.sysNote('Para bot belum bisa memberi masukan sekarang. Coba lagi nanti.'); return }
    const judge=I.find(i=>cfg.role&&cfg.role[i]==='rangkum')??I[0];
    A.setS(judge,'menimbang kesimpulan');
    const r=await A.get.call()(judge,{sys:A.get.sysA()(judge,-1,'user')+'\n\n[Rangkuman kolektif] Rangkum masukan semua bot jadi 3-5 poin solusi paling tepat, ringkas dan siap pakai, maks 600 karakter.',user:'Pertanyaan: '+q+'\n\nMasukan bot:\n'+hasil.map(h=>nm(h.i)+': '+h.t).join('\n'),mode:'off',to:25000});
    A.clr(judge);
    if(g!==A.st().gen) return;
    const out=r&&r.text?String(r.text).trim().slice(0,900):'';
    if(!out){ A.sysNote('Rangkuman belum berhasil dibuat. Coba lagi nanti.'); return }
    await A.show(judge,A.mkMsg(judge,-1,out,{k:'rangkuman',tag:'RANGKUMAN KOLEKTIF'}),g);
  }catch(e){
  }finally{
    I.forEach(i=>{ try{ A.clr(i) }catch(e){} });
    A.unlock(g);
  }
}
