/* pengolah data: membaca CSV/teks tabel dari komputer pribadi atau ruang kerja, tanpa menulis kode */
function parseCsv(t){
  t=String(t||'').replace(/^\uFEFF/,'');
  const first=t.split(/\r?\n/)[0]||'';
  const d=first.split(';').length>first.split(',').length?';':(first.split('\t').length>first.split(',').length?'\t':',');
  const rows=[]; let row=[],cur='',q=false;
  for(let k=0;k<t.length;k++){
    const c=t[k];
    if(q){ if(c==='"'){ if(t[k+1]==='"'){cur+='"';k++} else q=false } else cur+=c; continue }
    if(c==='"'){q=true;continue}
    if(c===d){row.push(cur);cur='';continue}
    if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';continue}
    if(c==='\r')continue;
    cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  const H=(rows.shift()||[]).map(h=>h.trim());
  const R=rows.filter(r=>r.some(x=>String(x).trim()!==''));
  return {d,kolom:H,baris:R};
}
function angka(s){
  let v=String(s==null?'':s).trim().replace(/\s/g,'');
  if(!v)return null;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)) v=v.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)) v=v.replace(/,/g,'');
  else if(/^-?\d+,\d+$/.test(v)) v=v.replace(',','.');
  else if(v.endsWith('%')) v=v.slice(0,-1);
  const n=Number(v); return Number.isFinite(n)?n:null;
}
function cariBerkas(nama){
  const q=String(nama||'').trim().toLowerCase(); if(!q)return null;
  const sumber=[];
  if(CTX.length){const d=drive(CTX[CTX.length-1]);Object.keys(d).forEach(k=>sumber.push({nama:k,teks:d[k].t,asal:'komputer pribadimu'}))}
  Object.keys(RUANG).forEach(k=>sumber.push({nama:k,teks:RUANG[k].t,asal:'ruang kerja'}));
  return sumber.find(x=>x.nama.toLowerCase()===q)||sumber.find(x=>x.nama.toLowerCase().includes(q))||null;
}
const cariErr=n=>new Error('Berkas "'+n+'" tidak ditemukan. Yang ada: '+(listNama().join(', ')||'(kosong)'));
XTO.ringkas_csv=async({nama})=>{
  const f=cariBerkas(nama); if(!f) throw cariErr(nama);
  const {d,kolom,baris}=parseCsv(f.teks);
  const info=kolom.map((h,j)=>{
    const isi=baris.map(r=>String(r[j]??'').trim()).filter(x=>x!=='');
    const ang=isi.map(angka).filter(x=>x!==null);
    const tipe=ang.length>=Math.max(1,isi.length*0.8)?'angka':'teks';
    const o={nama:h||('kolom'+(j+1)),tipe,terisi:isi.length,contoh:[...new Set(isi)].slice(0,3)};
    if(tipe==='angka'&&ang.length){const jm=ang.reduce((a,b)=>a+b,0);o.jumlah=+jm.toFixed(2);o.rata2=+(jm/ang.length).toFixed(2);o.min=Math.min(...ang);o.maks=Math.max(...ang)}
    return o;
  });
  return {berkas:f.nama,asal:f.asal,pemisah:d===','?'koma':d===';'?'titik koma':'tab',jumlah_baris:baris.length,kolom:info,contoh_baris:baris.slice(0,3)};
};
XTO.agregat=async({nama,kolom,fungsi='sum',kelompok,filter,urut='turun',batas=20})=>{
  const f=cariBerkas(nama); if(!f) throw cariErr(nama);
  const {kolom:H,baris}=parseCsv(f.teks);
  const idx=h=>{const q=String(h||'').trim().toLowerCase();const j=H.findIndex(x=>x.trim().toLowerCase()===q);if(j<0)throw new Error('Kolom "'+h+'" tidak ada. Kolom yang ada: '+H.join(', '));return j};
  const fn=String(fungsi||'sum').toLowerCase();
  if(!['sum','count','avg','min','max','distinct'].includes(fn)) throw new Error('fungsi harus sum, count, avg, min, max, atau distinct');
  const jk=kelompok?idx(kelompok):-1, jv=kolom?idx(kolom):-1;
  let R=baris;
  if(filter&&filter.kolom){
    const jf=idx(filter.kolom),nilai=String(filter.nilai==null?'':filter.nilai).trim().toLowerCase(),jn=String(filter.jenis||'sama').toLowerCase();
    R=R.filter(r=>{
      const x=String(r[jf]??'').trim().toLowerCase(), xn=angka(x), vn=angka(nilai);
      if(jn==='mengandung') return x.includes(nilai);
      if(jn==='lebih') return xn!==null&&vn!==null&&xn>vn;
      if(jn==='kurang') return xn!==null&&vn!==null&&xn<vn;
      return x===nilai;
    });
  }
  const grup=new Map();
  for(const r of R){const key=jk>=0?(String(r[jk]??'').trim()||'(kosong)'):'(semua)';if(!grup.has(key))grup.set(key,[]);grup.get(key).push(r)}
  const out=[];
  for(const [key,rs] of grup){
    let hasil=null;
    if(fn==='count') hasil=rs.length;
    else if(jv<0) throw new Error('isi "kolom" untuk fungsi '+fn);
    else if(fn==='distinct') hasil=new Set(rs.map(r=>String(r[jv]??'').trim()).filter(Boolean)).size;
    else{
      const v=rs.map(r=>angka(r[jv])).filter(x=>x!==null);
      if(v.length){
        if(fn==='sum') hasil=v.reduce((a,b)=>a+b,0);
        else if(fn==='avg') hasil=v.reduce((a,b)=>a+b,0)/v.length;
        else if(fn==='min') hasil=Math.min(...v);
        else hasil=Math.max(...v);
      }
    }
    out.push({kelompok:key,nilai:typeof hasil==='number'?+hasil.toFixed(2):hasil,baris:rs.length});
  }
  const bobot=x=>x.nilai==null?(urut==='naik'?Infinity:-Infinity):x.nilai;
  out.sort((a,b)=>urut==='naik'?bobot(a)-bobot(b):bobot(b)-bobot(a));
  return {berkas:f.nama,asal:f.asal,fungsi:fn,kolom:kolom||'(jumlah baris)',kelompok:kelompok||null,baris_terpakai:R.length,jumlah_kelompok:out.length,hasil:out.slice(0,Math.min(50,Math.max(1,parseInt(batas)||20)))};
};

/* antrean tugas panjang: bot memecah pekerjaan jadi langkah; langkah dikerjakan bergiliran saat pengguna tidak sedang meminta sesuatu */
let ANT=[]; try{ ANT=JSON.parse(localStorage.getItem(ANK)||'[]')||[] }catch(e){ ANT=[] }
const saveAnt=()=>{ try{ localStorage.setItem(ANK,JSON.stringify(ANT.slice(-10))) }catch(e){} };
let ANTCUR=null;
XTO.antrean_tambah=async({judul,langkah})=>{
  const i=CTX.length?CTX[CTX.length-1]:-1;
  const L=(Array.isArray(langkah)?langkah:[]).map(x=>String(x==null?'':x).trim().slice(0,200)).filter(Boolean).slice(0,12);
  if(L.length<2) throw new Error('tugas panjang perlu minimal 2 langkah');
  if(ANT.filter(j=>j.status==='jalan').length>=5) throw new Error('antrean penuh (maks 5 tugas berjalan)');
  const id='t'+Date.now().toString(36);
  const job={id,judul:String(judul||'Tugas').slice(0,80),bot:i,langkah:L,i:0,hasil:[],status:'jalan',coba:0,ts:Date.now()};
  ANT.push(job); saveAnt();
  rkWrite('tugas-'+id+'.md','# '+job.judul+'\n'+L.map((x,k)=>(k+1)+'. '+x).join('\n')+'\n',false,kerjaOleh());
  return {ok:true,id,judul:job.judul,langkah:L.length,berkas_hasil:'tugas-'+id+'.md',catatan:'Dikerjakan bergiliran di ruang bot. Hasil tiap langkah dicatat di berkas hasil.'};
};
XTO.antrean_daftar=async()=>({tugas:ANT.slice(-10).map(j=>({id:j.id,judul:j.judul,status:j.status,langkah_selesai:j.i+'/'+j.langkah.length,dibuat_oleh:j.bot>=0?nm(j.bot):'pengguna'}))});

window.__ANTREAN={
  next(I){
    const job=ANT.find(j=>j.status==='jalan'); if(!job||!I.length) return null;
    job.coba++;
    if(job.coba>4){ job.status='gagal'; saveAnt(); sysNoteAman('⚠️ Tugas "'+job.judul+'" dihentikan karena belum ada kemajuan.'); return null }
    saveAnt();
    const f=I.includes(job.bot)?job.bot:pickAcak(I);
    ANTCUR={job,f};
    return {f,t:-1,intent:'lanjut'};
  },
  tugasTx(){
    if(!ANTCUR) return '';
    const {job}=ANTCUR, k=job.i;
    const prev=job.hasil.slice(-2).map(h=>'- '+h.langkah+': '+h.teks).join('\n');
    return '\n\n[Tugas panjang] Kamu sedang mengerjakan tugas "'+job.judul+'", langkah '+(k+1)+' dari '+job.langkah.length+'. Kerjakan HANYA langkah ini: "'+job.langkah[k]+'".'+(prev?'\nHasil langkah sebelumnya:\n'+prev:'')+'\nBeri hasil konkret dan spesifik untuk langkah ini (bukan rencana). Singkat, tanpa basa-basi. Kalau perlu, simpan hasil ke ruang kerja dengan ruang_tulis.';
  },
  done(f,m){
    if(!ANTCUR) return;
    const {job}=ANTCUR; ANTCUR=null;
    const teks=plainTeks(m.full||'').slice(0,600);
    const langkah=job.langkah[job.i];
    job.hasil.push({langkah,teks,oleh:nm(f)}); job.i++; job.coba=0;
    try{ rkWrite('tugas-'+job.id+'.md','\n## '+job.i+'. '+langkah+'\n'+teks+'\n(dikerjakan '+nm(f)+')\n',true,nm(f)) }catch(e){}
    if(job.i>=job.langkah.length){ job.status='selesai'; sysNoteAman('✅ Tugas "'+job.judul+'" selesai. Hasil lengkap ada di ruang kerja: tugas-'+job.id+'.md') }
    saveAnt();
  }
};

/* ---------- 7. tampilan: bar status & daftar tugas di Ruang Bot ---------- */
function refreshUI(){
  try{
    const rs=document.getElementById('rs'); if(!rs) return;
    const rh=rs.querySelector('.rh'); if(!rh) return;
    let bar=document.getElementById('bs-bar');
    if(!bar){
      bar=document.createElement('div'); bar.id='bs-bar';
      bar.innerHTML='<span class="bs-chip"><i class="bs-dot" aria-label="Bot Smart aktif"></i></span><span class="bs-chip" id="bs-tugas" hidden></span>';
      rh.after(bar);
    }
    let w=document.getElementById('bs-tasks');
    if(!w){ w=document.createElement('div'); w.id='bs-tasks'; bar.after(w) }
    bar.classList.toggle('on',BS.on);
    const L=aktif().slice(0,4);
    w.classList.toggle('on',BS.on&&L.length>0);
    const tj=document.getElementById('bs-tugas'); tj.hidden=!aktif().length; if(aktif().length) tj.textContent='📋 '+aktif().length+' tugas';
    w.innerHTML=L.map(t=>`<div class="bs-t" data-st="${t.st}"><span class="bs-ic">${t.st==='kerja'?'⏳':'📋'}</span><div class="bs-tx2"><b>${esc(t.judul)}</b><span>${t.st==='kerja'?'dikerjakan '+esc(nm(t.ke)):'menunggu '+esc(nm(t.ke))} · dari ${esc(nm(t.dari))}</span></div></div>`).join('');
  }catch(e){}
}

/* ---------- 8. tombol di Pengaturan ---------- */
function pasangTombol(){
  const sm=document.getElementById('sm');
  if(!sm||sm.hidden||sm.querySelector('#bsmart-wrap')) return;
  const d=document.createElement('div'); d.id='bsmart-wrap';
  d.innerHTML=`<div class="bs-tx"><b>Bot Smart</b><span>Menambah kecerdasan para bot di panel dan Ruang Bot: gaya jawab menyesuaikan pertanyaan, keahlian tool per peran, catatan kerja, saling minta bantuan antar-bot, dan masukan kolektif (ketik: "semua bot kasih masukan ...").</span></div><button id="bsmart-btn" type="button" aria-label="Bot Smart" aria-pressed="${BS.on?'true':'false'}" class="${BS.on?'on':''}"></button>`;
  sm.appendChild(d);
  const cw=document.createElement('div'); cw.id='bscomp-wrap';
  const draw=()=>{
    const rows=ids().map(i=>{ const dd=COMP[i]||{},n=Object.keys(dd).length,sz=Object.values(dd).reduce((a,b)=>a+b.t.length,0); return `<div class="bc-r"><span>${esc(nm(i))}</span><i>${n} berkas · ${(sz/1024).toFixed(1)} KB</i></div>` }).join('');
    cw.innerHTML=`<b>Komputer pribadi bot</b><span>Tiap bot punya penyimpanan berkas sendiri. Isinya tersimpan di browser ini.</span>${rows}<button id="bscomp-clr" type="button">Kosongkan semua komputer bot</button>`;
    cw.querySelector('#bscomp-clr').onclick=()=>{ if(!confirm('Hapus semua berkas pribadi dan catatan kerja bot?')) return; for(const k of Object.keys(COMP)) delete COMP[k]; for(const k of Object.keys(WS)) delete WS[k]; try{ localStorage.setItem(CK,'{}') }catch(e){} saveWS(); draw() };
  };
  draw(); sm.appendChild(cw);
  const btn=d.querySelector('#bsmart-btn');
  btn.onclick=()=>{
    BS.on=!BS.on; saveBS();
    btn.classList.toggle('on',BS.on); btn.setAttribute('aria-pressed',BS.on?'true':'false');
    if(!BS.on){ CUR=null; TASKQ.length=0 }
    refreshUI();
  };
}
const smEl=document.getElementById('sm');
if(smEl) new MutationObserver(pasangTombol).observe(smEl,{attributes:true,attributeFilter:['hidden']});
setTimeout(pasangTombol,800);
refreshUI();
window.__BS={BS,TASKQ,WS,taskAdd,laporanKolektif};
})();
