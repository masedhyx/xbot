<script>
/* daftar model */
const DEF_MODEL='gemini:gemini-3.8-flash',DEF_IMG='gemini-3.1-flash-image';
const FALLBACK_MODELS=[{id:'gemini:gemini-3.8-flash',label:'gemini-3.8-flash'},{id:'gemini:gemini-3.6-flash',label:'gemini-3.6-flash'},{id:'gemini:gemini-3.5-flash-lite',label:'gemini-3.5-flash-lite'},{id:'gemini:gemini-3.1-flash-lite',label:'gemini-3.1-flash-lite'},{id:'gemini:gemini-2.5-flash',label:'gemini-2.5-flash'},{id:'gemini:gemini-2.5-flash-lite',label:'gemini-2.5-flash-lite'},{id:'groq:openai/gpt-oss-120b',label:'GPT-OSS 120B — paling kuat'},{id:'groq:openai/gpt-oss-20b',label:'GPT-OSS 20B — lebih ringan & cepat'},{id:'groq:qwen/qwen3.8-27b',label:'Qwen 3.8 27B — penalaran & umum'}];
const FALLBACK_IMG=[{id:'gemini-3.1-flash-image',label:'gemini-3.1-flash-image'}];
const SERVER_URL='https://xbot.edhymaster70.workers.dev';
const PW_HASH='42d5eaa7af283ddcd8f11ce357934a5ec7aa4e21f37c029a2ee047ab889d2ae9';
const COL=['#ff1a1a','#0066ff','#a6ff00','#9b30ff','#ffe000','#3a3a38','#ff2d92','#cf7a30','#00e0d0','#00c853','#ffffff'];
const TC=i=>COL[i]==='#3a3a38'?'#9a9aa0':COL[i];/* warna teks bot gelap dibuat terbaca */
const NM=['Merah','Biru','Hijau Stabilo','Ungu','Kuning','Hitam','Pink','Coklat','Tosca','Hijau'];
const TRAIT=['ramah dan santai','tegas dan to the point','tenang dan analitis','ceria dan penuh semangat','lucu dan suka bercanda','bijak dan sabar','manis dan perhatian','santai ala anak tongkrongan','detail dan teliti','serius dan profesional'];
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const CMAP={merah:'#ff5a5a',red:'#ff5a5a',hijau:'#3ddc84',green:'#3ddc84',biru:'#4da3ff',blue:'#4da3ff',kuning:'#ffd60a',yellow:'#ffd60a',oranye:'#ff9f0a',orange:'#ff9f0a',ungu:'#bf5af2',purple:'#bf5af2',pink:'#ff6bb5',tosca:'#2ee6d6',coklat:'#d2915a',abu:'#aaa',putih:'#fff'};
const cv=n=>{n=n.toLowerCase();return CMAP[n]||(/^#[0-9a-f]{3,8}$/i.test(n)?n:null)};
const col=s=>s.replace(/\[c=(#?\w+)\]([\s\S]*?)\[\/c\]/g,(m,n,t)=>cv(n)?`<span style="color:${cv(n)}">${t}</span>`:t).replace(/\[c=(#?\w+)\]([\s\S]*)$/,(m,n,t)=>cv(n)?`<span style="color:${cv(n)}">${t}</span>`:m);
const md0=(s,p)=>col(esc(p?s.replace(/\[\/?c?=?#?\w*$/,''):s)).replace(/```(?:\w*\n)?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');

/* ===== MARKDOWN TAMBAHAN: tabel, judul, garis, diagram; sembunyikan "Sumber: [n]" ===== */
const CIT=(t,p)=>{t=t.replace(/^[ \t]*[*_]*[ \t]*Sumber[ \t]*:?[ \t]*(?:\[\d+(?:[ \t]*,[ \t]*\d+)*\][ \t,;]*)+[*_]*[ \t]*$/gmi,'').replace(/[ \t]?\[\d+(?:[ \t]*,[ \t]*\d+)*\](?!\()/g,'');
  if(p)t=t.replace(/(^|\n)[ \t]*[*_]*Sumber[ \t]*:?[ \t]*\[?[\d, \t\]\[]*[*_]*$/i,'$1').replace(/[ \t]?\[\d*(?:[ \t]*,[ \t]*\d*)*$/,'');
  return t.replace(/\n{3,}/g,'\n\n')};
const CITS=t=>t.split(/(```[\s\S]*?(?:```|$))/g).map((x,i)=>i%2?x:CIT(x)).join('');
const inl=t=>col(esc(t)).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const SO='<svg class="so" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>';
const XP='<button class="tbx" aria-label="Perbesar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>';
const blocks=(txt,T)=>{const L=txt.split('\n'),o=[];
  const isRow=l=>/^\s*\|/.test(l),cells=l=>l.trim().replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(x=>x.trim()),
  isSep=l=>/^[\s:|-]+$/.test(l)&&l.includes('-')&&l.includes('|');
  for(let i=0;i<L.length;i++){const l=L[i];
    if(isRow(l)&&i+1<L.length&&isSep(L[i+1])){
      const hd=cells(l),al=cells(L[i+1]).map(c=>/^:-*:$/.test(c)?'center':/-:$/.test(c)?'right':'left');let j=i+2;const rows=[];
      while(j<L.length&&isRow(L[j])){rows.push(cells(L[j]));j++}
      const th=hd.map((c,k)=>`<th style="text-align:${al[k]||'left'}">${inl(c)}${SO}</th>`).join(''),
      tr=rows.map(r=>'<tr>'+hd.map((_,k)=>`<td style="text-align:${al[k]||'left'}">${inl(r[k]||'')}</td>`).join('')+'</tr>').join('');
      o.push(T(`<div class="tbc"><div class="tbw"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>${XP}</div>`));i=j-1;continue}
    if(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l)){o.push(T('<hr class="mh">'));continue}
    const h=l.match(/^\s{0,3}#{1,6}\s+(.+?)\s*#*\s*$/);if(h){o.push(T('<b class="mhd">'+inl(h[1])+'</b>'));continue}
    o.push(l)}
  return o.join('\n')};
const DGR=/^```(?:diagram|mermaid|flowchart)[ \t]*\n([\s\S]*?)(\n?```)?$/i;
const md=(s,p)=>{const TB=[],T=h=>{TB.push(h);return '\u0001'+(TB.length-1)+'\u0002'};
  const PR=s.split(/(```[\s\S]*?(?:```|$))/g);s=PR.map((x,i)=>{
    if(i%2){const m=x.match(DGR);if(m)return T(m[2]?`<div class="dg" data-src="${encodeURIComponent(m[1])}"><div class="dgp">Membuat diagram…</div></div>`:'<div class="dg"><div class="dgp">Membuat diagram…</div></div>');return x}
    return blocks(CIT(x,p&&i===PR.length-1),T)}).join('');
  return md0(s,p).replace(/(?:<br>)?\u0001(\d+)\u0002(?:<br>)?/g,(m,n)=>TB[n])};
let BID=0;
const bot=c=>{const k="k"+(++BID);return `<svg${c==='#3a3a38'?' style="--ey:#fff"':''} viewBox="114.4 21.35 411.4 411.4"><clipPath id="${k}"><circle class="cc" cx="320.1" cy="227.05" r="205.7"/></clipPath><circle class="bd" cx="320.1" cy="227.05" r="205.7" fill="${c}"/><g clip-path="url(#${k})"><path class="e"/><path class="e"/></g></svg>`};
let cfg;try{cfg=JSON.parse(localStorage.getItem('xbot'))}catch{}
cfg=Object.assign({url:SERVER_URL,keys:{},model:DEF_MODEL,img:DEF_IMG,mode:'auto',bots:NM.map((n,i)=>({name:'Bot '+n,prompt:`Kamu asisten AI yang ${TRAIT[i]}. Jawab dalam bahasa Indonesia.`}))},cfg||{});cfg.url=SERVER_URL;
cfg.panel=Object.assign({on:true,keys:{gemini:'',groq:''},model:'',gap:'4.5-8',max:0},cfg.panel||{});cfg.panel.keys=Object.assign({gemini:'',groq:''},cfg.panel.keys);
if(cfg.bots[5]&&/^bot orange$/i.test(cfg.bots[5].name))cfg.bots[5].name='Bot Hitam';
if(!cfg.bots[10])cfg.bots[10]={name:'edhyx',prompt:'Kamu edhyx, asisten AI yang cerdas, ramah, dan santai. Jawab dalam bahasa Indonesia dengan jelas dan membantu.'};
const save=()=>{try{localStorage.setItem('xbot',JSON.stringify(cfg))}catch{}};
const HIDE=[];/* bot ke-6 (dulu orange, kini #3a3a38) sudah ditampilkan */
let stp=false,cur=10,open=false,hist=[],img=null,docTxt=null,att=null,busy=false,ctrl=null,MODELS=[],IMGS=[];

 return `M${P(x1,y1,r1,a)}L${P(x2,y2,r2,a)}A${f(r2)} ${f(r2)} 0 ${l2} 0 ${P(x2,y2,r2,b)}L${P(x1,y1,r1,b)}A${f(r1)} ${f(r1)} 0 ${1-l2} 0 ${P(x1,y1,r1,a)}Z`}

<style>

<script>
(()=>{const v=window.visualViewport,rs=document.querySelector('#rs'),rl=document.querySelector('#rl'),rt=document.querySelector('#rt'),cmp=document.querySelector('#rcmp');
if(!v||!rs||!rt||!cmp)return;
const S=rs.style,DUR=470,LEAD=60;
const BZ=(()=>{const x1=.3234,y1=.872,x2=.3683,y2=.9696,P=(a,b,c,t)=>3*(1-t)*(1-t)*t*a+3*(1-t)*t*t*b+t*t*t*c;return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const d=P(x1,x2,1,t)-x,dv=3*(1-t)*(1-t)*x1+6*(1-t)*t*(x2-x1)+3*t*t*(1-x2);if(Math.abs(d)<1e-5||!dv)break;t-=d/dv}return P(y1,y2,1,t)}})();
const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
const land=()=>window.innerWidth>window.innerHeight,ek=()=>'xkb'+(land()?'l':'p');
const okK=k=>k>150&&k<window.innerHeight*(land()?.8:.44);
const getE=()=>{try{const e=+localStorage.getItem(ek())||0;return okK(e)?e:0}catch(e){return 0}};
const guess=()=>{const e=getE();return e>100?e:Math.round(land()?window.innerHeight*.52:Math.max(screen.width,screen.height)*.386)};
let cur=0,tgt=0,from=0,t0=0,raf=0,K=0,st=0,pt=0,ho=0,sett=0,last=0,pu=0,pr=0;
const near=()=>rl.scrollHeight-rl.scrollTop-rl.clientHeight<80;
const apply=k=>{S.setProperty('--kb',k.toFixed(1)+'px');S.setProperty('--ko',K?Math.min(1,k/K).toFixed(3):'0');if(st)rl.scrollTop=1e9};
const run=ts=>{const p=Math.min(1,Math.max(0,(ts-t0)/DUR));cur=from+(tgt-from)*BZ(p);apply(cur);raf=p<1?requestAnimationFrame(run):0};
const go=k=>{if(Math.abs(k-tgt)<.5)return;if(k>0)K=k;st=near();const moving=!!raf;tgt=k;from=cur;t0=performance.now()+(moving||k<=0?0:LEAD);cancelAnimationFrame(raf);raf=requestAnimationFrame(run)};
const pin=()=>{S.setProperty('--vt',v.offsetTop.toFixed(1)+'px')};
const fit=()=>{S.setProperty('--H',window.innerHeight+'px');pin()};
const pump=ms=>{pu=performance.now()+(ms||1300);if(pr)return;const L=()=>{pin();pr=performance.now()<pu?requestAnimationFrame(L):0};pr=requestAnimationFrame(L)};
const foc=()=>{const a=document.activeElement;return a===rt||a===kp};
/* koreksi ukuran keyboard setelah iOS tenang (dua bacaan sama berturut-turut) */
const settle=()=>{if(rs.hidden)return;const k=window.innerHeight-v.height;
 if(k>60){if(!okK(k)||!foc())return;if(Math.abs(k-last)>2){last=k;clearTimeout(sett);sett=setTimeout(settle,160);return}
  try{if(Math.abs(k-getE())>2)localStorage.setItem(ek(),String(Math.round(k)))}catch(e){}
  if(Math.abs(k-tgt)>3)go(k)}
 else if(!foc()&&!ho)go(0)};
v.addEventListener('resize',()=>{pump();fit();last=0;clearTimeout(sett);sett=setTimeout(settle,160)});
v.addEventListener('scroll',()=>{pin();pump(600)});
window.addEventListener('orientationchange',()=>setTimeout(fit,300));fit();
/* kolom bayangan di atas layar: iOS membuka keyboard tanpa menggeser halaman, lalu fokus dipindah ke kolom asli */
const kp=document.createElement('input');kp.type='text';kp.setAttribute('aria-hidden','true');kp.tabIndex=-1;kp.autocapitalize='sentences';
kp.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;font-size:16px;pointer-events:none;caret-color:transparent;background:none;color:transparent';
document.body.appendChild(kp);
const rawFocus=HTMLElement.prototype.focus;
const handoff=()=>{clearTimeout(ho);ho=0;if(document.activeElement!==kp)return;const typed=kp.value;kp.value='';rawFocus.call(rt,{preventScroll:true});if(typed){rt.value+=typed;rt.dispatchEvent(new Event('input',{bubbles:true}))}try{rt.setSelectionRange(rt.value.length,rt.value.length)}catch(e){}window.scrollTo(0,0);pump()};
const open=()=>{if(document.activeElement===rt||document.activeElement===kp)return;
 if(!ios){rawFocus.call(rt);return}
 pump();clearTimeout(pt);go(guess());rawFocus.call(kp,{preventScroll:true});clearTimeout(ho);ho=setTimeout(handoff,560);pt=setTimeout(settle,900)};
rt.addEventListener('focus',()=>{pump();if(tgt<1)go(guess());clearTimeout(pt);pt=setTimeout(settle,900)});
const closed=()=>setTimeout(()=>{if(foc()||ho)return;go(0)},60);
rt.addEventListener('blur',()=>{pump();closed()});kp.addEventListener('blur',closed);
cmp.addEventListener('touchstart',e=>{if(e.target.closest('button')||document.activeElement===rt)return;e.preventDefault();open()},{passive:false});
cmp.addEventListener('click',e=>{if(e.target.closest('button'))return;open()});
/* tombol kirim tidak boleh mencuri fokus: keyboard tetap terbuka selama ngobrol */
/* setelah kirim: keyboard turun otomatis (seperti Grok / chat utama) */
const sd=document.querySelector('#rsd');if(sd)sd.addEventListener('click',()=>{clearTimeout(ho);ho=0;clearTimeout(pt);try{kp.blur()}catch(e){}try{rt.blur()}catch(e){}go(0)});
/* keluar dari Ruang Bot: reset tanpa animasi */
const reset=()=>{clearTimeout(ho);ho=0;cancelAnimationFrame(raf);raf=0;cur=tgt=from=0;try{kp.blur();rt.blur()}catch(e){}apply(0)};
const rx=document.querySelector('#rx');if(rx)rx.addEventListener('click',reset);
new MutationObserver(()=>{if(rs.hidden)reset();else fit()}).observe(rs,{attributes:true,attributeFilter:['hidden']});
})();

<script>
(()=>{
const XT={};
const jf=(u,o)=>fetch(u,o).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
const jina=u=>fetch('https://r.jina.ai/'+u,{headers:{'X-Return-Format':'markdown'}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});

XT.weather=async({kota='Jakarta'})=>{
  const g=await jf(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(kota)}&count=1&language=id&format=json`);
  if(!g.results?.length) throw new Error(`Kota "${kota}" tidak ditemukan`);
  const c=g.results[0];
  const w=await jf(`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3`);
  const codes={0:'Cerah',1:'Cerah sebagian',2:'Berawan',3:'Mendung',45:'Berkabut',51:'Gerimis',61:'Hujan ringan',63:'Hujan sedang',65:'Hujan lebat',80:'Hujan lokal',95:'Badai petir'};
  return {kota:`${c.name}, ${c.admin1||c.country||''}`.trim(),
    sekarang:`${w.current.temperature_2m}°C, ${codes[w.current.weather_code]||'kode '+w.current.weather_code}, kelembapan ${w.current.relative_humidity_2m}%`,
    ramalan:w.daily.time.map((t,i)=>({tanggal:t,kondisi:codes[w.daily.weather_code[i]]||'-',min:w.daily.temperature_2m_min[i],max:w.daily.temperature_2m_max[i],hujan:w.daily.precipitation_probability_max[i]}))};
};
XT.rate=async({dari='USD',ke='IDR',jumlah=1})=>{
  dari=String(dari).toUpperCase(); ke=String(ke).toUpperCase();
  const r=await jf(`https://api.frankfurter.app/latest?amount=${jumlah}&from=${dari}&to=${ke}`);
  if(!r.rates?.[ke]) throw new Error(`Kurs ${dari}→${ke} tidak tersedia`);
  return {dari,ke,jumlah,hasil:r.rates[ke],tanggal:r.date,kurs1:`1 ${dari} = ${(r.rates[ke]/jumlah).toFixed(4)} ${ke}`};
};
XT.wiki=async({q,lang='id'})=>{
  if(!q) throw new Error('Kata kunci kosong');
  const base=lang==='en'?'en.wikipedia.org':'id.wikipedia.org';
  const s=await jf(`https://${base}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*&srlimit=1`);
  if(!s.query?.search?.length) throw new Error(`Tidak ada artikel untuk "${q}"`);
  const t=s.query.search[0].title;
  const p=await jf(`https://${base}/w/api.php?action=query&prop=extracts&explaintext=1&exintro=1&titles=${encodeURIComponent(t)}&format=json&origin=*`);
  const pg=Object.values(p.query.pages)[0];
  return {judul:t,ringkas:(pg.extract||'').slice(0,600),url:`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(t.replace(/ /g,'_'))}`};
};
XT.calc=async({expr})=>{
  const clean=String(expr||'').replace(/[^0-9+\-*/().^ ]/g,'').replace(/\^/g,'**');
  if(!clean) throw new Error('Ekspresi kosong');
  const v=new Function(`'use strict';return (${clean})`)();
  if(typeof v!=='number'||!isFinite(v)) throw new Error('Hasil bukan angka');
  return {ekspresi:expr,hasil:v,dibulatkan:Math.round(v*1e6)/1e6};
};
XT.time=async({zona='jakarta'})=>{
  const zones={jakarta:'Asia/Jakarta',wib:'Asia/Jakarta',bandung:'Asia/Jakarta',bali:'Asia/Makassar',makassar:'Asia/Makassar',jayapura:'Asia/Jayapura',singapore:'Asia/Singapore',tokyo:'Asia/Tokyo',seoul:'Asia/Seoul',beijing:'Asia/Shanghai',bangkok:'Asia/Bangkok',delhi:'Asia/Kolkata',dubai:'Asia/Dubai',london:'Europe/London',paris:'Europe/Paris',berlin:'Europe/Berlin',moscow:'Europe/Moscow','new york':'America/New_York','los angeles':'America/Los_Angeles',chicago:'America/Chicago',toronto:'America/Toronto',sydney:'Australia/Sydney',melbourne:'Australia/Melbourne',auckland:'Pacific/Auckland'};
  const key=String(zona||'jakarta').toLowerCase().trim();
  const tz=zones[key]||(key.includes('/')?zona:null);
  if(!tz) throw new Error(`Zona "${zona}" tidak dikenal`);
  return {zona,waktu:new Intl.DateTimeFormat('id-ID',{timeZone:tz,dateStyle:'full',timeStyle:'long'}).format(new Date())};
};
XT.news=async({topik='teknologi'})=>{

};
/* berita dari GDELT: tanpa API key dan tanpa memakai kuota model. Gagal = error biasa, fungsi lain tidak terpengaruh */
XT.berita_gdelt=async({topik='',hari=1,jumlah=5}={})=>{
  const q=String(topik||'').trim();
  if(!q) throw new Error('Topik kosong');
  const n=Math.min(10,Math.max(1,parseInt(jumlah,10)||5));
  const h=Math.min(7,Math.max(1,parseInt(hari,10)||1));
  const u='https://api.gdeltproject.org/api/v2/doc/doc?query='+encodeURIComponent(q)+'&mode=artlist&format=json&sort=datedesc&maxrecords='+n+'&timespan='+h+'d';
  const c=new AbortController(),to=setTimeout(()=>c.abort(),12000);
  let t='';
  try{
    const r=await origFetch(u,{signal:c.signal});
    if(!r.ok) throw new Error('GDELT HTTP '+r.status);
    t=await r.text();
  }catch(e){
    throw new Error('GDELT gagal: '+(e&&e.name==='AbortError'?'waktu habis':((e&&e.message)||'tidak diketahui')));
  }finally{clearTimeout(to)}
  let j;
  try{j=JSON.parse(t)}catch(e){throw new Error('GDELT membalas bukan JSON: '+t.slice(0,120))}

/* Cadangan pencarian web: Parallel (key di Pengaturan). Dipakai hanya jika pencarian utama gagal/kosong. */
{const _s=XT.search;
XT.search=async a=>{let err=null;

/* ---------- Penyambung: alat dijalankan di browser, hasilnya dikirim balik ke model ---------- */

[ALAT TERSEDIA]

const TOOL_SYS2=`

const readFinal=async r=>{
  const t=await r.text();let fin=null;
  for(const l of t.split('\n')){if(!l.trim())continue;let j;try{j=JSON.parse(l)}catch{continue}if(!j.s)fin=j}
  return fin;
};
/* Ambil pemanggilan tool dari balasan model. Terima: <tool>{..}</tool>, ```json {..}```, atau JSON mentah {"name":..,"args":..} */
const TOOL_PATTERNS=[/<tool>\s*([\s\S]*?)\s*<\/tool>/,/```(?:tool|json)?\s*(\{[\s\S]*?"name"[\s\S]*?\})\s*```/,/(\{\s*"name"\s*:\s*"[^"]+"[\s\S]*?\})\s*$/];
const jfix=s=>{let o='',q=0,e=0;for(const c of s){if(q){if(e){e=0;o+=c}else if(c==='\\'){e=1;o+=c}else if(c==='"'){q=0;o+=c}else if(c==='\n')o+='\\n';else if(c==='\r')o+='\\r';else if(c==='\t')o+='\\t';else o+=c}else{if(c==='"')q=1;o+=c}}return o};
const jp=s=>{try{return JSON.parse(s)}catch(e){try{return JSON.parse(jfix(s))}catch(e2){return null}}};
const parseTool=t=>{for(const re of TOOL_PATTERNS){const m=re.exec(t||'');if(!m)continue;const c=jp(m[1]);if(c&&c.name)return {call:c,raw:m[0]}}return null};
const stripTool=t=>{let s=String(t||'').replace(/<tool>[\s\S]*?<\/tool>/g,'');for(const re of TOOL_PATTERNS.slice(1)){const m=re.exec(s);if(m){const c=jp(m[1]);if(c&&c.name){s=s.replace(m[0],'');break}}}return s.trim()};
const origFetch=window.fetch.bind(window);

window.fetch=async(input,init={})=>{
  const url=typeof input==='string'?input:(input&&input.url)||'';
  if(url!==CHAT||!init.body) return origFetch(input,init);
  let body;try{body=JSON.parse(init.body)}catch{return origFetch(input,init)}
const ANTI_HALU=`

[ATURAN KEJUJURAN]
- Jangan mengarang nama model, angka, tanggal, nama orang, atau kutipan. Jika tidak yakin, katakan tidak yakin.
- Untuk berita, harga, skor, atau kejadian terbaru: hanya sebutkan fakta yang ada di hasil alat atau hasil pencarian. Sebutkan sumber dan tanggalnya.
- Jika hasil pencarian kosong atau tidak relevan, bilang "saya tidak menemukan informasi yang jelas" dan jangan menebak.
- Bedakan dengan jelas antara fakta yang terverifikasi dan dugaan pribadi.`;
  const MAINC=!body.image_gen&&String(body.system||'').includes('[Info perangkat pengguna]');
  body.system=(body.system||'')+TOOL_SYS+(MAINC?TOOL_SYS2:'')+ANTI_HALU;
  let fin=null;
  try{
    for(let step=0;step<6;step++){
      const r=await origFetch(input,{...init,body:JSON.stringify(body)});
      if(!r.ok) throw new Error('HTTP '+r.status);
      fin=await readFinal(r);
      if(!fin||fin.error||!fin.text) break;
      const blk=[...String(fin.text).matchAll(/<tool>\s*([\s\S]*?)\s*<\/tool>/g)].map(m=>jp(m[1])).filter(c=>c&&c.name);
      const calls=blk.length?blk:(()=>{const pt=parseTool(fin.text);return pt?[pt.call]:[]})();
      if(!calls.length) break;
      const outs=[];
      const RO=/^(weather|rate|wiki|calc|time|news|berita_gdelt|cari_google|read|search)$/,one=async c=>{let res;try{res=await XT.run(c.name,c.args)}catch(e){res={error:e.message||String(e)}}return `[HASIL ALAT ${c.name}]: ${JSON.stringify(res)}`};
      if(calls.length>1&&calls.every(c=>RO.test(c.name)))outs.push(...await Promise.all(calls.map(one)));else for(const c of calls)outs.push(await one(c));
      body.messages=[...body.messages,
        {role:'assistant',content:fin.text},
        {role:'user',content:outs.join('\n')+'\nSekarang jawab pengguna dengan bahasa biasa.'}];
      fin=null;
    }
  }catch(e){fin={error:'Alat gagal: '+(e.message||e)}}
  if(fin&&fin.text) fin.text=stripTool(fin.text);
  return new Response(JSON.stringify(fin||{error:'Balasan kosong dari server'})+'\n',{status:200,headers:{'Content-Type':'application/x-ndjson'}});
};

<!-- ===== PATCH FASTSEARCH: cepat, banyak sumber, hemat API. Membungkus XT.search; gagal = jatuh ke sistem lama ===== -->
<script>
(()=>{
if(window.XSRCH||!window.XT)return;
const XT=window.XT,_orig=XT.search;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const media=()=>((typeof cfg!=='undefined'&&cfg&&cfg.media)||{});
const HEDGE=2500,TMO=8000,TTL_FRESH=5*60e3,TTL_STD=30*60e3,MAXR=8;
const CAP0={serper:60,parallel:30};            /* batas panggilan per hari; ubah lewat XSRCH.cap('serper',100) */
const FRESH=/\b(terbaru|terkini|hari ini|kemarin|barusan|sekarang|saat ini|minggu ini|bulan ini|berita|breaking|update|viral|harga|kurs|skor|jadwal|cuaca|rilis|latest|today|news|price|score|2026)\b/i;

/* ---------- kuota & pemutus sirkuit ---------- */
const day=()=>new Date().toISOString().slice(0,10);
const Q=()=>{const q=LS('xbot_q',{});if(q.d!==day()){q.d=day();q.n={};}q.t=q.t||{};q.n=q.n||{};return q};
const can=n=>{if(!media()[n])return false;const q=Q(),cap=(LS('xbot_qcap',{})[n])||CAP0[n];return (q.n[n]||0)<cap&&Date.now()>(q.t[n]||0)};
const hit=n=>{const q=Q();q.n[n]=(q.n[n]||0)+1;SV('xbot_q',q)};
const trip=(n,ms)=>{const q=Q();q.t[n]=Date.now()+ms;SV('xbot_q',q)};

/* ---------- util ---------- */
const norm=q=>String(q||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
const ukey=u=>{try{const x=new URL(u);return x.hostname.replace(/^www\./,'')+x.pathname.replace(/\/$/,'')}catch(e){return u}};
const T=async(u,o,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||TMO);try{return await fetch(u,{...(o||{}),signal:c.signal})}finally{clearTimeout(t)}};
const clip=(s,n)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,n);

/* ---------- sumber gratis ---------- */
const wiki=async(q,lang)=>{
  const r=await T(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3&prop=extracts|info&exintro=1&explaintext=1&exchars=350&inprop=url`,{},6000);
  if(!r.ok)throw new Error('wiki '+r.status);
  const j=await r.json(),P=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0));
  return P.filter(p=>p.extract).map(p=>({t:p.title+' (Wikipedia '+lang+')',u:p.fullurl,s:clip(p.extract,300),src:'wiki'}));
};
let gdAt=0;
const gdelt=async q=>{
  if(Date.now()-gdAt<5200)throw new Error('gdelt jeda');gdAt=Date.now();
  const r=await T('https://api.gdeltproject.org/api/v2/doc/doc?query='+encodeURIComponent(q.slice(0,150))+'&mode=artlist&format=json&sort=datedesc&maxrecords=6&timespan=3d',{},7000);
  if(!r.ok)throw new Error('gdelt '+r.status);
  const j=JSON.parse(await r.text());
  return (j.articles||[]).filter(a=>a.url).map(a=>{const d=String(a.seendate||'');return{t:a.title||host(a.url),u:a.url,s:'',d:d?d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8):'',src:'gdelt'}});
};

/* ---------- sumber berbayar / berkuota ---------- */
const serper=async q=>{
  hit('serper');
  const r=await T('https://google.serper.dev/search',{method:'POST',headers:{'Content-Type':'application/json','X-API-KEY':media().serper},body:JSON.stringify({q:q.slice(0,200),gl:'id',hl:'id',num:6})},TMO);
  if(r.status===401||r.status===403)trip('serper',6*36e5);
  if(r.status===429||r.status===402)trip('serper',30*60e3);
  if(!r.ok)throw new Error('serper '+r.status);
  const j=await r.json(),out=[];
  const ab=j.answerBox;if(ab&&(ab.answer||ab.snippet))out.push({t:ab.title||'Jawaban langsung',u:ab.link||'',s:clip(ab.answer||ab.snippet,300),src:'serper'});
  for(const x of (j.organic||[]).slice(0,6))if(x.link)out.push({t:x.title||host(x.link),u:x.link,s:clip(x.snippet,260),d:x.date||'',src:'serper'});
  return out;
};
const parallel=async q=>{
  hit('parallel');
  const r=await T('https://api.parallel.ai/v1/search',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':media().parallel},body:JSON.stringify({objective:q.slice(0,500),search_queries:[q.slice(0,100)],mode:'basic',advanced_settings:{max_results:6,excerpt_settings:{max_chars_per_result:500}}})},TMO+4000);
  if(r.status===401||r.status===403)trip('parallel',6*36e5);
  if(r.status===429||r.status===402)trip('parallel',30*60e3);
  if(!r.ok)throw new Error('parallel '+r.status);
  const j=await r.json();
  return (j.results||[]).filter(x=>x&&x.url).map(x=>({t:x.title||host(x.url),u:x.url,s:clip((x.excerpts||[]).join(' '),260),d:x.publish_date||'',src:'parallel'}));
};
/* Serper dulu; Parallel hanya ikut kalau Serper lambat (HEDGE) atau gagal. Yang menang duluan dipakai, sisanya tidak dipanggil. */
const paid=async q=>{
  const S=can('serper'),P=can('parallel');
  if(!S&&!P)return [];
  const mk=f=>f(q).then(r=>{if(r&&r.length)return r;throw new Error('kosong')});
  if(!P)return mk(serper).catch(()=>[]);
  if(!S)return mk(parallel).catch(()=>[]);
  let won=false,pp=null;const startP=()=>pp||(pp=mk(parallel));
  const a=mk(serper).then(r=>{won=true;return r},()=>startP());
  const b=sleep(HEDGE).then(()=>won?new Promise(()=>{}):startP());
  return Promise.any([a,b]).catch(()=>[]);
};

/* ---------- gabung, buang duplikat, rapikan ---------- */
const merge=lists=>{
  const seen=new Set(),out=[];
  for(const L of lists)for(const x of L||[]){
    if(!x||!x.t)continue;const k=x.u?ukey(x.u):x.t;if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length>=MAXR)return out}
  return out;
};
const fmt=(q,items)=>{
  const src=[...new Set(items.map(x=>x.src))].join('+');
  let txt=items.map((x,i)=>`${i+1}. ${x.t}${x.d?' ('+x.d+')':''}${x.u?'\n'+x.u:''}${x.s?'\n'+x.s:''}`).join('\n\n');
  return {q,sumber:src,hasil:txt.slice(0,3000)};
};

/* ---------- cache + dedupe permintaan yang sedang berjalan ---------- */
const MEM=new Map(),INF=new Map();
const DISK=()=>LS('xbot_sc',{});
const cget=k=>{const m=MEM.get(k);if(m&&m.e>Date.now())return m.v;const d=DISK()[k];if(d&&d.e>Date.now()){MEM.set(k,d);return d.v}return null};
const cset=(k,v,ttl)=>{const e=Date.now()+ttl;MEM.set(k,{v,e});const d=DISK(),ks=Object.keys(d).filter(x=>d[x].e<Date.now());ks.forEach(x=>delete d[x]);
  const all=Object.keys(d);while(all.length>=25){delete d[all.shift()]}d[k]={v,e};SV('xbot_sc',d)};
const stats={cache:0,free:0,paid:0,fallback:0};

/* ---------- alur utama ---------- */
const run=async q=>{
  const fresh=FRESH.test(q);
  const free=Promise.allSettled([wiki(q,'id'),wiki(q,'en'),fresh?gdelt(q):Promise.reject(0)]).then(r=>r.map(x=>x.status==='fulfilled'?x.value:[]));
  let pd=[];
  if(fresh){const [f,p]=await Promise.all([free,paid(q)]);pd=p;const [wi,we,gd]=f;
    const items=merge([pd,gd,wi,we]);return {items,usedPaid:pd.length>0}}
  const [wi,we,gd]=await free;
  let items=merge([wi,we,gd]);
  if(!items.some(x=>x.s&&x.s.length>120)){pd=await paid(q);items=merge([pd,wi,we,gd])}
  return {items,usedPaid:pd.length>0};
};
XT.search=async a=>{
  const q=String((a&&a.q)||'').trim();
  if(!q)throw new Error('Query kosong');
  const k=norm(q),hitc=cget(k);
  if(hitc){stats.cache++;return hitc}
  if(INF.has(k))return INF.get(k);
  const p=(async()=>{
    try{
      const {items,usedPaid}=await run(q);
      if(items.length){const r=fmt(q,items);cset(k,r,FRESH.test(q)?TTL_FRESH:TTL_STD);usedPaid?stats.paid++:stats.free++;return r}
    }catch(e){}
    stats.fallback++;return _orig(a);          /* sistem lama tetap jadi cadangan terakhir */
  })().finally(()=>INF.delete(k));
  INF.set(k,p);return p;
};
window.XSRCH={stats:()=>({...stats,kuota:Q().n,dibekukan:Q().t}),clear:()=>{MEM.clear();SV('xbot_sc',{})},cap:(n,v)=>{const c=LS('xbot_qcap',{});c[n]=v;SV('xbot_qcap',c)},orig:_orig};
})();
</script>
<!-- ===== PATCH V2: UNIVERSAL PLAYER & EDIT FOTO AI ===== -->
<script>
(()=>{
if(window._xbotMaster)return;
window._xbotMaster=1;

// ==========================================
// 1. FUNGSI PENCARI MEDIA (Tanpa API Key)
// ==========================================
async function cariYouTube(query) {
    try {
        const wr = await fetch(SERVER_URL.replace(/\/$/, '') + '/yt-search?q=' + encodeURIComponent(query));
        if (wr.ok) {
            const wj = await wr.json();
            if (wj && wj.items && wj.items[0] && wj.items[0].id) return wj.items[0].id;
        }
    } catch(e) {  }
    try {
        const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
        // Proxy CORS yang lebih stabil
        const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        const res = await fetch(proxy);
        const text = await res.text();
        const match = text.match(/"videoId":"([\w-]{11})"/);
        if (match && match[1]) return match[1];
    } catch(e) {  }
    return null;
}

async function cariWikimedia(query, type) {
    try {
        const url = `https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=3&gsrsearch=${encodeURIComponent(query)}&prop=imageinfo&iiprop=url|mime`;
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query?.pages;
        if (!pages) return null;
        
        for (let id in pages) {
            const file = pages[id].imageinfo?.[0];
            if (file && file.url) {
                if (type === 'foto' && file.mime.startsWith('image/')) return file.url;
                if (type === 'audio' && (file.mime.startsWith('audio/') || file.mime === 'application/ogg')) return file.url;
            }
        }
    } catch(e) {  }
    return null;
}

// ==========================================
// 2. SADAP KLIK TOMBOL KIRIM (Capture Phase)
// ==========================================
document.addEventListener('click', async (e) => {
    if (!e.target.closest('#sd')) return;
    
    const tx = document.querySelector('#tx');
    const text = tx.value.trim();
    const textLower = text.toLowerCase();
    const im0 = (typeof img !== 'undefined') ? img : null;
    
    // ----------------------------------------
    // FITUR A: EDIT FOTO AI (pakai model gambar & key dari Pengaturan)
    // ----------------------------------------
    const EDRX = /^\/*\s*edit(?:kan)?\b[\s,:-]*/i;
    const NATRX = /^\/*\s*(?:ubah(?:lah)?|ganti(?:kan)?|hilangkan|hapus(?:kan)?|tambahkan|percantik|perbaiki|bersihkan|retouch|jadikan)\b/i;
    if (im0 && (EDRX.test(text) || NATRX.test(text))) {
        e.preventDefault();
        e.stopPropagation();
        if (window._xbotEditBusy) return;
        window._xbotEditBusy = true;

        const promptEdit = (EDRX.test(text) ? text.replace(EDRX, '').replace(/^(?:foto|gambar)\s+(?:ini|itu)\b[\s,:-]*/i, '') : text).trim();
        const sd = document.querySelector('#sd');
        const E2 = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        const divUser = add(`<div class="um"><img src="${im0}">${E2(text)}</div>`);
        if (window.anchor) anchor(divUser);
        const divBot = add('<div class="bt"><i>🎨 Sedang mengedit foto...</i></div>');

        sd.textContent = '■';
        tx.value = '';
        tx.style.height = 'auto';
        tx.disabled = true;
        img = null;
        document.querySelector('#pv').textContent = '';

        try {
            const mm = /^data:([^;]+);base64,(.+)$/.exec(im0);
            if (!mm) throw new Error('Foto tidak bisa dibaca, lampirkan lagi.');
            const mime = mm[1], b64 = mm[2];
            const model = String(cfg.img || 'gemini-3.1-flash-image').replace(/^gemini:/, '');
            const keys = String((cfg.keys && cfg.keys.gemini) || '').split(/[,\s]+/).filter(Boolean);
            const ask = promptEdit ? 'Edit foto ini sesuai permintaan: ' + promptEdit : 'Edit foto ini jadi lebih bagus';
            let out = null, lastErr = null;

            for (const k of keys) {
                try {
                    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(k)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: 'user', parts: [{ text: ask }, { inlineData: { mimeType: mime, data: b64 } }] }],
                            generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
                        })
                    });
                    const d = await r.json();
                    if (d.error) throw new Error(d.error.message || 'Gemini error');
                    const parts = (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || [];
                    const p = parts.find(x => x.inlineData || x.inline_data);
                    const note = parts.filter(x => x.text).map(x => x.text).join(' ').trim();
                    if (p) {
                        const idt = p.inlineData || p.inline_data;
                        out = { src: `data:${idt.mimeType || idt.mime_type || 'image/png'};base64,${idt.data}`, note };
                        break;
                    }
                    lastErr = new Error(note || 'Gemini tidak mengembalikan gambar (mungkin ditolak filter keamanan).');
                } catch (err) { lastErr = err; }
            }

            if (!out && !keys.length) {
                /* tanpa key di Pengaturan: coba lewat server (key bawaan server) */
                const r = await fetch(cfg.url.replace(/\/$/, '') + '/chat', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: [{ role: 'user', content: 'Edit foto ini: ' + ask }], image: im0, image_gen: true, system: 'Edit foto sesuai permintaan pengguna.', now: new Date().toISOString(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone, model: cfg.model, imgModel: cfg.img, mode: 'off', keys: cfg.keys })
                });
                const raw = await r.text();
                let fin = null;
                raw.split('\n').forEach(l => { if (!l) return; try { const j = JSON.parse(l); if (!j.s) fin = j } catch (x) {} });
                if (fin && fin.image) out = { src: fin.image, note: '' };
                else lastErr = new Error((fin && fin.error) || 'Key Gemini kosong. Isi key gemini di Pengaturan (⚙️) agar edit foto bisa jalan.');
            }

            if (!out) throw (lastErr || new Error('Gagal mengedit foto.'));
            divBot.innerHTML = `<img src="${out.src}" style="max-width:100%;border-radius:14px;display:block;margin-bottom:6px">${out.note ? E2(out.note) : ''}`;
            hist.push({ role: 'user', content: '[edit foto] ' + ask });
            hist.push({ role: 'assistant', content: '[gambar hasil edit]' });
        } catch (err) {
            divBot.innerHTML = `<span class="err">⚠️ ${E2(err.message || err)}</span>`;
        }

        tx.disabled = false;
        sd.textContent = '↑';
        window._xbotEditBusy = false;
        if (window.sb) sb();
        return;
    }

    // ----------------------------------------
    // FITUR B: CARI MEDIA (Video / Foto / Musik)
    // ----------------------------------------
    let type = null, query = '';
    if (textLower.startsWith('video ')) { type = 'video'; query = text.substring(6); }
    else if (textLower.startsWith('foto ')) { type = 'foto'; query = text.substring(5); }
    else if (textLower.startsWith('musik ') || textLower.startsWith('lagu ')) { type = 'audio'; query = text.replace(/^(musik|lagu) /, ''); }

    if (type) {
        e.preventDefault();
        e.stopPropagation();

        const ms = document.querySelector('#ms');
        const sd = document.querySelector('#sd');
        
        const divUser = document.createElement('div');
        divUser.className = 'um';
        divUser.textContent = text;
        ms.appendChild(divUser);

        const divBot = document.createElement('div');
        divBot.className = 'bt';
        divBot.innerHTML = `<i>🔍 Mencari ${type} untuk "${query}"...</i>`;
        ms.appendChild(divBot);
        ms.scrollTop = ms.scrollHeight;

        sd.textContent = '■';
        tx.value = '';
        tx.disabled = true;

        try {
            if (type === 'video') {
                const videoId = await cariYouTube(query);
                if (videoId) {
                    divBot.innerHTML = `<div style="margin-top:8px;max-width:320px"><iframe width="100%" style="aspect-ratio:16/9;border-radius:12px;border:none;background:#000" src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`;
                } else {
                    divBot.innerHTML = await window.MP.find('video', query);
                }
            } else {
                divBot.innerHTML = await window.MP.find(type === 'audio' ? 'musik' : type, query);
            }
        } catch (err) {
            divBot.innerHTML = `⚠️ Terjadi kesalahan sistem saat mencari media.`;
        }

        tx.disabled = false;
        sd.textContent = '↑';
        ms.scrollTop = ms.scrollHeight;
    }
}, true);


})();

<script>
/* PEMUTAR MEDIA: foto, video, musik/audio di chat utama (tag bot, lampiran, link) */
(()=>{
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const YT=u=>{const m=String(u).match(/^https:\/\/(?:www\.|m\.|music\.)?(?:youtube\.com\/(?:watch\?(?:[^\s#]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i);return m?m[1]:''};
const VID=/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i,AUD=/\.(mp3|m4a|wav|ogg|oga|aac|flac|opus)(\?|#|$)/i,IMG=/\.(png|jpe?g|webp|gif|avif)(\?|#|$)/i;
const ok=u=>/^https:\/\/[^\s"'<>]+$/.test(String(u||''));
const LB={foto:'foto',video:'video',audio:'audio',musik:'lagu'};
const vidH=s=>`<video src="${E(s)}" controls playsinline preload="metadata"></video>`;
const imgH=s=>`<button class="mpi" aria-label="Buka foto"><img src="${E(s)}" alt="" loading="lazy"></button>`;
const ytH=id=>`<iframe src="https://www.youtube.com/embed/${id}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
const audH=(s,t,sub,art)=>`<div class="mpa"><div class="mh">${art?`<img src="${E(art)}" alt="">`:'<div class="ic">🎵</div>'}<div><b>${E(t||'Audio')}</b>${sub?`<span>${E(sub)}</span>`:''}</div></div><audio src="${E(s)}" controls preload="metadata"></audio></div>`;
const miss=(it,e)=>`<div class="mpx">⚠️ ${LB[it.k]||'media'} “${E(it.q)}” ${e&&e.net?'tidak bisa dicari (iTunes tidak bisa dihubungi, cek koneksi).':'tidak ditemukan.'}${it.k!=='foto'&&!/^https?:/i.test(it.q)?` <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(it.q)}" target="_blank" rel="noopener">Cari di YouTube ↗</a>`:''}</div>`;
const J=async(u,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||8000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}};
/* ===== FOTO STOK GRATIS: Pixabay, lalu Pexels (key di Pengaturan, kosong = dilewati). Video tetap sistem lama (YouTube). ===== */
const JH=async(u,h,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||8000);try{const r=await fetch(u,{headers:h,signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}};
const rnd=a=>a.length?a[Math.floor(Math.random()*Math.min(a.length,10))]:null;
const mk=()=>{try{return (typeof cfg!=='undefined'&&cfg&&cfg.media)||{}}catch(e){return {}}};
async function pixabay(q,key){
 for(const lang of ['','id']){const j=await J('https://pixabay.com/api/?key='+encodeURIComponent(key)+'&q='+encodeURIComponent(q.slice(0,100))+'&per_page=15&safesearch=true&image_type=photo'+(lang?'&lang='+lang:''),8000);
  const x=rnd((j.hits||[]).filter(x=>ok(x.webformatURL)));if(!x)continue;
  return{src:x.webformatURL,kind:'foto',by:x.user||'',page:ok(x.pageURL)?x.pageURL:'https://pixabay.com',name:'Pixabay'}}
 return null}
async function pexels(q,key){
 for(const loc of ['','id-ID']){const j=await JH('https://api.pexels.com/v1/search?query='+encodeURIComponent(q.slice(0,100))+'&per_page=15'+(loc?'&locale='+loc:''),{Authorization:key},8000);
  const x=rnd(j.photos||[]);if(!x)continue;const s=x.src||{},src=ok(s.large)?s.large:ok(s.medium)?s.medium:'';if(!src)continue;
  return{src,kind:'foto',by:x.photographer||'',page:ok(x.url)?x.url:'https://www.pexels.com',name:'Pexels'}}
 return null}
async function unsplash(q,key){
 const j=await J('https://api.unsplash.com/search/photos?query='+encodeURIComponent(q.slice(0,100))+'&per_page=15&client_id='+encodeURIComponent(key),8000);
 const x=rnd((j.results||[]).filter(x=>x&&x.urls&&ok(x.urls.regular)));if(!x)return null;
 const u=x.links&&ok(x.links.html)?x.links.html:'https://unsplash.com';
 return{src:x.urls.regular,kind:'foto',by:(x.user&&x.user.name)||'',page:u+(u.indexOf('?')<0?'?':'&')+'utm_source=xbot&utm_medium=referral',name:'Unsplash'}}
async function openverse(q){
 const j=await J('https://api.openverse.org/v1/images/?q='+encodeURIComponent(q.slice(0,100))+'&page_size=15&mature=false',8000);
 const x=rnd((j.results||[]).filter(x=>x&&(ok(x.thumbnail)||ok(x.url))));if(!x)return null;
 return{src:ok(x.thumbnail)?x.thumbnail:x.url,kind:'foto',by:x.creator||'',page:ok(x.foreign_landing_url)?x.foreign_landing_url:'https://openverse.org',name:'Openverse'}}
window.STK={has:()=>true,
 async find(q,kind){const k=mk();q=String(q||'').trim();if(!q||kind!=='foto')return null;
  if(k.pixabay){try{const r=await pixabay(q,k.pixabay);if(r)return r}catch(e){}}
  if(k.pexels){try{const r=await pexels(q,k.pexels);if(r)return r}catch(e){}}
  if(k.unsplash){try{const r=await unsplash(q,k.unsplash);if(r)return r}catch(e){}}
  try{const r=await openverse(q);if(r)return r}catch(e){}
  return null}};
const stkH=s=>`<div class="mpw">${imgH(s.src)}<div class="mpc">📷 <a href="${E(s.page)}" target="_blank" rel="noopener">${E(s.by?s.by+' · ':'')}${E(s.name)}</a></div></div>`;
const PREF={video:/^video\/mp4$/,audio:/^audio\/(mpeg|mp3|wav|x-wav)$/};
const wm=async(q,kind)=>{const ft=kind==='foto'?'bitmap':kind==='video'?'video':'audio';
 const j=await J('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch='+encodeURIComponent(q+' filetype:'+ft)+'&prop=imageinfo&iiprop=url|mime&iiurlwidth=800');
 const p=Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index),L=[];
 for(const x of p){const i=(x.imageinfo||[])[0];if(!i)continue;const t=(x.title||'').replace(/^File:/,'').replace(/\.\w+$/,'').replace(/_/g,' ');
  if(kind==='foto'){if(/^image\/(jpeg|png|webp)$/.test(i.mime)&&ok(i.thumburl))L.push({src:i.thumburl,title:t,mime:i.mime})}
  else if(kind==='video'){if(/^video\/(webm|ogg|mp4)$/.test(i.mime)&&ok(i.url))L.push({src:i.url,title:t,mime:i.mime})}
  else if(/^(audio\/(ogg|mpeg|mp3|wav|x-wav|flac|webm)|application\/ogg)$/.test(i.mime)&&ok(i.url))L.push({src:i.url,title:t,mime:i.mime})}
 return L.find(x=>PREF[kind]&&PREF[kind].test(x.mime))||L[0]||null};
const itn=async q=>{let any=false;
 for(const c of ['ID','US']){try{const j=await J('https://itunes.apple.com/search?media=music&entity=song&limit=8&country='+c+'&term='+encodeURIComponent(q));any=true;
  const r=(j.results||[]).find(x=>ok(x.previewUrl));
  if(r)return{src:r.previewUrl,title:r.trackName,sub:(r.artistName||'')+' · pratinjau 30 detik',art:ok(r.artworkUrl100)?r.artworkUrl100.replace('100x100bb','300x300bb'):''}}catch(e){}}
 if(!any){const e=new Error('net');e.net=1;throw e}
 return null};
async function resolve(it){const q=it.q;
 if(/^https?:\/\//i.test(q)){if(!ok(q))throw 0;const y=it.k!=='foto'&&YT(q);if(y)return ytH(y);
  if(it.k==='foto')return imgH(q);if(it.k==='video')return vidH(q);
  let n='';try{n=decodeURIComponent(q.split('#')[0].split('?')[0].split('/').pop()||'').replace(/\.\w+$/,'')}catch(e){}
  return audH(q,n)}
 if(it.k==='foto'){let sx=null;try{sx=await STK.find(q,'foto')}catch(e){}if(sx)return stkH(sx)}
 if(it.k!=='foto'){try{const wj=await J(SERVER_URL.replace(/\/$/,'')+'/yt-search?q='+encodeURIComponent(q),8000);const id=wj&&wj.items&&wj.items[0]&&wj.items[0].id;if(id)return ytH(id)}catch(e){}}
 let r=null;
 if(it.k==='musik'){let net=0;try{r=await itn(q)}catch(e){net=e&&e.net?1:0}if(!r){try{const w=await wm(q,'audio');if(w)r={src:w.src,title:w.title,sub:'Wikimedia Commons'}}catch(e){}}if(!r){const e=new Error('x');e.net=net;throw e}return audH(r.src,r.title,r.sub,r.art)}
 try{r=await wm(q,it.k)}catch(e){}
 if(!r)throw 0;
 return it.k==='foto'?imgH(r.src):it.k==='video'?vidH(r.src):audH(r.src,r.title,'Wikimedia Commons')}
const TAG=/\[(foto|video|audio|musik|lagu):\s*([^\]\n]{1,200})\]/gi;
const MP=window.MP={
 parse(raw){const items=[],tags=[];
  const out=String(raw||'').split(/(```[\s\S]*?```)/).map((p,i)=>i%2?p:p.replace(TAG,(m,k,q)=>{k=k.toLowerCase();if(k==='lagu')k='musik';q=q.trim();if(q&&items.length<4){items.push({k,q});tags.push('['+k+': '+q+']')}return''})).join('');
  return{text:out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim(),items,tags:tags.join('\n')}},
 mount(box,items){const bt=box.querySelector('.bt');if(!bt||!items.length)return;const w=document.createElement('div');w.className='mp';bt.after(w);
  items.forEach(it=>{const s=document.createElement('div');s.className='mpl';s.textContent='⏳ mencari '+(LB[it.k]||'media')+'...';w.appendChild(s);
   resolve(it).then(h=>{s.outerHTML=h}).catch(e=>{s.outerHTML=miss(it,e)})})},
 async find(k,q){try{return '<div class="mp">'+await resolve({k,q})+'</div>'}catch(e){return '<div class="mp">'+miss({k,q},e)+'</div>'}},
 att(a,im){if(a&&a.k==='v')return `<div class="mp">${vidH(a.url)}</div>`;
  if(a&&a.k==='a')return `<div class="mp">${audH(a.url,String(a.name||'Audio').replace(/\.\w+$/,''),'Audio dari kamu')}</div>`;
  return im?`<img src="${im}">`:''},
 urls(t){const h=(String(t||'').match(/https:\/\/[^\s<>"')\]]+/g)||[]).slice(0,3).map(u=>{const y=YT(u);if(y)return ytH(y);if(IMG.test(u))return imgH(u);if(VID.test(u))return vidH(u);if(AUD.test(u))return audH(u,decodeURIComponent((u.split('?')[0].split('#')[0].split('/').pop()||'audio')).replace(/\.\w+$/,''));return''}).join('');
  return h?`<div class="mp" style="margin-top:8px">${h}</div>`:''},
 userText(t,a){if(!a)return t;const n=a.name||'';
  return a.k==='a'?(t||'Aku melampirkan audio ini.')+`\n[Pengguna melampirkan audio "${n}". Kamu tidak bisa mendengarnya; aplikasi memutarkannya untuk pengguna.]`
  :(t||'Jelaskan video ini.')+`\n[Pengguna melampirkan video "${n}". Kamu hanya menerima satu cuplikan gambarnya; aplikasi memutarkannya untuk pengguna.]`}
};
/* gagal muat -> pesan, bukan kotak kosong */
document.addEventListener('error',e=>{const t=e.target;if(!t||!t.closest||!t.closest('.mp'))return;
