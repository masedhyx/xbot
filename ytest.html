<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tes YouTube XBOT</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#eee;font:16px/1.45 -apple-system,system-ui,sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
h1{font-size:20px;margin:8px 0 14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:#18181b;border:1px solid #333;border-radius:12px;color:#fff;padding:12px;font:inherit}
button{background:#fff;color:#000;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600}
.card{background:#111;border:1px solid #262626;border-radius:12px;padding:12px;margin-top:12px}
.ok{color:#4ade80}.bad{color:#f87171}.mute{color:#9a9aa3;font-size:14px}
.v{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#111;display:block;margin-top:10px}
.item{display:block;width:100%;text-align:left;background:#18181b;color:#eee;border:1px solid #2a2a2a;border-radius:10px;padding:10px;margin-top:8px;font-weight:400}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#bbb;margin:8px 0 0}
</style>
</head>
<body>
<h1>Tes pencarian YouTube</h1>
<div class="row">
  <input id="q" value="lagu wali band puaskah" enterkeyhint="search" autocomplete="off">
  <button id="go">Cari</button>
</div>

<div class="card" id="s1"><b>1. Worker</b> <span class="mute">belum dicek</span></div>
<div class="card" id="s2"><b>2. Pencarian</b> <span class="mute">belum dicek</span></div>
<div class="card" id="s3"><b>3. Pemutar</b> <span class="mute">belum ada video</span></div>

<script>
const WORKER='https://xbot.edhymaster70.workers.dev';
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const set=(id,title,cls,msg,extra='')=>{$(id).innerHTML=`<b>${title}</b> <span class="${cls}">${msg}</span>${extra}`};

async function getJson(url){
  const t0=Date.now();
  let r,txt;
  try{r=await fetch(url,{cache:'no-store'});txt=await r.text()}
  catch(e){return{netErr:e.message||String(e),ms:Date.now()-t0}}
  let j=null;try{j=JSON.parse(txt)}catch{}
  return{status:r.status,ok:r.ok,json:j,raw:txt,ms:Date.now()-t0};
}

function play(id,title){
  $('#s3').innerHTML=`<b>3. Pemutar</b> <span class="ok">memutar</span><div class="mute">${esc(title||id)}</div>
  <iframe class="v" src="https://www.youtube.com/embed/${encodeURIComponent(id)}?playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div class="mute" style="margin-top:8px">Kalau kotak di atas hitam atau bertulisan video tidak tersedia, videonya diblokir pemilik, bukan error aplikasi.</div>`;
}

async function run(){
  const q=$('#q').value.trim();
  if(!q)return;
  set('#s1','1. Worker','mute','memeriksa...');
  set('#s2','2. Pencarian','mute','menunggu...');
  $('#s3').innerHTML='<b>3. Pemutar</b> <span class="mute">belum ada video</span>';

  const a=await getJson(WORKER+'/');
  if(a.netErr){set('#s1','1. Worker','bad','tidak bisa dihubungi',`<pre>${esc(a.netErr)}</pre>`);return}
  if(!a.ok){set('#s1','1. Worker','bad','HTTP '+a.status,`<pre>${esc(a.raw.slice(0,300))}</pre>`);return}
  set('#s1','1. Worker','ok','aktif ('+a.ms+' ms)',`<pre>${esc(a.raw.slice(0,300))}</pre>`);

  const b=await getJson(WORKER+'/yt-search?q='+encodeURIComponent(q));
  if(b.netErr){set('#s2','2. Pencarian','bad','gagal terhubung',`<pre>${esc(b.netErr)}</pre>`);return}
  if(!b.ok){
    let hint='';
    const m=(b.raw||'').toLowerCase();
    if(b.status===503||m.includes('belum diset'))hint='YOUTUBE_API_KEY belum dipasang di Worker.';
    else if(m.includes('quota'))hint='Kuota YouTube harian habis. Coba lagi besok.';
    else if(m.includes('api key')||m.includes('keyinvalid'))hint='API key YouTube salah atau belum aktif.';
    else if(m.includes('has not been used')||m.includes('disabled'))hint='YouTube Data API v3 belum diaktifkan di Google Cloud.';
    set('#s2','2. Pencarian','bad','gagal, HTTP '+b.status,(hint?`<div>${hint}</div>`:'')+`<pre>${esc((b.raw||'').slice(0,500))}</pre>`);
    return;
  }
  const items=(b.json&&b.json.items)||[];
  if(!items.length){set('#s2','2. Pencarian','bad','berhasil tapi hasil kosong',`<pre>${esc(b.raw.slice(0,300))}</pre>`);return}
  set('#s2','2. Pencarian','ok',items.length+' video ditemukan ('+b.ms+' ms)',
    items.map((x,i)=>`<button class="item" data-i="${i}">${esc(x.title)}<div class="mute">${esc(x.channel)}</div></button>`).join(''));
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{const x=items[+el.dataset.i];play(x.id,x.title)});
  play(items[0].id,items[0].title);
}
$('#go').onclick=run;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run()}});
</script>
</body>
</html>
