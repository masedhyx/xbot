const hav=(a,b)=>{const r=Math.PI/180,x=(b[0]-a[0])*r,y=(b[1]-a[1])*r,h=Math.sin(x/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(y/2)**2;return 12742000*Math.asin(Math.sqrt(h))};
const fix=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:10000,maximumAge:20000}):no({message:'GPS tidak didukung browser ini'}));
const gpsStatus=g=>{const{latitude:a,longitude:o,accuracy:c}=g.coords,age=(Date.now()-g.timestamp)/1000;
 if(!isFinite(a)||!isFinite(o)||Math.abs(a)>90||Math.abs(o)>180||(!a&&!o))return'tidak valid (koordinat di luar batas)';
 if(c>100)return'kurang akurat (akurasi lebih dari 100 m)';
 if(age>120)return'data lama (lebih dari 2 menit)';
 return'valid'};
async function rev(a,o){const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=id&lat=${a}&lon=${o}`,{signal:c.signal});return(await r.json()).display_name||null}catch{return null}finally{clearTimeout(t)}}
async function gpsUpdate(){const g=await fix();if(!gpsOn)return;const{latitude:a,longitude:o}=g.coords;gps=g;

 $('#gp').textContent=`📍 GPS aktif · ±${Math.round(g.coords.accuracy)} m · ${gpsStatus(g)}`}

const sysx=()=>`\n\n[Info perangkat pengguna] Waktu sekarang di perangkat pengguna: ${nowStr()}. Pakai ini (jangan menebak) untuk pertanyaan tentang tanggal, hari, atau jam.\n[Format] Jangan memberi warna pada teks kecuali pengguna secara eksplisit memintanya; jawaban biasa ditulis polos tanpa warna. Kalau diminta, tulis [c=warna]teks[/c] (merah, hijau, biru, kuning, oranye, ungu, pink, tosca, coklat, abu, putih, atau hex).\n[Tabel] Untuk tabel pakai tabel markdown standar (baris header, baris |---|---|, lalu isi). Jangan taruh tabel di dalam blok kode.\n[Diagram] Untuk diagram, alur, proses, atau hierarki JANGAN pakai ASCII art. Tulis blok kode berlabel diagram (\`\`\`diagram) berisi flowchart mermaid sederhana, satu hubungan per baris, contoh:\nA[Data] --> B[Pelatihan Model]\nB --> C[Evaluasi]\nC --> D[Deployment]\nlalu tutup dengan \`\`\`. Label singkat.\n[Sumber] Jangan menulis "Sumber: [n]" atau penanda angka seperti [1] di dalam jawaban; daftar sumber ditampilkan terpisah oleh aplikasi.`;
async function send(){
 if(busy){stp=true;ctrl.abort();return}stp=false;
 const t=$('#tx').value.trim();if(!t&&!img)return;
 const im=img,gen=/^\/gambar\s/i.test(t);$('#tx').value='';$('#tx').style.height='auto';img=null;$('#pv').textContent='';
 hist.push({role:'user',content:t||'Jelaskan foto ini.'});
 anchor(add(`<div class="um">${im?`<img src="${im}">`:''}${esc(t)}</div>`));
 busy=true;$('#sd').textContent='■';ctrl=new AbortController();
 const b=cfg.bots[cur],st=add(`<div class="stt">${bot(COL[cur])}<span></span></div>`),eb=mk(st.querySelector('svg'),true,0,undefined,true);

   body:JSON.stringify({messages:hist.slice(-12),image:im,image_gen:gen,system:b.prompt+sysx()+gpsTxt(),now:new Date().toISOString(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,model:cfg.model,imgModel:cfg.img,mode:webOn?'on':cfg.mode,keys:cfg.keys})});
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='';

   while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i);buf=buf.slice(i+1);if(!l)continue;const j=JSON.parse(l);if(j.s)stage(j.s);else fin=j}}
  if(buf.trim()){const j=JSON.parse(buf);if(!j.s)fin=j}

const plain=t=>CITS(t).replace(/\[\/?c(?:=#?\w+)?\]/g,'').replace(/```(?:\w*\n)?([\s\S]*?)```/g,'$1').replace(/`([^`\n]+)`/g,'$1').replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1');

body,.bt,.um,#tx,.mi,.bi,.u,#wl h2{color:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.mut,#wl p,.src,#sm h3,.stt,.sc span,#ft,#gp,#pv,.gxr div span{color:#d0d0d0}
.ac{color:#e6e6e6}
/* warna [c=...] */
.bt span[style*="#ff5a5a" i]{color:#ff1f1f!important}
.bt span[style*="#3ddc84" i]{color:#00ff66!important}
.bt span[style*="#4da3ff" i]{color:#1f8fff!important}
.bt span[style*="#ffd60a" i]{color:#ffee00!important}
.bt span[style*="#ff9f0a" i]{color:#ff8400!important}
.bt span[style*="#bf5af2" i]{color:#c13bff!important}
.bt span[style*="#ff6bb5" i]{color:#ff2a95!important}
.bt span[style*="#2ee6d6" i]{color:#00fbe6!important}
.bt span[style*="#d2915a" i]{color:#f98a2b!important}
.bt span[style*="#aaa" i]{color:#d0d0d0!important}
.bt span[style*="color"]{font-weight:600}
/* kata penting otomatis */
.hl0{color:#ffee00}.hl1{color:#ff2a95}.hl2{color:#ff8400}.hl3{color:#00ff66}.hl4{color:#c13bff}.hl5{color:#1f8fff}.hli{color:#00fbe6}.hlw{color:#ff1f1f}
.hl0,.hl1,.hl2,.hl3,.hl4,.hl5,.hli,.hlw{font-weight:600}
.bt a{color:#1d9bf0;font-weight:500}
</style>
<!-- TAMBAHAN 5: gulir ala Grok. Pertanyaan dikunci di atas, jawaban mengisi ke bawah tanpa menyeret layar, tombol panah muncul kalau ada isi di bawah. Font/gaya/warna tidak diubah. -->
<style>
#ms{overflow-anchor:none}
#dn{position:absolute;right:18px;bottom:100%;margin-bottom:12px;width:40px;height:40px;border-radius:50%;background:rgba(34,36,40,.96);border:1px solid #2f3336;display:grid;place-items:center;opacity:0;transform:translateY(6px) scale(.9);pointer-events:none;transition:opacity .18s,transform .18s;z-index:4}
#dn.on{opacity:1;transform:none;pointer-events:auto}
#dn.on:active{transform:scale(.92)}
</style>
<script>
(()=>{const ms=document.querySelector('#ms'),ft=document.querySelector('footer');
let AN=null,PB=12,follow=false,raf=0;
const btn=document.createElement('button');btn.id='dn';btn.setAttribute('aria-label','Ke bawah');
btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';ft.appendChild(btn);
const top0=()=>ms.getBoundingClientRect().top;
/* posisi bawah isi sebenarnya (tanpa ruang kosong buatan) */
const endY=()=>{const l=ms.lastElementChild;if(!l||l.id==='wl')return 0;return ms.scrollTop+l.getBoundingClientRect().bottom-top0()+(parseFloat(getComputedStyle(l).marginBottom)||0)};
const anchorT=()=>AN&&AN.isConnected?Math.max(0,ms.scrollTop+AN.getBoundingClientRect().top-top0()-10):0;
/* ruang kosong di bawah supaya pertanyaan bisa tetap di atas walau jawaban masih pendek */
const pad=()=>{let need=12;if(AN&&AN.isConnected)need=Math.max(12,Math.ceil(ms.clientHeight-(endY()-anchorT())));if(need!==PB){PB=need;ms.style.paddingBottom=need===12?'':need+'px'}};
const tgt=()=>Math.max(0,endY()+12-ms.clientHeight);
const upd=()=>btn.classList.toggle('on',endY()-(ms.scrollTop+ms.clientHeight)>40);
const run=()=>{raf=0;pad();if(follow){const d=tgt()-ms.scrollTop;if(d>1){ms.scrollTop+=d<3?d:d*.3;raf=requestAnimationFrame(run)}}upd()};
const sched=()=>{if(!raf)raf=requestAnimationFrame(run)};
window.sb=sched;
window.anchor=n=>{AN=n;follow=false;pad();ms.scrollTo({top:anchorT(),behavior:'smooth'});sched();return n};
window.sbReset=()=>{AN=null;PB=12;follow=false;ms.style.paddingBottom='';btn.classList.remove('on')};
ms.addEventListener('scroll',sched,{passive:true});
ms.addEventListener('touchmove',()=>{follow=false},{passive:true});
ms.addEventListener('wheel',()=>{follow=false},{passive:true});
btn.onclick=()=>{if(typeof busy!=='undefined'&&busy){follow=true;sched()}else ms.scrollTo({top:tgt(),behavior:'smooth'})};
})();
</script>

<!-- PERBAIKAN: warna kalem, tombol aksi kecil & rapat, tabel & diagram ala Grok -->
<style>
/* warna berlebihan -> dimatikan; warna eksplisit [c=] dibuat kalem */
.hl0,.hl1,.hl2,.hl3,.hl4,.hl5,.hli,.hlw{color:inherit!important;font-weight:inherit!important}
.bt span[style*="color"]{font-weight:inherit}
.bt span[style*="#ff5a5a" i]{color:#ff7b7b!important}.bt span[style*="#3ddc84" i]{color:#5fe0a0!important}.bt span[style*="#4da3ff" i]{color:#74b4ff!important}.bt span[style*="#ffd60a" i]{color:#f3d96b!important}.bt span[style*="#ff9f0a" i]{color:#f5a95c!important}.bt span[style*="#bf5af2" i]{color:#c99cf0!important}.bt span[style*="#ff6bb5" i]{color:#f08cc0!important}.bt span[style*="#2ee6d6" i]{color:#6fdcd2!important}.bt span[style*="#d2915a" i]{color:#d9a878!important}
.bt a{font-weight:inherit}
/* tombol salin/jempol dst: 50% lebih kecil, lebih rapat (area sentuh tetap nyaman) */
.ac{gap:4px 12px;margin:6px 0 12px 4px}
.ac button:not(.gxs){width:18px;height:18px}
.stt svg{width:23.4px;height:23.4px}/* bot status: 26px -10% */
.stt span{text-transform:lowercase}
.ac button:not(.gxs)::after{content:"";position:absolute;inset:-7px -4px}
/* judul & garis */
.bt .mhd{display:block;font-size:1.05em;margin:10px 0 2px}
.bt .mh{border:0;border-top:1px solid #2f3336;margin:14px 0}
/* tabel */
.bt .tbc{position:relative;margin:12px 0;border:1px solid #2f3336;border-radius:16px;background:#0b0b0c;overflow:hidden}
.tbw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbc table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.tbc th{font-weight:600;padding:13px 16px;white-space:nowrap;background:#111214;border-bottom:1px solid #2f3336;cursor:pointer;user-select:none;-webkit-user-select:none}
.tbc th .so{display:inline-block;vertical-align:-2px;margin-left:10px;opacity:.5}
.tbc th[data-d] .so{opacity:1;color:#1d9bf0}
.tbc th:last-child{padding-right:52px}
.tbc td{padding:13px 16px;border-bottom:1px solid #1f2226;vertical-align:top;min-width:130px;max-width:300px}
.tbc td:first-child{white-space:nowrap;font-weight:500;min-width:0}
.tbc tbody tr:last-child td{border-bottom:0}
.tbc .tbx{position:absolute;top:0;right:0;width:48px;height:47px;display:grid;place-items:center;color:#e6e6e6;background:linear-gradient(90deg,rgba(17,18,20,0),#111214 45%)}
.tbc.fs{position:fixed;inset:0;z-index:30;margin:0;border:0;border-radius:0;overflow:auto;background:#000;padding-top:env(safe-area-inset-top,0px)}
.tbc.fs .tbw{overflow:auto}
.tbc.fs .tbx{position:fixed;top:env(safe-area-inset-top,0px)}
/* diagram */
.bt .dg{margin:12px 0;border:1px solid #2f3336;border-radius:16px;background:#0b0b0c;overflow-x:auto}
.dgp{padding:18px;color:#8a8f98;font-size:14px}
.dgw{position:relative;display:flex;flex-direction:column;align-items:center;gap:36px;padding:24px 22px;min-width:max-content}
.dgr{display:flex;justify-content:center;gap:18px}
.dgn{color:#fff;font-size:13.5px;font-weight:500;line-height:1.35;text-align:center;padding:10px 16px;max-width:220px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.dgn.dd{border-radius:999px;border:1px dashed rgba(255,255,255,.45)}.dgn.dp{border-radius:999px}
.dgs{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
</style>
<script>
(()=>{const ms=document.querySelector('#ms');
ms.addEventListener('click',e=>{
 const x=e.target.closest('.tbx');if(x){x.closest('.tbc').classList.toggle('fs');return}
 const th=e.target.closest('.tbc th');if(!th)return;
 const t=th.closest('table'),i=[...th.parentNode.children].indexOf(th),d=th.dataset.d=th.dataset.d==='a'?'d':'a';
 t.querySelectorAll('th').forEach(h=>{if(h!==th)delete h.dataset.d});
 const tb=t.tBodies[0],rs=[...tb.rows],v=r=>(r.cells[i]&&r.cells[i].textContent||'').trim(),n=s=>parseFloat(s.replace(/[^\d.,-]/g,'').replace(',','.'));
 rs.sort((a,b)=>{const A=v(a),B=v(b),na=n(A),nb=n(B),r=(/\d/.test(A)&&/\d/.test(B)&&!isNaN(na)&&!isNaN(nb))?na-nb:A.localeCompare(B,'id');return d==='a'?r:-r});
 rs.forEach(r=>tb.append(r))});
})();
</script>

<style>html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}#ms,#mn,.tbw,.dg{touch-action:pan-x pan-y}</style>
<script>
/* kunci zoom: cegah cubit & ketuk-dua-kali memperbesar layar (iOS Safari) */
(()=>{const o={passive:false};
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,v=>v.preventDefault(),o));
document.addEventListener('touchmove',v=>{if(v.touches&&v.touches.length>1)v.preventDefault()},o);
let t=0;document.addEventListener('touchend',v=>{const n=Date.now();if(n-t<350&&!v.target.closest('input,textarea'))v.preventDefault();t=n},o);
})();
</script>
</body></html>
