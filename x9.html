<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obrolan">
<meta name="format-detection" content="telephone=no">
<title>Obrolan baru</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d6bfe'/%3E%3Cpath d='M16 7l2.2 6.8H25l-5.5 4 2.1 6.7L16 20.5 10.4 24.5l2.1-6.7L7 13.8h6.8z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#000000; --panel:#1f1c1f; --line:#3a373a; --bubble:#353235;
  --text:#faf7fa; --muted:#8c8a8d; --blue:#4d6bfe; --chip:#2a2f45;
  --code:#1b191c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
#app{position:fixed;top:0;left:0;right:0;height:100vh;height:var(--h,100dvh);max-width:520px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column}

/* top bar */
.top{position:absolute;z-index:20;top:0;left:0;right:0;padding:calc(max(14px,env(safe-area-inset-top)) + 4px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;pointer-events:none;
  background:linear-gradient(var(--bg) 60%,rgba(0,0,0,0))}
.top>*{pointer-events:auto}
.pill{height:44px;border-radius:22px;background:#1f1c1f;border:1px solid #2c292c;display:flex;align-items:center;justify-content:center}
.pill.one{width:44px}
.pill.two{width:87px;justify-content:space-between;padding:0 10px}
.pill svg{width:22px;height:22px}
.title{position:absolute;left:74px;font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.has-chat .title{opacity:1}

/* empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-bottom:40px}
.empty h1{margin:0;font-size:19px;font-weight:600}
.has-chat .empty{display:none}
.logo{width:110px;height:110px;object-fit:contain}

/* chat */
#chat{flex:1;overflow-y:auto;padding:calc(max(14px,env(safe-area-inset-top)) + 94px) 20px 190px;display:none;scrollbar-width:none}
#chat::-webkit-scrollbar{display:none}
.has-chat #chat{display:block}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.u{display:flex;justify-content:flex-end;margin:0 0 29px;animation:fi .25s ease both}
.u div{background:var(--bubble);padding:11px 16px;border-radius:22px 22px 5px 22px;max-width:82%;font-size:17px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.a{padding:0 4px;font-size:17px;line-height:1.7;margin:0 0 22px}

/* status berpikir (clone DeepSeek) */
.think-h{display:flex;align-items:center;gap:6px;height:24px;color:#bcbabd;font-size:16px;line-height:24px;margin:0 0 11px;cursor:pointer;user-select:none;-webkit-user-select:none}
.think-h svg{width:16px;height:16px;flex:none;color:#8f9095;transition:transform .22s ease}
.think-h.done.open svg{transform:rotate(90deg)}
.think-h.live{cursor:default}
.think-h.live .tl{background:linear-gradient(100deg,#77747a 0,#77747a 38%,#ebe9ec 50%,#77747a 62%,#77747a 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shim 1.7s linear infinite}
@keyframes shim{from{background-position:130% 0}to{background-position:-130% 0}}
.ph{display:flex;align-items:center;gap:4.5px;height:24px;margin:0 0 11px;color:#7b787c;font-size:15px}
.ph i{width:6px;height:6px;border-radius:50%;background:#6b686d;animation:bl 1s infinite}
.ph i:nth-child(2){animation-delay:.18s}.ph i:nth-child(3){animation-delay:.36s}
.pht{margin-left:8px}
.think-body{position:relative;margin:0 0 14px;overflow:hidden;max-height:4000px;transition:max-height .28s ease,opacity .2s ease,margin .28s ease}
.think-body::before{content:'';position:absolute;left:7px;top:15px;bottom:0;width:1px;background:#3a383c;z-index:1}
.think-body.sc::before,.think-body.done::before{top:0}
.think-body.collapsed{max-height:0;opacity:0;margin-bottom:0}
.tscroll{padding-left:24px;font-size:15px;line-height:22.7px;font-weight:400;color:#bcbabd;overflow:hidden}
.think-body.live .tscroll{max-height:126px;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 46px),transparent 100%);mask-image:linear-gradient(to bottom,#000 calc(100% - 46px),transparent 100%)}
.think-body.live.sc .tscroll{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24px,#000 calc(100% - 46px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 24px,#000 calc(100% - 46px),transparent 100%)}
.tscroll .inner{position:relative;white-space:pre-wrap;word-break:break-word}
.tscroll .inner::before{content:'';position:absolute;left:-19px;top:8px;width:6px;height:6px;border-radius:50%;background:#bcbabd}
.ar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 0}
.ag{display:flex;gap:18px}
.ab{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#909096}
.ab svg{width:19px;height:19px}
.ab.on{color:var(--text)}
.ab.flip svg{transform:scaleY(-1)}
.md p{margin:0 0 14px}
.md>:last-child{margin-bottom:0}
.source-icon{display:inline-block;width:14px;height:14px;object-fit:contain;vertical-align:-2px;margin-right:5px;border-radius:3px}
.md h1,.md h2,.md h3{margin:18px 0 10px;line-height:1.3}
.md h1{font-size:22px}.md h2{font-size:20px}.md h3{font-size:18px}
.md ul,.md ol{margin:0 0 14px;padding-left:24px}
.md li{margin:4px 0}
.md code.i{background:#2a272b;padding:2px 6px;border-radius:6px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.88em}
.md strong{font-weight:700}
.cursor{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--text);margin-left:3px;vertical-align:middle;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}

.cb{background:var(--code);border:1px solid #262327;border-radius:14px;margin:4px 0 16px;overflow:hidden}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:13px 14px 11px;font-size:14px;color:#c9c7ca;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.cb-h button{display:flex;align-items:center;gap:5px;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:14px}
.cb-h button svg{width:15px;height:15px}
.cb pre{margin:0;padding:12px 14px 16px;border-top:1px solid #2a272b;overflow-x:hidden;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13.5px;line-height:1.5;color:#e6e4e8;tab-size:2}
.tk-t{color:#6aa6ff}.tk-a{color:#e4a0ff}.tk-s{color:#a8d18a}.tk-c{color:#7d7a80}.tk-k{color:#6aa6ff}.tk-n{color:#e8b86d}

/* scroll button */
#down{position:absolute;z-index:15;right:16px;bottom:156px;width:44px;height:44px;border-radius:50%;
  background:var(--bg);border:2px solid var(--blue);display:none;align-items:center;justify-content:center}
#down.show{display:flex}
#down svg{width:20px;height:20px;color:var(--blue)}

/* composer: jarak ke keyboard = 12px seperti DeepSeek (kelas .kb dipasang saat keyboard terbuka) */
.composer{position:absolute;z-index:20;left:0;right:0;bottom:0;padding:0 12px max(12px,env(safe-area-inset-bottom));
  background:linear-gradient(rgba(0,0,0,0),var(--bg) 22%)}
.kb .composer{padding-bottom:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:19px 11px 10px}
#inp{width:100%;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:17px;line-height:24px;
  height:24px;max-height:140px;display:block;padding:0 6px;caret-color:var(--blue)}
#inp::placeholder{color:#7b787c}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:21px}
.chips{display:flex;gap:8px}
.chip{height:32px;padding:0 10px;border-radius:16px;background:var(--chip);color:#6a99ff;border:1px solid #364269;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:500}
.chip svg{width:20px;height:20px}
.chip.off{background:transparent;border-color:#33303a;color:#9a98a0}
.acts{display:flex;gap:11px;align-items:center}
.ic{width:36px;height:32px;display:flex;align-items:center;justify-content:center}
.ic svg{width:26px;height:26px}
#send{width:30px;height:30px;border-radius:50%;background:var(--blue);display:none;align-items:center;justify-content:center;margin-right:2px}
#send svg{width:18px;height:18px;color:#fff}
.typing #send{display:flex}.typing #voice{display:none}
.busy #send{display:flex}.busy #voice{display:flex}

/* drawer */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#drawer{position:absolute;z-index:41;top:0;bottom:0;left:0;width:82%;max-width:340px;background:#1a171a;transform:translateX(-102%);transition:transform .28s ease;
  padding:max(18px,env(safe-area-inset-top)) 16px 18px;display:flex;flex-direction:column}
.drawer-open #scrim{opacity:1;pointer-events:auto}
.drawer-open #drawer{transform:none}
#drawer h3{margin:8px 6px 14px;font-size:15px;color:var(--muted);font-weight:500}
#hist{flex:1;overflow:auto}
.hi{display:flex;align-items:center;justify-content:space-between;padding:12px 10px;border-radius:12px;font-size:16px;gap:8px}
.hi.cur{background:#262327}
.hi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.hi b{color:var(--muted);font-weight:400;font-size:20px;padding:0 6px}
.dbtn{margin-top:10px;height:46px;border-radius:14px;background:#262327;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}

/* settings modal */
#modal{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
#modal.show{display:flex}
.sheet{width:100%;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:#1e1b1e;border-radius:24px 24px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:19px}
.sheet p{margin:0 0 16px;font-size:14px;color:var(--muted);line-height:1.45}
.sheet label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.sheet input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:#161316;color:var(--text);padding:0 12px;font-size:15px;outline:0}
.sheet input:focus{border-color:var(--blue)}
.sheet textarea.master-prompt{width:100%;min-height:170px;resize:vertical;border-radius:14px;border:1px solid var(--line);background:#161316;color:var(--text);padding:13px 12px;font:inherit;font-size:14px;line-height:1.5;outline:0}
.sheet textarea.master-prompt:focus{border-color:var(--blue)}
.sheet textarea.master-prompt::placeholder{color:#77737a}
.master-hint{font-size:12px;color:var(--muted);line-height:1.45;margin-top:7px}
.sheet .btns{display:flex;gap:10px;margin-top:14px;padding-top:14px;position:sticky;bottom:0;background:#1e1b1e}
.sheet .btns button{flex:1;height:46px;border-radius:14px;background:#2a272b;font-size:16px}
.sheet .btns .pri{background:var(--blue);font-weight:600}
.toast{position:absolute;z-index:80;left:50%;top:calc(max(14px,env(safe-area-inset-top)) + 64px);transform:translateX(-50%);background:#333035;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast{width:max-content;max-width:88%;text-align:center}
.sec{margin:22px 0 0;font-size:12.5px;font-weight:600;color:#c9c7ca;letter-spacing:.04em;text-transform:uppercase}
.kl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.sheet .kl label{margin:0}
.kl+input{margin-top:4px}
.dotb{width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin:-6px -8px -6px 0}
.dot{width:13px;height:13px;border-radius:50%;background:#6b686d;display:block;flex:none}
.dot.ok{background:#2ecc71;box-shadow:0 0 8px #2ecc7188}
.dot.bad{background:#ff4d4f;box-shadow:0 0 8px #ff4d4f88}
.dot.load{background:#e8b84d;animation:bl .8s infinite}
.mlist{margin-top:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0 9px 2px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.mrow .ml{flex:1}
.mrow .ck{width:18px;height:18px;opacity:0;flex:none}
.mrow .ck svg{width:18px;height:18px}
.mrow.sel .ck{opacity:1}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 0 9px 2px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.rrow .ml{flex:1}
.rrow .ck{width:18px;height:18px;opacity:0;flex:none}
.rrow .ck svg{width:18px;height:18px}
.rrow.sel .ck{opacity:1}
.reff{display:none;margin:0 0 0 18px}
.reff.show{display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:0}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px;box-shadow:none}
.md a{color:#7f95ff;text-decoration:none;word-break:break-all}
.srch{color:var(--muted)}
</style>
</head>

  <div class="top">
    <button class="pill one" id="menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 8h14M5 16h8"/></svg>

<script>

/* ---------- markdown ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code class="i">$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/!favicon\(([a-zA-Z0-9.-]+)\)/g,'<img class="source-icon" alt="" width="14" height="14" src="https://www.google.com/s2/favicons?domain=$1&sz=32">');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s"]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function hl(code,lang){
  const isH=/html|xml|svg/.test(lang);
  const re=isH
    ?/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([a-zA-Z][\w-]*|!DOCTYPE)|(\s)([\w:-]+)(=)|("[^"\n]*"|'[^'\n]*')|(&gt;)/g
    :/(\/\/[^\n]*|#[^\n]*)|()()()()()("[^"\n]*"|'[^'\n]*')()|\b(const|let|var|function|return|if|else|for|while|def|class|import|from|new|await|async|true|false|null)\b|\b(\d+)\b/g;
  const e=esc(code);
  if(isH){
    return e.replace(re,(m,c,o,t,sp,an,eq,st)=>{
      if(c)return '<i class="tk-c">'+c+'</i>';
      if(o)return o+'<i class="tk-t">'+t+'</i>';
      if(an)return sp+'<i class="tk-a">'+an+'</i>'+eq;
      if(st)return '<i class="tk-s">'+st+'</i>';
      return m;
    });
  }
  return e.replace(re,(m,c,a1,a2,a3,a4,a5,st,a6,kw,num)=>{
    if(c)return '<i class="tk-c">'+c+'</i>';
    if(st)return '<i class="tk-s">'+st+'</i>';
    if(kw)return '<i class="tk-k">'+kw+'</i>';
    if(num)return '<i class="tk-n">'+num+'</i>';
    return m;
  });
}
function render(md,streaming){
  const out=[]; const lines=md.split('\n'); let i=0, para=[], list=null;
  const flushP=()=>{if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}};
  const flushL=()=>{if(list){out.push(`<${list.t}>`+list.i.map(x=>'<li>'+inline(x)+'</li>').join('')+`</${list.t}>`);list=null}};
  while(i<lines.length){
    const L=lines[i];
    const f=L.match(/^```(\w*)/);
    if(f){
      flushP();flushL();
      const lang=f[1]||'text'; const buf=[]; i++;
      let closed=false;
      while(i<lines.length){ if(/^```/.test(lines[i])){closed=true;break} buf.push(lines[i]);i++ }
      const code=buf.join('\n');
      out.push(`<div class="cb"><div class="cb-h"><span>${esc(lang)}</span><button class="cp">${COPY}Salin</button></div><pre data-raw="${encodeURIComponent(code)}">${hl(code,lang)}</pre></div>`);
      i++; continue;
    }
    let m;
    if((m=L.match(/^(#{1,3})\s+(.*)/))){flushP();flushL();out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`)}
    else if((m=L.match(/^\s*[-*]\s+(.*)/))){flushP();if(!list||list.t!=='ul'){flushL();list={t:'ul',i:[]}}list.i.push(m[1])}
    else if((m=L.match(/^\s*\d+\.\s+(.*)/))){flushP();if(!list||list.t!=='ol'){flushL();list={t:'ol',i:[]}}list.i.push(m[1])}
    else if(!L.trim()){flushP();flushL()}
    else{flushL();para.push(L)}
    i++;
  }
  flushP();flushL();
  return out.join('')+(streaming?'<span class="cursor"></span>':'');
}
chat.addEventListener('click',e=>{

    const t=document.createElement('textarea');t.value=raw;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch{}t.remove();

  const old=b.innerHTML; b.innerHTML=COPY+'Tersalin'; setTimeout(()=>b.innerHTML=old,1400);
});

function buildTurn(msg,isLast){
  const a=document.createElement('div'); a.className='a'; a._msg=msg;
  const th=(msg.think&&!LEGACY.test(msg.think))?msg.think:'';
  if(th){
    a.insertAdjacentHTML('beforeend',
      `<div class="think-h done"><span class="tl">${msg.stopped?'Dihentikan setelah':'Berpikir selama'} ${msg.secs||1} detik</span>${CHEV_R}</div><div class="think-body done collapsed"><div class="tscroll"><div class="inner"></div></div></div>`);
    a.querySelector('.inner').textContent=th;
    const h=a.querySelector('.think-h'), b=a.querySelector('.think-body');
    h.onclick=()=>{b.classList.toggle('collapsed');h.classList.toggle('open')};
  }
  const md=document.createElement('div'); md.className='md'; md.innerHTML=render(msg.text||'');
  a.appendChild(md);
  if(msg.text)a.insertAdjacentHTML('beforeend',actionsHTML(isLast));
  return a;
}
function openConvo(c){
  cur=c; chat.innerHTML='';
  $('#ttl').textContent=c.title||'Obrolan baru';
  if(c.msgs.length){showChat()}else app.classList.remove('has-chat');
  c.msgs.forEach((m,mi)=>{
    if(m.role==='user'){chat.insertAdjacentHTML('beforeend','<div class="u"><div></div></div>');chat.lastChild.firstChild.textContent=m.text}
    else chat.appendChild(buildTurn(m,mi===c.msgs.length-1));
  });
  stick=true; follow=false; requestAnimationFrame(()=>scrollBottom(true));
  closeDrawer(); renderHist();
}
function newChat(){
  if(busy&&abort)abort();
  cur={id:Date.now(),title:'Obrolan baru',msgs:[]};

function renderHist(){
  const h=$('#hist'); h.innerHTML='';
  if(!convos.length){h.innerHTML='<div style="color:var(--muted);padding:10px;font-size:15px">Belum ada obrolan.</div>';return}

    d.lastChild.onclick=()=>{convos=convos.filter(x=>x!==c);persist();if(cur===c)newChat();renderHist()};

function demoPlan(q){
  const lq=q.toLowerCase();
  if(/^\s*(hai|halo|hi|hello|hey|p)\s*[!.]*\s*$/.test(lq)){
    return {
      think:`Hmm, the user just said "${q}" which is a simple greeting. This is a very straightforward opening. I should respond warmly and openly to invite further conversation. A friendly greeting back with an offer to help would be appropriate here.\n\nI can use a casual, welcoming tone with an emoji to match the informal nature of the greeting. The key is to acknowledge the greeting and immediately pivot to being helpful by asking what they need.`,
      text:`Hai! Ada yang bisa saya bantu hari ini? 😊`
    };
  }
  if(/html|web|situs|halaman|landing/.test(lq)){
    const long=/panjang|long|lengkap/.test(lq);
    return {
      think:`User asks in Indonesian: "${q}". They want a ${long?'very long, substantial':'complete'} HTML document. I should create a single-page website with many sections, CSS, and JS.\n\nI'll write it all out. Keep it self-contained, no external dependencies (use inline SVG or emoji). Make it long — many sections.\n\nLet me plan sections:\n1. Preloader\n2. Sticky navigation with dark mode toggle\n3. Hero\n4. Animated counters\n5. Services grid\n6. Tabbed content\n7. Accordion FAQ\n8. Pricing cards\n9. Testimonial slider\n10. Contact form with validation\n11. Footer\n12. Back to top button\n13. JS at bottom\n\nWrite clean code with CSS variables, dark mode support, and responsive layout.`,
      text:`Here's a complete, very long HTML page—a responsive single-page site for a fictional digital studio. It includes a preloader, sticky navigation with dark mode, animated counters, tabbed content, an accordion FAQ, pricing cards, a testimonial slider, a contact form with validation, and a back-to-top button. Everything runs with plain HTML, CSS, and JavaScript.\n\n\`\`\`html\n${DEMO_HTML}\n\`\`\``
    };
  }
  return {
    think:`User asks in Indonesian: "${q}". Let me think about what they want and how to answer clearly.\n\nI should give a direct, well-organized answer. Keep it helpful and concise.`,
    text:`Mode demo aktif, jadi saya belum terhubung ke model sungguhan. Buka menu lalu pilih **Pengaturan API** dan isi API key Gemini atau Groq agar bot bisa menjawab pertanyaan apa pun.\n\nSebagai contoh, coba kirim: \`buatkan html sangat panjang\`.`
  };
}

      const n=2+Math.floor(Math.random()*5); ui.think(p.think.slice(i,i+n)); i+=n; await sleep(16);

    const n=p.text.startsWith('Mode')?3:5+Math.floor(Math.random()*10); ui.text(p.text.slice(i,i+n)); i+=n; await sleep(14);
  }
}

const DEFAULT_MODEL='groq|qwen/qwen3.8-27b';

/* status titik: id -> {s:'ok'|'bad'|'load', msg}
   id: p|provider (kunci)  m|provider|model  s|pencarian */
const stat={};
function setStat(id,s,msg){
  stat[id]={s,msg:msg||''};
  document.querySelectorAll('.dotb[data-t="'+id+'"] .dot').forEach(d=>{d.className='dot '+s;d.parentNode.title=msg||''});
}
function dot(id){const s=stat[id];return `<button class="dotb" data-t="${esc(id)}" title="${esc(s?s.msg:'Ketuk untuk tes')}" aria-label="Tes"><i class="dot ${s?s.s:''}"></i></button>`}

function why(code,txt){
  const t=(txt||'').toLowerCase();
  if(code===429||/quota|rate.?limit|exhausted|too many/.test(t))return {kind:'quota',msg:'Kuota habis / terkena limit'};
  if(code===401||code===403||/api key|api_key|unauthor|invalid.*key|permission/.test(t))return {kind:'key',msg:'API key salah / tidak punya akses'};
  if(code===404||code===400||/model/.test(t))return {kind:'model',msg:'Model tidak cocok / tidak tersedia'};
  return {kind:'other',msg:code?'Error HTTP '+code:'Gagal terhubung'+(txt?': '+String(txt).slice(0,80):'')};
}
function apiErr(code,body){const w=why(code,body);const e=new Error(w.msg+(code?' (HTTP '+code+')':''));e.kind=w.kind;e.code=code;return e}

function loadCfg(){const c=store.get('cfg2',null)||{};return {gemini:c.gemini||'',groq:c.groq||'',model:c.model||DEFAULT_MODEL,search:c.search||{},reasonMode:c.reasonMode==='manual'?'manual':'auto',reasonEffort:['low','medium','high'].includes(c.reasonEffort)?c.reasonEffort:'medium',masterPrompt:(c.masterPrompt&&c.masterPrompt!==OLD_MASTER_PROMPT)?c.masterPrompt:DEFAULT_MASTER_PROMPT}}
const label=t=>PROVIDERS[t.p].name+' · '+t.m.split('/').pop();

/* urutan fallback: model terpilih → model lain di penyedia sama → penyedia lain.
   Model yang sudah ketahuan merah (dari tes/error) dipindah ke paling akhir. */
function buildChain(cfg){
  const [sp,sm]=(cfg.model||'').split('|'), chain=[];
  const push=(p,m)=>{if(cfg[p]&&!chain.some(x=>x.p===p&&x.m===m))chain.push({p,m})};
  if(PROVIDERS[sp]){push(sp,sm);PROVIDERS[sp].models.forEach(m=>push(sp,m[0]))}
  Object.keys(PROVIDERS).forEach(p=>PROVIDERS[p].models.forEach(m=>push(p,m[0])));
  const bad=x=>(stat['m|'+x.p+'|'+x.m]||{}).s==='bad';
  return [...chain.filter(x=>!bad(x)),...chain.filter(bad)];
}

async function ping(p,model,key){
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),20000);
  try{
    const r=await fetch(PROVIDERS[p].url+'/chat/completions',{method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},
      body:JSON.stringify({model,messages:[{role:'user',content:'Balas: ok'}],max_tokens:16})});
    if(!r.ok)throw apiErr(r.status,(await r.text()).slice(0,300));
  }catch(e){
    if(e.kind)throw e;
    throw apiErr(0,e.name==='AbortError'?'timeout':e.message);
  }finally{clearTimeout(tm)}
}

/* ---------- pencarian web ---------- */
async function jpost(url,headers,body,sig){
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),20000);
  if(sig)sig.ctl=ctl;
  try{
    const r=await fetch(url,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',...headers},body:JSON.stringify(body)});
    if(!r.ok)throw apiErr(r.status,(await r.text()).slice(0,300));
    return await r.json();
  }catch(e){
    if(e.kind)throw e;
    if(sig&&sig.stop)throw e;
    throw apiErr(0,e.name==='AbortError'?'timeout':e.message);
  }finally{clearTimeout(tm)}
}

/* ---------- streaming ke model ---------- */
const partial=(s,tag)=>{for(let k=Math.min(tag.length-1,s.length);k>0;k--)if(tag.startsWith(s.slice(-k)))return k;return 0};
async function streamAPI(c,ui,sig,t,cfg,ctx){
  const msgs=c.msgs.filter(m=>m.text).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));
  const master=(cfg.masterPrompt||'').trim();
  if(master)msgs.unshift({role:'system',content:master});
  if(ctx)msgs.splice(master?1:0,0,{role:'system',content:ctx});
  const ctl=new AbortController(); sig.ctl=ctl;
  let r;
  try{
    r=await fetch(PROVIDERS[t.p].url+'/chat/completions',{
      method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg[t.p]},
      body:JSON.stringify(Object.assign({model:t.m,messages:msgs,stream:true,max_tokens:6000,temperature:0.2},(t.p==='groq'&&cfg.reasonMode==='manual')?{reasoning_effort:/gpt-oss/.test(t.m)?cfg.reasonEffort:'default'}:{}))
    });
  }catch(e){ if(sig.stop)throw e; throw apiErr(0,e.message) }
  if(!r.ok)throw apiErr(r.status,(await r.text()).slice(0,300));

  let thinking=true, inThink=false, pend='';
  const out=s=>{ if(!s)return; if(!ui.got()&&!s.trim())return; if(thinking){ui.endThink();thinking=false} ui.text(s) };
  const tout=s=>{ if(s&&useThink&&!ui.got())ui.think(s) };
  // model seperti Qwen kadang menaruh penalaran di dalam <think>…</think>
  const feed=s=>{
    pend+=s;
    for(;;){
      if(!inThink){
        const i=pend.indexOf('<think>');
        if(i>=0){out(pend.slice(0,i));pend=pend.slice(i+7);inThink=true;continue}
        const k=partial(pend,'<think>');out(pend.slice(0,pend.length-k));pend=pend.slice(pend.length-k);break;
      }else{
        const i=pend.indexOf('</think>');
        if(i>=0){tout(pend.slice(0,i));pend=pend.slice(i+8);inThink=false;continue}
        const k=partial(pend,'</think>');tout(pend.slice(0,pend.length-k));pend=pend.slice(pend.length-k);break;
      }
    }
  };
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf='';
  try{
    while(true){
      const {done,value}=await rd.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,idx).trim(); buf=buf.slice(idx+1);
        if(!line.startsWith('data:'))continue;
        const d=line.slice(5).trim(); if(d==='[DONE]')continue;
        let o; try{o=JSON.parse(d)}catch{continue}
        if(o.error)throw apiErr(Number(o.error.code)||0,JSON.stringify(o.error).slice(0,300));
        const j=(o.choices&&o.choices[0]&&o.choices[0].delta)||{};
        const rs=j.reasoning_content||j.reasoning;
        if(rs)tout(rs);
        if(j.content)feed(j.content);
      }
    }
  }catch(e){
    if(sig.stop||e.kind)throw e;
    throw apiErr(0,e.message);
  }
  if(inThink){tout(pend)}else{out(pend)}
  if(!ui.any())throw apiErr(0,'respons kosong');
}

// fallback otomatis: kalau satu model/penyedia error, pindah ke berikutnya
async function runChain(c,ui,sig,chain,cfg,ctx){
  const dead=new Set(); let last=null;
  for(let i=0;i<chain.length;i++){
    const t=chain[i]; if(dead.has(t.p))continue; if(sig.stop)return;
    try{
      await streamAPI(c,ui,sig,t,cfg,ctx);
      if(sig.stop)return;
      setStat('m|'+t.p+'|'+t.m,'ok','Berfungsi');
      return;
    }catch(e){
      if(sig.stop)return;
      if(ui.got())throw e;               // jawaban sudah separuh jalan: jangan diulang
      last=e; setStat('m|'+t.p+'|'+t.m,'bad',e.message);
      if(e.kind==='key'){dead.add(t.p);setStat('p|'+t.p,'bad',e.message)}
      ui.reset();
      const nx=chain.slice(i+1).find(x=>!dead.has(x.p));
      if(nx){ui.status('Model utama gagal. Mencoba model cadangan…');toast(label(t)+' gagal ('+e.message+'). Pindah ke '+label(nx),3200);}
    }
  }
  throw new Error('Semua model gagal. Terakhir: '+(last?last.message:'-'));
}

async function genTitle(q,ans,cfg,chain){
  const prompt='Buat judul obrolan yang sangat singkat (2 sampai 4 kata, bahasa Indonesia, tanpa tanda kutip, tanpa titik) berdasarkan percakapan ini.\n\nPengguna: '+q.slice(0,300)+'\nAsisten: '+ans.slice(0,300)+'\n\nJudul:';
  let tried=0;
  for(const t of chain){
    if((stat['m|'+t.p+'|'+t.m]||{}).s==='bad')continue;
    if(++tried>2)break;
    const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),15000);
    try{
      const r=await fetch(PROVIDERS[t.p].url+'/chat/completions',{method:'POST',signal:ctl.signal,
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg[t.p]},
        body:JSON.stringify({model:t.m,messages:[{role:'user',content:prompt}],max_tokens:400,temperature:0.3})});
      if(!r.ok)continue;
      const j=await r.json();
      let x=((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'').replace(/<think>[\s\S]*?(<\/think>|$)/g,'');
      x=(x.split('\n').map(v=>v.trim()).filter(Boolean)[0]||'').replace(/^judul\s*:\s*/i,'').replace(/^["'“”*#\s]+|["'“”*.\s]+$/g,'');
      if(x)return x.slice(0,40);
    }catch{}finally{clearTimeout(tm)}
  }
  return null;
}
async function autoTitle(c,q,ans,cfg,chain){
  c.autoTitled=true;

  if(!t)return;

}

    q=lu.text;
    const la=[...chat.querySelectorAll('.a')].pop(); if(la)la.remove();
    if(cur.msgs.length&&cur.msgs[cur.msgs.length-1].role==='assistant')cur.msgs.pop();
  }else{
    q=inp.value.trim(); if(!q)return;
    if(busy){return}
    if(!cur)newChat();
    inp.value='';grow();inp.blur();
    const first=cur.msgs.length===0;
    cur.msgs.push({role:'user',text:q});
    // judul header tetap "Obrolan baru" sampai jawaban selesai (seperti DeepSeek)
    if(first){cur.title=q.slice(0,40);convos.unshift(cur)}
    showChat();
    chat.insertAdjacentHTML('beforeend','<div class="u"><div></div></div>'); chat.lastChild.firstChild.textContent=q;
  }
  const c=cur;

  // assistant shell: titik-titik dulu, header "Memikirkan" baru muncul saat penalaran pertama datang
  const a=document.createElement('div'); a.className='a';
  a.innerHTML=`<div class="ph"><i></i><i></i><i></i><span class="pht"></span></div><div class="think-h live" style="display:none"><span class="tl">Memikirkan</span>${CHEV}</div><div class="think-body live" style="display:none"><div class="tscroll"><div class="inner"></div></div></div><div class="md"></div>`;
  chat.appendChild(a);
  const ph=a.querySelector('.ph'), pht=a.querySelector('.pht'), th=a.querySelector('.think-h'), tb=a.querySelector('.think-body'), ts=tb.querySelector('.tscroll'), ti=tb.querySelector('.inner'), md=a.querySelector('.md');
  let thinkTxt='', ansTxt='', t0=Date.now(), secs=0, thinkDone=!useThink, thinkShown=false;
  const msg={role:'assistant',text:'',think:'',secs:0}; c.msgs.push(msg); a._msg=msg;
  follow=true; stick=true; scrollBottom(true);
  busy=true; syncState();
  const sig={stop:false}; abort=()=>{sig.stop=true;if(sig.ctl)sig.ctl.abort()};
  th.onclick=()=>{ if(thinkDone&&thinkShown){tb.classList.toggle('collapsed');th.classList.toggle('open')} };

  const ui={
    status(v){ if(ansTxt||thinkShown)return; pht.textContent=(v&&!/^Menghubungkan/.test(v))?v:'' },
    // penalaran asli dari model (reasoning_content / <think>) ditampilkan mengalir
    think(t){
      if(!useThink||thinkDone||ansTxt||!t)return;
      if(!thinkTxt)t=t.replace(/^\s+/,'');
      if(!t)return;
      if(!thinkShown){thinkShown=true;ph.style.display='none';th.style.display='';tb.style.display=''}
      thinkTxt+=t; ti.textContent=thinkTxt; ts.scrollTop=ts.scrollHeight; tb.classList.toggle('sc',ts.scrollTop>2); followTurn(a);
    },
    endThink(){
      if(thinkDone)return; thinkDone=true;
      secs=Math.max(1,Math.round((Date.now()-t0)/1000)); msg.secs=secs; msg.stopped=!!sig.stop;
      ph.style.display='none';
      if(thinkShown){
        th.innerHTML=`<span class="tl">${sig.stop?'Dihentikan setelah':'Berpikir selama'} ${secs} detik</span>${CHEV_R}`;
        th.classList.remove('live'); th.classList.add('done');
        tb.classList.remove('live','sc'); tb.classList.add('done','collapsed');
      }else{th.style.display='none';tb.style.display='none'}
    },
    text(t){ph.style.display='none';ansTxt+=t;msg.text=ansTxt;md.innerHTML=render(ansTxt,true);followTurn(a)},
    got(){return ansTxt.length>0},
    any(){return ansTxt.length>0||thinkTxt.length>0},
    reset(){ansTxt='';msg.text='';md.innerHTML='';thinkTxt='';ti.textContent='';thinkShown=false;thinkDone=!useThink;
      th.style.display='none';tb.style.display='none';ph.style.display='flex'}
  };

  const cfg=loadCfg(), chain=buildChain(cfg);
  try{
    if(chain.length){
      let ctx='', found=null;
      if(useSearch&&hasSearch(cfg)&&shouldSearch(q)){
        ui.status('Mencari informasi…');
        found=await doSearch(q.slice(0,300),cfg,sig);
        if(found)ctx=searchContext(found); else if(!sig.stop)toast('Pencarian gagal, lanjut tanpa web',2200);
      }
      if(!sig.stop){
        ui.status('Menghubungkan ke model…');
        await runChain(c,ui,sig,chain,cfg,ctx);
        if(found&&!sig.stop&&ui.got())ui.text('\n\n**Sumber:**\n'+found.res.map((x,i)=>{let host='';try{host=new URL(x.url).hostname}catch{}return `${i+1}. ${host?'!favicon('+host+') ':''}[${x.title.replace(/[\[\]]/g,'')}](${x.url.replace(/[\s")]/g,'')})`}).join('\n'));
      }
    }else await streamDemo(q,ui,sig);
  }catch(e){
    if(!sig.stop){ansTxt+=(ansTxt?'\n\n':'')+'Terjadi kesalahan: '+e.message;msg.text=ansTxt}
  }
  const failed=/^Terjadi kesalahan/.test(ansTxt)&&!thinkTxt;
  ui.endThink();
  msg.think=thinkTxt;
  md.innerHTML=render(ansTxt||'',false);
  if(ansTxt){chat.querySelectorAll('.rg').forEach(x=>x.remove());a.insertAdjacentHTML('beforeend',actionsHTML(true))}
  busy=false;abort=null;syncState();persist();renderHist();followTurn(a);
  if(ansTxt&&!sig.stop&&!failed&&!c.autoTitled)autoTitle(c,q,ansTxt,cfg,chain);
}

/* ---------- ikon aksi di bawah jawaban ---------- */
function plainText(t){return String(t||'').replace(/```[\s\S]*?```/g,' ').replace(/[*#`]/g,'').replace(/!favicon\([^)]*\)/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')}
function copyText(txt){
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{
    const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch{}t.remove();
  });
}
chat.addEventListener('click',e=>{
  const b=e.target.closest('.ab'); if(!b)return;
  const a=b.closest('.a'), msg=a&&a._msg, k=b.dataset.a;
  if(k==='copy'){copyText(msg?msg.text:a.innerText);toast('Tersalin')}
  else if(k==='up'||k==='down'){
    const on=!b.classList.contains('on');
    a.querySelectorAll('[data-a=up],[data-a=down]').forEach(x=>x.classList.remove('on'));
    if(on)b.classList.add('on');
  }
  else if(k==='spk'){
    if(!('speechSynthesis' in window)){toast('Suara tidak didukung');return}
    if(speechSynthesis.speaking){speechSynthesis.cancel();b.classList.remove('on');return}
    const u=new SpeechSynthesisUtterance(plainText(msg?msg.text:a.innerText)); u.lang='id-ID';
    u.onend=u.onerror=()=>b.classList.remove('on'); b.classList.add('on'); speechSynthesis.speak(u);
  }
  else if(k==='shr'){
    const txt=msg?msg.text:a.innerText;
    if(navigator.share)navigator.share({text:txt}).catch(()=>{}); else{copyText(txt);toast('Tersalin')}
  }
  else if(k==='regen')send({regen:true});
});

/* ---------- events ---------- */
inp.addEventListener('input',()=>{grow();syncState()});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android|iPhone/.test(navigator.userAgent)){e.preventDefault();send()}});
$('#send').onclick=()=>{ if(busy){abort&&abort()} else send() };
$('#cThink').onclick=e=>{useThink=!useThink;e.currentTarget.classList.toggle('on',useThink);e.currentTarget.classList.toggle('off',!useThink)};
$('#cSearch').onclick=e=>{useSearch=!useSearch;e.currentTarget.classList.toggle('on',useSearch);e.currentTarget.classList.toggle('off',!useSearch)};
$('#plus').onclick=()=>toast('Lampiran belum tersedia');
$('#voice').onclick=()=>toast('Input suara belum tersedia');
let muted=true;
$('#mute').onclick=()=>{muted=!muted;$('#mx').style.display=muted?'':'none';toast(muted?'Suara dimatikan':'Suara dinyalakan')};
$('#new').onclick=newChat; $('#dNew').onclick=newChat;
const openDrawer=()=>{app.classList.add('drawer-open');renderHist()}, closeDrawer=()=>app.classList.remove('drawer-open');
$('#menu').onclick=openDrawer; $('#scrim').onclick=closeDrawer;
$('#dSet').onclick=openSettings;
$('#setBody').addEventListener('click',e=>{
  const d=e.target.closest('.dotb'); if(d){testTarget(d.dataset.t);return}
  const rr=e.target.closest('.rrow'); if(rr){if(rr.dataset.rm)draft.rm=rr.dataset.rm; if(rr.dataset.re)draft.re=rr.dataset.re; paintReason(); return}
  const m=e.target.closest('.mrow'); if(m){draft.model=m.dataset.m;paintModels()}
});
$('#sCancel').onclick=()=>$('#modal').classList.remove('show');
$('#sSave').onclick=()=>{
  const c={model:draft.model,search:{}};
  for(const p in PROVIDERS)c[p]=$('#k_'+p).value.trim();
  for(const k in SEARCH)c.search[k]=$('#k_'+k).value.trim();
  c.masterPrompt=$('#masterPrompt').value.trim();
  c.reasonMode=draft.rm; c.reasonEffort=draft.re;
  store.set('cfg2',c);$('#modal').classList.remove('show');toast('Tersimpan');
};

// ikon layar utama + header/kotak ketik mengikuti layar yang terlihat (keyboard) tanpa header ikut bergeser
(()=>{
  const lg=document.querySelector('.logo');
  if(lg&&lg.src){const l=document.createElement('link');l.rel='apple-touch-icon';l.href=lg.src;document.head.appendChild(l)}
  const vv=window.visualViewport, root=document.documentElement;
  const fit=()=>{
    const h=vv?vv.height:window.innerHeight, off=vv?vv.offsetTop:0;
    root.style.setProperty('--h',h+'px');
    app.style.transform=off>0.5?'translate3d(0,'+off+'px,0)':'';
    root.classList.toggle('kb',(window.innerHeight-h)>100);
    if(window.pageYOffset)window.scrollTo(0,0);
  };
  window.__fit=fit;
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',()=>setTimeout(fit,250));
  inp.addEventListener('focus',()=>{fit();setTimeout(fit,60);setTimeout(fit,320)});
  inp.addEventListener('blur',()=>{setTimeout(fit,60);setTimeout(fit,320)});
  fit();
})();
newChat(); syncState();
})();
